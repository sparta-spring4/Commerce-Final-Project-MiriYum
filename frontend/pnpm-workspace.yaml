# pnpm 11부터 package.json의 "pnpm" 필드를 읽지 않는다. 설정은 이 파일이 소유한다.

# openapi-typescript는 TypeScript 컴파일러 API로 AST를 만든다. TypeScript 7이 그 표면을
# 바꿔 ts.factory와 ts.SyntaxKind를 읽지 못하고 즉시 실패한다(@hey-api/openapi-ts도 동일).
# 생성기에게만 TypeScript 5를 주어 격리한다. 생성 결과는 평범한 .ts라서 프로젝트의
# TypeScript 7이 그대로 컴파일한다.
overrides:
  openapi-typescript>typescript: 5.9.3

# msw의 postinstall은 브라우저 mocking용 service worker를 만든다.
# 테스트에서 msw/node만 사용하므로 실행하지 않는다.
ignoredBuiltDependencies:
  - msw
