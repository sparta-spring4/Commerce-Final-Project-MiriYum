openapi: 3.1.0
info:
  title: MiriYum Member Support API
  version: 1.0.0
  description: 회원 최소 조회, 이메일 접근 불가 복구, 계정 제재와 이의 사건 관리 계약이다.
  license:
    name: All rights reserved
    identifier: LicenseRef-All-Rights-Reserved
servers:
  - url: /
security: []
paths:
  /api/v1/consumers/account-recovery-verifications:
    post:
      tags: [Member Recovery]
      summary: 소비자 수동 복구 mock 확인
      operationId: verifyConsumerAccountRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerRecoveryVerificationRequest"
      responses:
        "202":
          $ref: "#/components/responses/PrivateAccepted"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/store-operators/account-recovery-verifications:
    post:
      tags: [Member Recovery]
      summary: 식당 운영자 수동 복구 mock 확인
      operationId: verifyStoreOperatorAccountRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreOperatorRecoveryVerificationRequest"
      responses:
        "202":
          $ref: "#/components/responses/PrivateAccepted"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/consumers/account-recovery-cases:
    post:
      tags: [Member Recovery]
      summary: 소비자 수동 복구 사건 접수
      operationId: submitConsumerAccountRecoveryCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryCaseSubmissionRequest"
      responses:
        "202":
          $ref: "#/components/responses/PrivateAccepted"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/store-operators/account-recovery-cases:
    post:
      tags: [Member Recovery]
      summary: 식당 운영자 수동 복구 사건 접수
      operationId: submitStoreOperatorAccountRecoveryCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryCaseSubmissionRequest"
      responses:
        "202":
          $ref: "#/components/responses/PrivateAccepted"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/consumers/account-recovery-password-resets:
    post:
      tags: [Member Recovery]
      summary: 승인된 소비자 복구의 새 비밀번호 설정
      operationId: resetRecoveredConsumerPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveredPasswordResetRequest"
      responses:
        "204":
          description: 비밀번호 설정과 전 세션 폐기 완료, 자동 로그인 없음
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/PrivateNotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
  /api/v1/store-operators/account-recovery-password-resets:
    post:
      tags: [Member Recovery]
      summary: 승인된 식당 운영자 복구의 새 비밀번호 설정
      operationId: resetRecoveredStoreOperatorPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveredPasswordResetRequest"
      responses:
        "204":
          description: 비밀번호 설정과 전 세션 폐기 완료, 자동 로그인 없음
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/PrivateNotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
  /api/v1/consumers/account-sanction-appeals:
    post:
      tags: [Member Appeals]
      summary: 소비자 제재 이의 mock 확인 및 접수
      operationId: submitConsumerAccountSanctionAppeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppealSubmissionRequest"
      responses:
        "202":
          $ref: "#/components/responses/PrivateAccepted"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/store-operators/account-sanction-appeals:
    post:
      tags: [Member Appeals]
      summary: 식당 운영자 제재 이의 mock 확인 및 접수
      operationId: submitStoreOperatorAccountSanctionAppeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppealSubmissionRequest"
      responses:
        "202":
          $ref: "#/components/responses/PrivateAccepted"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/platform-operators/members:
    get:
      tags: [Platform Operator Member Support]
      summary: 회원 최소 목록 조회
      operationId: listPlatformOperatorMembers
      security:
        - platformOperatorBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountTypeQuery"
        - $ref: "#/components/parameters/MemberStatusQuery"
        - $ref: "#/components/parameters/JoinedFrom"
        - $ref: "#/components/parameters/JoinedTo"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/Page"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/Size"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/Sort"
      responses:
        "200":
          description: 최소 회원 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPageSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/OperatorUnauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationDenied"
  /api/v1/platform-operators/members/{accountType}/{accountId}:
    get:
      tags: [Platform Operator Member Support]
      summary: 회원 최소 상세 조회
      operationId: getPlatformOperatorMember
      security:
        - platformOperatorBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountTypePath"
        - $ref: "#/components/parameters/AccountIdPath"
      responses:
        "200":
          description: 최소 회원 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberSuccessResponse"
        "401":
          $ref: "#/components/responses/OperatorUnauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationDenied"
        "404":
          $ref: "#/components/responses/MemberNotFound"
  /api/v1/platform-operators/member-support-cases:
    get:
      tags: [Platform Operator Member Support]
      summary: 회원지원 사건 목록 조회
      operationId: listMemberSupportCases
      security:
        - platformOperatorBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaseTypeQuery"
        - $ref: "#/components/parameters/CaseStatusQuery"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/Page"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/Size"
      responses:
        "200":
          description: 민감 증거 원문을 제외한 사건 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasePageSuccessResponse"
        "401":
          $ref: "#/components/responses/OperatorUnauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationDenied"
  /api/v1/platform-operators/member-support-cases/{caseId}:
    get:
      tags: [Platform Operator Member Support]
      summary: 회원지원 사건 상세 조회
      operationId: getMemberSupportCase
      security:
        - platformOperatorBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaseIdPath"
      responses:
        "200":
          description: 민감 증거 원문을 제외한 사건 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseSuccessResponse"
        "401":
          $ref: "#/components/responses/OperatorUnauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationDenied"
        "404":
          $ref: "#/components/responses/MemberNotFound"
  /api/v1/platform-operators/member-support-cases/{caseId}/assignments:
    post:
      tags: [Platform Operator Member Support]
      summary: 회원지원 사건 자기 배정
      operationId: assignMemberSupportCase
      security:
        - platformOperatorBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaseIdPath"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: 배정된 사건
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseSuccessResponse"
        "401":
          $ref: "#/components/responses/OperatorUnauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationDenied"
        "404":
          $ref: "#/components/responses/MemberNotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
  /api/v1/platform-operators/member-support-cases/{caseId}/decisions:
    post:
      tags: [Platform Operator Member Support]
      summary: 복구 또는 이의 사건 결정
      operationId: decideMemberSupportCase
      security:
        - platformOperatorBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaseIdPath"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/AdminReauthentication"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseDecisionRequest"
      responses:
        "200":
          description: 결정된 사건
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/OperatorUnauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationDenied"
        "404":
          $ref: "#/components/responses/MemberNotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/platform-operators/members/{accountType}/{accountId}/sanctions:
    post:
      tags: [Platform Operator Member Sanctions]
      summary: 회원 제재 적용 또는 영구 정지 제안
      operationId: createMemberSanction
      security:
        - platformOperatorBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountTypePath"
        - $ref: "#/components/parameters/AccountIdPath"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/AdminReauthentication"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SanctionRequest"
      responses:
        "200":
          description: 적용된 제재 또는 추가 승인 대기 영구 정지 제안
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SanctionSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/OperatorUnauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationDenied"
        "404":
          $ref: "#/components/responses/MemberNotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/platform-operators/member-sanctions/{sanctionId}/additional-approvals:
    post:
      tags: [Platform Operator Member Sanctions]
      summary: 영구 정지 추가 승인
      operationId: approvePermanentMemberSanction
      security:
        - platformOperatorBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SanctionIdPath"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/AdminReauthentication"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdditionalApprovalRequest"
      responses:
        "200":
          description: 추가 승인되어 적용된 영구 정지
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SanctionSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/OperatorUnauthorized"
        "403":
          $ref: "#/components/responses/AuthorizationDenied"
        "404":
          $ref: "#/components/responses/MemberNotFound"
        "409":
          $ref: "#/components/responses/ApprovalConflict"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    platformOperatorBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AccountTypePath:
      name: accountType
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AccountType"
    AccountIdPath:
      name: accountId
      in: path
      required: true
      schema:
        $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
    CaseIdPath:
      name: caseId
      in: path
      required: true
      schema:
        $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
    SanctionIdPath:
      name: sanctionId
      in: path
      required: true
      schema:
        $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
    AccountTypeQuery:
      name: accountType
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/AccountType"
    MemberStatusQuery:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/MemberStatus"
    JoinedFrom:
      name: joinedFrom
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/OffsetDateTime"
    JoinedTo:
      name: joinedTo
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/OffsetDateTime"
    CaseTypeQuery:
      name: caseType
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/CaseType"
    CaseStatusQuery:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/CaseStatus"
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 따옴표 없는 현재 사건 또는 계정 support version
      schema:
        type: integer
        format: int64
        minimum: 0
    AdminReauthentication:
      $ref: "../platform-operator-authorization/openapi.yaml#/components/parameters/AdminReauthentication"
  schemas:
    OffsetDateTime:
      $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
    AccountType:
      type: string
      enum: [CONSUMER, STORE_OPERATOR]
    MemberStatus:
      type: string
      enum: [ACTIVE, PASSWORD_RESET_REQUIRED, FEATURE_RESTRICTED, TEMPORARILY_SUSPENDED, PERMANENTLY_SUSPENDED]
    SanctionLevel:
      type: string
      enum: [WARNING, FEATURE_RESTRICTION, TEMPORARY_SUSPENSION, PERMANENT_SUSPENSION]
    SanctionStatus:
      type: string
      enum: [PENDING_ADDITIONAL_APPROVAL, APPLIED, EXPIRED, REDUCED, CANCELLED]
    RestrictedFeature:
      type: string
      enum: [RESERVATION, WAITING, PICKUP, STORE_OPERATION, MENU_OPERATION]
    CaseType:
      type: string
      enum: [ACCOUNT_RECOVERY, ACCOUNT_APPEAL]
    CaseStatus:
      type: string
      enum: [SUBMITTED, ASSIGNED, APPROVED, REJECTED, UPHELD, REDUCED, CANCELLED]
    Email:
      type: string
      format: email
      maxLength: 254
    PhoneNumber:
      type: string
      minLength: 8
      maxLength: 20
      pattern: "^\\+[1-9][0-9]{7,14}$"
    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 64
    ConsumerRecoveryVerificationRequest:
      type: object
      additionalProperties: false
      required: [oldEmail, registeredPhone, newEmail]
      properties:
        oldEmail:
          $ref: "#/components/schemas/Email"
        registeredPhone:
          $ref: "#/components/schemas/PhoneNumber"
        newEmail:
          $ref: "#/components/schemas/Email"
    StoreOperatorRecoveryVerificationRequest:
      type: object
      additionalProperties: false
      required: [oldEmail, registeredPhone, newEmail, businessRegistrationNumber, representativeName]
      properties:
        oldEmail:
          $ref: "#/components/schemas/Email"
        registeredPhone:
          $ref: "#/components/schemas/PhoneNumber"
        newEmail:
          $ref: "#/components/schemas/Email"
        businessRegistrationNumber:
          type: string
          minLength: 10
          maxLength: 32
        representativeName:
          type: string
          minLength: 1
          maxLength: 100
    RecoveryCaseSubmissionRequest:
      type: object
      additionalProperties: false
      required: [newEmail]
      properties:
        newEmail:
          $ref: "#/components/schemas/Email"
    RecoveredPasswordResetRequest:
      type: object
      additionalProperties: false
      required: [newPassword]
      properties:
        newPassword:
          $ref: "#/components/schemas/Password"
    AppealSubmissionRequest:
      type: object
      additionalProperties: false
      required: [sanctionId, verificationChannel, contact, statement]
      properties:
        sanctionId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        verificationChannel:
          type: string
          enum: [REGISTERED_PHONE, REGISTERED_EMAIL]
        contact:
          type: string
          minLength: 1
          maxLength: 254
          description: 확인에만 사용하며 응답·로그·감사에는 남기지 않는다.
        statement:
          type: string
          minLength: 1
          maxLength: 2000
    ActiveSanctionSummary:
      type: object
      additionalProperties: false
      required: [level, restrictedFeatures]
      properties:
        level:
          $ref: "#/components/schemas/SanctionLevel"
        restrictedFeatures:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RestrictedFeature"
        endsAt:
          oneOf:
            - $ref: "#/components/schemas/OffsetDateTime"
            - type: "null"
    Member:
      type: object
      additionalProperties: false
      required: [accountType, accountId, status, joinedAt, supportVersion, activeSanctions]
      properties:
        accountType:
          $ref: "#/components/schemas/AccountType"
        accountId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        status:
          $ref: "#/components/schemas/MemberStatus"
        joinedAt:
          $ref: "#/components/schemas/OffsetDateTime"
        supportVersion:
          type: integer
          format: int64
          minimum: 0
        activeSanctions:
          type: array
          items:
            $ref: "#/components/schemas/ActiveSanctionSummary"
    MemberSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/Member"
    MemberPageData:
      type: object
      additionalProperties: false
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        page:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PageMetadata"
    MemberPageSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/MemberPageData"
    SupportCase:
      type: object
      additionalProperties: false
      required: [caseId, caseType, accountType, accountId, status, version, submittedAt]
      properties:
        caseId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        caseType:
          $ref: "#/components/schemas/CaseType"
        accountType:
          $ref: "#/components/schemas/AccountType"
        accountId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        status:
          $ref: "#/components/schemas/CaseStatus"
        version:
          type: integer
          format: int64
          minimum: 0
        assignedOperatorId:
          oneOf:
            - $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
            - type: "null"
        submittedAt:
          $ref: "#/components/schemas/OffsetDateTime"
        decidedAt:
          oneOf:
            - $ref: "#/components/schemas/OffsetDateTime"
            - type: "null"
    CaseSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/SupportCase"
    CasePageData:
      type: object
      additionalProperties: false
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/SupportCase"
        page:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PageMetadata"
    CasePageSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/CasePageData"
    CaseDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, reasonCode]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT, UPHOLD, REDUCE, CANCEL]
        reasonCode:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Z0-9_]+$"
        reducedLevel:
          oneOf:
            - $ref: "#/components/schemas/SanctionLevel"
            - type: "null"
        restrictedFeatures:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RestrictedFeature"
    SanctionRequest:
      type: object
      additionalProperties: false
      required: [level, reasonCode, policyVersion]
      properties:
        level:
          $ref: "#/components/schemas/SanctionLevel"
        reasonCode:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Z0-9_]+$"
        policyVersion:
          type: string
          minLength: 1
          maxLength: 50
        restrictedFeatures:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RestrictedFeature"
    AdditionalApprovalRequest:
      type: object
      additionalProperties: false
      required: [decision, reasonCode]
      properties:
        decision:
          type: string
          const: APPROVE
        reasonCode:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Z0-9_]+$"
    Sanction:
      type: object
      additionalProperties: false
      required: [sanctionId, accountType, accountId, level, status, policyVersion, version, restrictedFeatures, proposedAt]
      properties:
        sanctionId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        accountType:
          $ref: "#/components/schemas/AccountType"
        accountId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        level:
          $ref: "#/components/schemas/SanctionLevel"
        status:
          $ref: "#/components/schemas/SanctionStatus"
        policyVersion:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
        restrictedFeatures:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RestrictedFeature"
        proposedAt:
          $ref: "#/components/schemas/OffsetDateTime"
        appliedAt:
          oneOf:
            - $ref: "#/components/schemas/OffsetDateTime"
            - type: "null"
        endsAt:
          oneOf:
            - $ref: "#/components/schemas/OffsetDateTime"
            - type: "null"
    SanctionSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/Sanction"
    AcceptedSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/NoData"
  responses:
    PrivateAccepted:
      description: 계정·증거·사건 생성 여부와 무관하게 반환하는 동일 응답
      headers:
        Set-Cookie:
          description: 유효한 mock 확인에만 설정되는 HttpOnly·Secure·SameSite=Strict 기능 전용 opaque cookie. 클라이언트는 존재 여부로 성공을 판단하지 않는다.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AcceptedSuccessResponse"
    PrivateNotFound:
      description: 복구 cookie나 대상이 유효하지 않으며 어느 조건이 실패했는지 공개하지 않음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: AUTH_016
            message: 요청한 계정 또는 사건을 찾을 수 없습니다.
    OperatorUnauthorized:
      description: 플랫폼 운영자 세션 또는 권한 version이 유효하지 않음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: AUTH_015
            message: 플랫폼 운영자 세션이 더 이상 유효하지 않습니다.
    AuthorizationDenied:
      description: 권한·배정·일회 재인증 전제조건이 충족되지 않음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: ADMIN_001
            message: 요청한 운영 명령을 승인할 수 없습니다.
    MemberNotFound:
      description: 계정·사건이 없거나 요청한 계정 유형과 일치하지 않음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: AUTH_016
            message: 요청한 계정 또는 사건을 찾을 수 없습니다.
    StateConflict:
      description: stale version, 종결 상태 또는 동시 상태 전이 패배
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: AUTH_017
            message: 계정 또는 사건 상태가 변경되었습니다.
    ApprovalConflict:
      description: stale 상태, 제안자 자기 승인 또는 중복 영구 정지 승인
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          examples:
            StaleState:
              value:
                code: AUTH_017
                message: 계정 또는 사건 상태가 변경되었습니다.
            InvalidApprover:
              value:
                code: AUTH_018
                message: 영구 정지 추가 승인을 완료할 수 없습니다.
