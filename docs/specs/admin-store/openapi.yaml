openapi: 3.1.0
info:
  title: MiriYum Platform Admin Store API
  version: 1.0.0
  license:
    name: All rights reserved
    identifier: LicenseRef-All-Rights-Reserved
  description: ADMIN-007 기반 플랫폼 매장 최소 조회와 매장 단위 제재 계약이다.
servers:
  - url: /
security:
  - platformOperatorBearerAuth: []
tags:
  - name: Platform Admin Store
    description: 플랫폼 운영자 전용 Store 최소 조회와 Store 단위 제재
paths:
  /api/v1/platform-operators/stores:
    get:
      tags: [Platform Admin Store]
      operationId: searchPlatformStores
      summary: 플랫폼 관점 매장 최소 목록 조회
      parameters:
        - $ref: '#/components/parameters/AdminCaseId'
        - $ref: '#/components/parameters/AdminCaseVersion'
        - $ref: '../platform-operator-management-audit/openapi.yaml#/components/parameters/AdminReasonCode'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: keyword
          in: query
          schema: { type: string, maxLength: 100 }
        - name: operationStatus
          in: query
          schema: { $ref: '#/components/schemas/StoreOperationStatus' }
        - name: sanctionStatus
          in: query
          schema: { $ref: '#/components/schemas/StoreSanctionStatus' }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStorePageSuccessResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/platform-operators/stores/{storeId}:
    get:
      tags: [Platform Admin Store]
      operationId: getPlatformStore
      summary: 플랫폼 관점 매장 최소 상세 조회
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/AdminCaseId'
        - $ref: '#/components/parameters/AdminCaseVersion'
        - $ref: '../platform-operator-management-audit/openapi.yaml#/components/parameters/AdminReasonCode'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStoreDetailSuccessResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/platform-operators/stores/{storeId}/sanction-impact-previews:
    post:
      tags: [Platform Admin Store]
      operationId: createStoreSanctionImpactPreview
      summary: 제재 거래 영향 미리보기 생성
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/AdminCaseId'
        - $ref: '#/components/parameters/AdminCaseVersion'
        - $ref: '../platform-operator-management-audit/openapi.yaml#/components/parameters/AdminReasonCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreSanctionImpactPreviewRequest' }
      responses:
        '201':
          description: 미리보기 생성 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreSanctionImpactPreviewSuccessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/platform-operators/stores/{storeId}/sanctions:
    post:
      tags: [Platform Admin Store]
      operationId: createStoreSanction
      summary: 매장 제재 제안 또는 적용
      description: 고위험 제재는 영향 미리보기와 재인증을 요구하며 필요한 경우 PENDING_APPROVAL로 생성한다.
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminCaseId'
        - $ref: '#/components/parameters/AdminCaseVersion'
        - $ref: '../platform-operator-management-audit/openapi.yaml#/components/parameters/AdminReasonCode'
        - $ref: '#/components/parameters/AdminReauthentication'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreSanctionCreateRequest' }
      responses:
        '201':
          description: 제재 생성 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreSanctionSuccessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/platform-operators/stores/{storeId}/sanctions/{sanctionId}/approvals:
    post:
      tags: [Platform Admin Store]
      operationId: approveStoreSanction
      summary: 고위험 매장 제재 승인과 집행
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/SanctionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminCaseId'
        - $ref: '#/components/parameters/AdminCaseVersion'
        - $ref: '../platform-operator-management-audit/openapi.yaml#/components/parameters/AdminReasonCode'
        - $ref: '#/components/parameters/AdminReauthenticationRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreSanctionApprovalRequest' }
      responses:
        '200':
          description: 승인·집행 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreSanctionSuccessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/platform-operators/stores/{storeId}/sanctions/{sanctionId}/releases:
    post:
      tags: [Platform Admin Store]
      operationId: releaseStoreSanction
      summary: 활성 매장 제재 해제
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/SanctionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminCaseId'
        - $ref: '#/components/parameters/AdminCaseVersion'
        - $ref: '../platform-operator-management-audit/openapi.yaml#/components/parameters/AdminReasonCode'
        - $ref: '#/components/parameters/AdminReauthenticationRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreSanctionReleaseRequest' }
      responses:
        '200':
          description: 해제 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreSanctionSuccessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    platformOperatorBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    StoreId:
      name: storeId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    SanctionId:
      name: sanctionId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 100 }
    AdminCaseId:
      name: X-Admin-Case-Id
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    AdminCaseVersion:
      name: X-Admin-Case-Version
      in: header
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    AdminReauthentication:
      name: X-Admin-Reauthentication
      in: header
      required: false
      description: 고위험 명령일 때 필수인 일회 재인증 승인 token
      schema: { type: string, minLength: 43, maxLength: 512 }
    AdminReauthenticationRequired:
      name: X-Admin-Reauthentication
      in: header
      required: true
      description: STORE_SANCTION 목적의 일회 재인증 승인 token
      schema: { type: string, minLength: 43, maxLength: 512 }
  schemas:
    StoreOperationStatus:
      type: string
      enum: [OPEN, TEMPORARILY_CLOSED, CLOSED]
    StoreSanctionType:
      type: string
      enum: [WARNING, FEATURE_RESTRICTION, TEMPORARY_SUSPENSION, PERMANENT_EXIT]
    StoreSanctionStatus:
      type: string
      enum: [PENDING_APPROVAL, ACTIVE, RELEASED, EXPIRED, REJECTED]
    RestrictedFeature:
      type: string
      enum: [RESERVATION, WAITING, MENU_HOLD, PICKUP, STORE_MANAGEMENT]
    SanctionShape:
      type: object
      required: [type, restrictedFeatures, policyVersion]
      properties:
        type: { $ref: '#/components/schemas/StoreSanctionType' }
        policyVersion: { type: string, minLength: 1, maxLength: 50 }
        restrictedFeatures:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/RestrictedFeature' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    StoreSanctionImpactPreviewRequest:
      allOf:
        - $ref: '#/components/schemas/SanctionShape'
        - type: object
          required: [violationType, evidenceReferences]
          properties:
            violationType: { type: string, minLength: 1, maxLength: 50 }
            evidenceReferences:
              type: array
              minItems: 1
              maxItems: 20
              uniqueItems: true
              items: { type: string, minLength: 1, maxLength: 200 }
    StoreSanctionImpactPreviewResponse:
      type: object
      required: [previewId, storeId, storeEnforcementVersion, confirmedReservationCount, activeWaitingTeamCount, confirmedPickupCount, unsettledPaymentCount, digest, expiresAt]
      properties:
        previewId: { type: integer, format: int64 }
        storeId: { type: integer, format: int64 }
        storeEnforcementVersion: { type: integer, format: int64 }
        confirmedReservationCount: { type: integer, format: int64, minimum: 0 }
        activeWaitingTeamCount: { type: integer, format: int64, minimum: 0 }
        confirmedPickupCount: { type: integer, format: int64, minimum: 0 }
        unsettledPaymentCount: { type: integer, format: int64, minimum: 0 }
        digest: { type: string, minLength: 64, maxLength: 64 }
        expiresAt: { type: string, format: date-time }
    ImpactConfirmation:
      type: object
      required: [previewId, previewDigest, storeEnforcementVersion]
      properties:
        previewId: { type: integer, format: int64, minimum: 1 }
        previewDigest: { type: string, minLength: 64, maxLength: 64 }
        storeEnforcementVersion: { type: integer, format: int64, minimum: 0 }
    StoreSanctionCreateRequest:
      allOf:
        - $ref: '#/components/schemas/SanctionShape'
        - type: object
          required: [violationType, evidenceReferences, reason]
          properties:
            violationType: { type: string, minLength: 1, maxLength: 50 }
            evidenceReferences:
              type: array
              minItems: 1
              maxItems: 20
              uniqueItems: true
              items: { type: string, minLength: 1, maxLength: 200 }
            reason: { type: string, minLength: 1, maxLength: 1000 }
            impactConfirmation: { $ref: '#/components/schemas/ImpactConfirmation' }
    StoreSanctionApprovalRequest:
      type: object
      required: [expectedSanctionVersion, impactConfirmation]
      properties:
        expectedSanctionVersion: { type: integer, format: int64, minimum: 0 }
        impactConfirmation: { $ref: '#/components/schemas/ImpactConfirmation' }
        note: { type: string, maxLength: 500 }
    StoreSanctionReleaseRequest:
      type: object
      required: [expectedSanctionVersion, reason]
      properties:
        expectedSanctionVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    StoreSanctionResponse:
      type: object
      required: [sanctionId, storeId, type, status, policyVersion, violationType, evidenceReferences, sanctionVersion, storeEnforcementVersion, restrictedFeatures, createdAt]
      properties:
        sanctionId: { type: integer, format: int64 }
        storeId: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/StoreSanctionType' }
        status: { $ref: '#/components/schemas/StoreSanctionStatus' }
        policyVersion: { type: string }
        violationType: { type: string }
        evidenceReferences:
          type: array
          items: { type: string }
        sanctionVersion: { type: integer, format: int64 }
        storeEnforcementVersion: { type: integer, format: int64 }
        restrictedFeatures:
          type: array
          items: { $ref: '#/components/schemas/RestrictedFeature' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    AdminStoreSummaryResponse:
      type: object
      required: [storeId, name, storeOperatorAccountId, operationStatus, reservationEnabled, menuHoldEnabled, pickupEnabled, enforcementVersion]
      properties:
        storeId: { type: integer, format: int64 }
        name: { type: string }
        storeOperatorAccountId: { type: integer, format: int64 }
        operationStatus: { $ref: '#/components/schemas/StoreOperationStatus' }
        reservationEnabled: { type: boolean }
        menuHoldEnabled: { type: boolean }
        pickupEnabled: { type: boolean }
        enforcementVersion: { type: integer, format: int64 }
        activeSanctionTypes:
          type: array
          items: { $ref: '#/components/schemas/StoreSanctionType' }
    AdminStoreDetailResponse:
      allOf:
        - $ref: '#/components/schemas/AdminStoreSummaryResponse'
        - type: object
          required: [createdAt, sanctions]
          properties:
            createdAt: { type: string, format: date-time }
            sanctions:
              type: array
              items: { $ref: '#/components/schemas/StoreSanctionResponse' }
    AdminStorePageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/AdminStoreSummaryResponse' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    StoreSanctionSuccessResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { $ref: '../mvp1-common/openapi.yaml#/components/schemas/SuccessCode' }
        message: { $ref: '../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage' }
        data: { $ref: '#/components/schemas/StoreSanctionResponse' }
    StoreSanctionImpactPreviewSuccessResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { $ref: '../mvp1-common/openapi.yaml#/components/schemas/SuccessCode' }
        message: { $ref: '../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage' }
        data: { $ref: '#/components/schemas/StoreSanctionImpactPreviewResponse' }
    AdminStoreDetailSuccessResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { $ref: '../mvp1-common/openapi.yaml#/components/schemas/SuccessCode' }
        message: { $ref: '../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage' }
        data: { $ref: '#/components/schemas/AdminStoreDetailResponse' }
    AdminStorePageSuccessResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { $ref: '../mvp1-common/openapi.yaml#/components/schemas/SuccessCode' }
        message: { $ref: '../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage' }
        data: { $ref: '#/components/schemas/AdminStorePageResponse' }
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: 인증 또는 재인증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: 권한 또는 사건 배정 부족
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Store, 제재 또는 미리보기를 찾을 수 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 영향 미리보기 또는 상태 version 충돌
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
