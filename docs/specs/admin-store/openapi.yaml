openapi: 3.1.0
info:
  title: MiriYum Platform Admin Store API
  version: 1.1.0
  license:
    name: All rights reserved
    identifier: LicenseRef-All-Rights-Reserved
  description: ADMIN-007 기반 Store 최소 조회, 제재 사건 배정, 영향 확인과 단계형 제재 계약이다.
servers:
  - url: /
security:
  - platformOperatorBearerAuth: []
tags:
  - name: Platform Admin Store
    description: 플랫폼 운영자 전용 Store 조회와 Store 단위 제재 사건
paths:
  /api/v1/platform-operators/stores:
    get:
      tags: [Platform Admin Store]
      operationId: searchPlatformStores
      summary: Store 최소 목록 조회
      parameters:
        - $ref: '../platform-operator-management-audit/openapi.yaml#/components/parameters/AdminReasonCode'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: keyword
          in: query
          schema: {type: string, maxLength: 100}
        - name: operationStatus
          in: query
          schema: {$ref: '#/components/schemas/StoreOperationStatus'}
      responses:
        '200': {$ref: '#/components/responses/StorePageResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/platform-operators/stores/{storeId}:
    get:
      tags: [Platform Admin Store]
      operationId: getPlatformStore
      summary: Store 최소 상세 조회
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '../platform-operator-management-audit/openapi.yaml#/components/parameters/AdminReasonCode'
      responses:
        '200': {$ref: '#/components/responses/StoreDetailResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/platform-operators/stores/{storeId}/sanction-cases:
    post:
      tags: [Platform Admin Store]
      operationId: createStoreSanctionCase
      summary: Store 제재 사건 생성
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '../platform-operator-management-audit/openapi.yaml#/components/parameters/AdminReasonCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StoreSanctionCaseCreateRequest'}
      responses:
        '201': {$ref: '#/components/responses/CaseChanged'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/platform-operators/stores/{storeId}/sanction-cases/{caseId}/assignments:
    post:
      tags: [Platform Admin Store]
      operationId: assignStoreSanctionCase
      summary: Store 제재 사건 자기 배정
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '../platform-operator-management-audit/openapi.yaml#/components/parameters/AdminReasonCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StoreSanctionCaseAssignmentRequest'}
      responses:
        '200': {$ref: '#/components/responses/CaseChanged'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/platform-operators/stores/{storeId}/sanction-cases/{caseId}:
    get:
      tags: [Platform Admin Store]
      operationId: getStoreSanctionCase
      summary: 배정된 Store 제재 사건 상세 조회
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/AdminCaseId'
        - $ref: '#/components/parameters/AdminCaseVersion'
        - $ref: '../platform-operator-management-audit/openapi.yaml#/components/parameters/AdminReasonCode'
      responses:
        '200': {$ref: '#/components/responses/CaseDetailResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/platform-operators/stores/{storeId}/sanction-cases/{caseId}/impact-previews:
    post:
      tags: [Platform Admin Store]
      operationId: createStoreSanctionImpactPreview
      summary: 사건 결속 거래 영향 미리보기 생성
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/AdminCaseId'
        - $ref: '#/components/parameters/AdminCaseVersion'
        - $ref: '../platform-operator-management-audit/openapi.yaml#/components/parameters/AdminReasonCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StoreSanctionImpactPreviewRequest'}
      responses:
        '201': {$ref: '#/components/responses/ImpactPreviewCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/platform-operators/stores/{storeId}/sanction-cases/{caseId}/sanctions:
    post:
      tags: [Platform Admin Store]
      operationId: createStoreSanction
      summary: 사건의 제재 제안 또는 적용
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminCaseId'
        - $ref: '#/components/parameters/AdminCaseVersion'
        - $ref: '../platform-operator-management-audit/openapi.yaml#/components/parameters/AdminReasonCode'
        - $ref: '#/components/parameters/AdminReauthenticationOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StoreSanctionCreateRequest'}
      responses:
        '201': {$ref: '#/components/responses/SanctionChanged'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/platform-operators/stores/{storeId}/sanction-cases/{caseId}/sanctions/{sanctionId}/approvals:
    post:
      tags: [Platform Admin Store]
      operationId: approveStoreSanction
      summary: 고위험 제재 추가 승인과 집행
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/SanctionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminCaseId'
        - $ref: '#/components/parameters/AdminCaseVersion'
        - $ref: '../platform-operator-management-audit/openapi.yaml#/components/parameters/AdminReasonCode'
        - $ref: '#/components/parameters/AdminReauthenticationRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StoreSanctionApprovalRequest'}
      responses:
        '200': {$ref: '#/components/responses/SanctionChanged'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/platform-operators/stores/{storeId}/sanction-cases/{caseId}/sanctions/{sanctionId}/releases:
    post:
      tags: [Platform Admin Store]
      operationId: releaseStoreSanction
      summary: 비영구 활성 제재 해제
      description: PERMANENT_EXIT은 OPER-009 전용 복구 계약 없이 이 endpoint로 해제할 수 없다.
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/SanctionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminCaseId'
        - $ref: '#/components/parameters/AdminCaseVersion'
        - $ref: '../platform-operator-management-audit/openapi.yaml#/components/parameters/AdminReasonCode'
        - $ref: '#/components/parameters/AdminReauthenticationRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StoreSanctionReleaseRequest'}
      responses:
        '200': {$ref: '#/components/responses/SanctionChanged'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  securitySchemes:
    platformOperatorBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    StoreId:
      name: storeId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    CaseId:
      name: caseId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SanctionId:
      name: sanctionId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    Size:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 동일 principal·command·payload 재요청은 최초 status와 payload를 replay하며 다른 payload 재사용은 COMMON_007이다.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    AdminCaseId:
      name: X-Admin-Case-Id
      in: header
      required: true
      schema: {type: string, format: uuid}
    AdminCaseVersion:
      name: X-Admin-Case-Version
      in: header
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    AdminReauthenticationOptional:
      name: X-Admin-Reauthentication
      in: header
      required: false
      description: 고위험 제재 생성일 때 필수인 STORE_SANCTION 목적 일회 승인값
      schema: {type: string, minLength: 43, maxLength: 512}
    AdminReauthenticationRequired:
      name: X-Admin-Reauthentication
      in: header
      required: true
      description: STORE_SANCTION 목적 일회 승인값
      schema: {type: string, minLength: 43, maxLength: 512}
  schemas:
    StoreOperationStatus:
      type: string
      enum: [OPEN, TEMPORARILY_CLOSED, CLOSED]
    StoreSanctionCaseStatus:
      type: string
      enum: [SUBMITTED, ASSIGNED, PENDING_APPROVAL, ACTIVE, RESOLVED, REJECTED]
    StoreSanctionType:
      type: string
      enum: [WARNING, FEATURE_RESTRICTION, TEMPORARY_SUSPENSION, PERMANENT_EXIT]
    StoreSanctionStatus:
      type: string
      enum: [PENDING_APPROVAL, ACTIVE, RELEASED, EXPIRED, REJECTED]
    RestrictedFeature:
      type: string
      enum: [RESERVATION, WAITING, MENU_HOLD, PICKUP, STORE_MANAGEMENT]
    StoreSanctionCaseCreateRequest:
      type: object
      additionalProperties: false
      required: [violationType, evidenceReferences, policyVersion]
      properties:
        violationType: {type: string, minLength: 1, maxLength: 50}
        evidenceReferences:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 200}
        policyVersion: {type: string, minLength: 1, maxLength: 50}
    StoreSanctionCaseAssignmentRequest:
      type: object
      additionalProperties: false
      required: [expectedCaseVersion]
      properties:
        expectedCaseVersion: {type: integer, format: int64, minimum: 1}
    StoreSanctionCaseResponse:
      type: object
      required: [caseId, storeId, violationType, evidenceReferences, policyVersion, status, caseVersion, createdBy, createdAt]
      properties:
        caseId: {type: string, format: uuid}
        storeId: {type: integer, format: int64}
        violationType: {type: string}
        evidenceReferences:
          type: array
          items: {type: string}
        policyVersion: {type: string}
        status: {$ref: '#/components/schemas/StoreSanctionCaseStatus'}
        caseVersion: {type: integer, format: int64, minimum: 1}
        createdBy: {type: integer, format: int64}
        assignedOperatorId: {type: [integer, 'null'], format: int64}
        createdAt: {type: string, format: date-time}
    SanctionShape:
      type: object
      required: [type, restrictedFeatures]
      properties:
        type: {$ref: '#/components/schemas/StoreSanctionType'}
        restrictedFeatures:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/RestrictedFeature'}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
    StoreSanctionImpactPreviewRequest:
      allOf:
        - $ref: '#/components/schemas/SanctionShape'
    StoreSanctionImpactPreviewResponse:
      type: object
      additionalProperties: false
      required: [previewId, caseId, storeId, caseVersion, storeEnforcementVersion, confirmedReservationCount, activeWaitingTeamCount, confirmedPickupCount, unsettledPaymentCount, digest, expiresAt]
      properties:
        previewId: {type: integer, format: int64}
        caseId: {type: string, format: uuid}
        storeId: {type: integer, format: int64}
        caseVersion: {type: integer, format: int64}
        storeEnforcementVersion: {type: integer, format: int64}
        confirmedReservationCount: {type: integer, format: int64, minimum: 0}
        activeWaitingTeamCount: {type: integer, format: int64, minimum: 0}
        confirmedPickupCount: {type: integer, format: int64, minimum: 0}
        unsettledPaymentCount: {type: integer, format: int64, minimum: 0}
        digest: {type: string, minLength: 64, maxLength: 64}
        expiresAt: {type: string, format: date-time}
    ImpactConfirmation:
      type: object
      additionalProperties: false
      required: [previewId, previewDigest, caseVersion, storeEnforcementVersion]
      properties:
        previewId: {type: integer, format: int64, minimum: 1}
        previewDigest: {type: string, minLength: 64, maxLength: 64}
        caseVersion: {type: integer, format: int64, minimum: 1}
        storeEnforcementVersion: {type: integer, format: int64, minimum: 0}
    StoreSanctionCreateRequest:
      allOf:
        - $ref: '#/components/schemas/SanctionShape'
        - type: object
          required: [reason]
          properties:
            reason: {type: string, minLength: 1, maxLength: 1000}
            impactConfirmation: {$ref: '#/components/schemas/ImpactConfirmation'}
    StoreSanctionApprovalRequest:
      type: object
      additionalProperties: false
      required: [expectedSanctionVersion, impactConfirmation]
      properties:
        expectedSanctionVersion: {type: integer, format: int64, minimum: 1}
        impactConfirmation: {$ref: '#/components/schemas/ImpactConfirmation'}
        note: {type: string, maxLength: 500}
    StoreSanctionReleaseRequest:
      type: object
      additionalProperties: false
      required: [expectedSanctionVersion, reason]
      properties:
        expectedSanctionVersion: {type: integer, format: int64, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 1000}
    StoreSanctionResponse:
      type: object
      additionalProperties: false
      required: [sanctionId, caseId, storeId, type, status, sanctionVersion, storeEnforcementVersion, restrictedFeatures, createdAt]
      properties:
        sanctionId: {type: integer, format: int64}
        caseId: {type: string, format: uuid}
        storeId: {type: integer, format: int64}
        type: {$ref: '#/components/schemas/StoreSanctionType'}
        status: {$ref: '#/components/schemas/StoreSanctionStatus'}
        sanctionVersion: {type: integer, format: int64}
        storeEnforcementVersion: {type: integer, format: int64}
        restrictedFeatures:
          type: array
          items: {$ref: '#/components/schemas/RestrictedFeature'}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    StoreSanctionCaseDetailResponse:
      allOf:
        - $ref: '#/components/schemas/StoreSanctionCaseResponse'
        - type: object
          required: [sanctions]
          properties:
            sanctions:
              type: array
              items: {$ref: '#/components/schemas/StoreSanctionResponse'}
    AdminStoreSummaryResponse:
      type: object
      required: [storeId, name, storeOperatorAccountId, operationStatus, reservationEnabled, menuHoldEnabled, pickupEnabled, enforcementVersion, activeSanctionTypes]
      properties:
        storeId: {type: integer, format: int64}
        name: {type: string}
        storeOperatorAccountId: {type: integer, format: int64}
        operationStatus: {$ref: '#/components/schemas/StoreOperationStatus'}
        reservationEnabled: {type: boolean}
        menuHoldEnabled: {type: boolean}
        pickupEnabled: {type: boolean}
        enforcementVersion: {type: integer, format: int64}
        activeSanctionTypes:
          type: array
          items: {$ref: '#/components/schemas/StoreSanctionType'}
    AdminStoreDetailResponse:
      allOf:
        - $ref: '#/components/schemas/AdminStoreSummaryResponse'
        - type: object
          required: [createdAt, openCaseIds]
          properties:
            createdAt: {type: string, format: date-time}
            openCaseIds:
              type: array
              items: {type: string, format: uuid}
    AdminStorePageResponse:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/AdminStoreSummaryResponse'}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1}
        totalElements: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    StorePageSuccessResponse:
      $ref: '#/components/schemas/AdminStorePageEnvelope'
    AdminStorePageEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code: {$ref: '../mvp1-common/openapi.yaml#/components/schemas/SuccessCode'}
        message: {$ref: '../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage'}
        data: {$ref: '#/components/schemas/AdminStorePageResponse'}
    StoreDetailSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code: {$ref: '../mvp1-common/openapi.yaml#/components/schemas/SuccessCode'}
        message: {$ref: '../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage'}
        data: {$ref: '#/components/schemas/AdminStoreDetailResponse'}
    CaseSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code: {$ref: '../mvp1-common/openapi.yaml#/components/schemas/SuccessCode'}
        message: {$ref: '../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage'}
        data: {$ref: '#/components/schemas/StoreSanctionCaseResponse'}
    CaseDetailSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code: {$ref: '../mvp1-common/openapi.yaml#/components/schemas/SuccessCode'}
        message: {$ref: '../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage'}
        data: {$ref: '#/components/schemas/StoreSanctionCaseDetailResponse'}
    ImpactPreviewSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code: {$ref: '../mvp1-common/openapi.yaml#/components/schemas/SuccessCode'}
        message: {$ref: '../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage'}
        data: {$ref: '#/components/schemas/StoreSanctionImpactPreviewResponse'}
    SanctionSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code: {$ref: '../mvp1-common/openapi.yaml#/components/schemas/SuccessCode'}
        message: {$ref: '../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage'}
        data: {$ref: '#/components/schemas/StoreSanctionResponse'}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
  responses:
    StorePageResult:
      description: Store 최소 목록
      content:
        application/json:
          schema: {$ref: '#/components/schemas/StorePageSuccessResponse'}
    StoreDetailResult:
      description: Store 최소 상세
      content:
        application/json:
          schema: {$ref: '#/components/schemas/StoreDetailSuccessResponse'}
    CaseChanged:
      description: 생성 또는 배정된 제재 사건
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CaseSuccessResponse'}
    CaseDetailResult:
      description: 배정된 제재 사건 상세
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CaseDetailSuccessResponse'}
    ImpactPreviewCreated:
      description: 사건 결속 영향 미리보기
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ImpactPreviewSuccessResponse'}
    SanctionChanged:
      description: 변경된 Store 제재
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SanctionSuccessResponse'}
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthorized:
      description: 인증 또는 재인증 실패
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: 권한 또는 사건 배정 부족
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: Store, 사건, 제재 또는 미리보기를 찾을 수 없음
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: 영향 미리보기 또는 상태 version 충돌
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
