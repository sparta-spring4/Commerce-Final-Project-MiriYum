openapi: 3.1.0
info:
  title: MiriYum MVP1 Reservation API
  version: 1.1.0
  description: 일반 예약·매장별 시간 정책·수용량·취소·방문 완료 계약
  license:
    name: All rights reserved
    identifier: LicenseRef-All-Rights-Reserved
servers:
  - url: /
    description: 배포 환경의 동일 origin
security: []
tags:
  - name: Reservation
    description: 일반 사용자 예약
  - name: Reservation Management
    description: 매장 운영자 예약 관리
  - name: Reservation Capacity
    description: 매장 날짜·시간 구간별 인원·팀 수
  - name: Reservation Time Policy
    description: 매장 운영자 예약 시간 정책 버전 lifecycle
paths:
  /api/v1/consumers/me/reservations:
    post:
      tags: [Reservation]
      summary: 일반 예약과 선택 메뉴 홀드 생성
      operationId: createReservation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationCreateRequest"
      responses:
        "201":
          description: 즉시 확정된 예약
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ReservationCreationNotFound"
        "409":
          $ref: "#/components/responses/ReservationConflict"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
    get:
      tags: [My Page]
      summary: 내 예약 이력 조회
      operationId: getCurrentConsumerReservations
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ReservationHistoryStatus"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/Page"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/Size"
        - name: sort
          in: query
          description: 예약 이력 정렬. 아래 허용값 이외에는 400을 반환한다.
          schema:
            type: string
            enum:
              - "createdAt,desc"
              - "createdAt,asc"
              - "serviceDate,desc"
              - "serviceDate,asc"
              - "startAt,desc"
              - "startAt,asc"
            default: "createdAt,desc"
      responses:
        "200":
          description: 본인 예약 이력 페이지
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationHistoryPageSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountRestricted"
  /api/v1/consumers/me/reservations/{reservationId}:
    get:
      tags: [Reservation]
      summary: 본인 예약 상세 조회
      operationId: getReservation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: 본인 예약 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationSuccessResponse"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ReservationNotFound"
  /api/v1/consumers/me/reservations/{reservationId}/cancellations:
    post:
      tags: [Reservation]
      summary: 본인 예약 취소
      operationId: cancelReservationByConsumer
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReservationId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerCancellationRequest"
      responses:
        "200":
          description: 취소된 예약과 복구 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ReservationNotFound"
        "409":
          $ref: "#/components/responses/ReservationStateConflict"
  /api/v1/store-operators/stores/{storeId}/reservations:
    get:
      tags: [Reservation Management]
      summary: 매장 예약 목록 조회
      operationId: getStoreReservations
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - name: serviceDate
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/StoreLocalDate"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ReservationStatus"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/Page"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/Size"
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - "serviceDate,asc"
              - "serviceDate,desc"
              - "createdAt,asc"
              - "createdAt,desc"
            default: "serviceDate,asc"
          description: 허용된 정렬 하나
      responses:
        "200":
          description: 대상 매장 예약 페이지
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationPageSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreNotFound"
  /api/v1/store-operators/stores/{storeId}/reservations/{reservationId}:
    get:
      tags: [Reservation Management]
      summary: 매장 예약 상세 조회
      operationId: getStoreReservation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: 대상 매장 예약 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreReservationNotFound"
  /api/v1/store-operators/stores/{storeId}/reservations/{reservationId}/cancellations:
    post:
      tags: [Reservation Management]
      summary: 매장 사유 예약 취소
      operationId: cancelReservationByStoreOperator
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/ReservationId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreCancellationRequest"
      responses:
        "200":
          description: 취소된 예약과 복구 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreReservationNotFound"
        "409":
          $ref: "#/components/responses/ReservationStateConflict"
  /api/v1/store-operators/stores/{storeId}/reservations/{reservationId}/fulfillments:
    post:
      tags: [Reservation Management]
      summary: 예약 방문 완료
      operationId: fulfillReservation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/ReservationId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyCommandRequest"
      responses:
        "200":
          description: 방문 완료된 예약
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReservationFulfillmentForbidden"
        "404":
          $ref: "#/components/responses/StoreReservationNotFound"
        "409":
          $ref: "#/components/responses/ReservationFulfillmentConflict"
  /api/v1/store-operators/stores/{storeId}/reservation-capacities/{serviceDate}:
    put:
      tags: [Reservation Capacity]
      summary: 날짜별 예약 수용량 전체 게시
      operationId: replaceReservationCapacities
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/ServiceDate"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationCapacitiesRequest"
      responses:
        "200":
          description: 게시된 수용량 정책
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationCapacitiesSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreNotFound"
        "409":
          $ref: "#/components/responses/CapacityConfigurationConflict"
  /api/v1/store-operators/stores/{storeId}/reservation-time-policies:
    put:
      tags: [Reservation Time Policy]
      summary: 매장별 예약 시간 정책 초안 저장
      operationId: createReservationTimePolicyDraft
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationTimePolicyDraftRequest"
      responses:
        "200":
          description: 저장된 예약 시간 정책 초안
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationTimePolicySuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreNotFound"
        "409":
          $ref: "#/components/responses/ReservationTimePolicyConflict"
  /api/v1/store-operators/stores/{storeId}/reservation-time-policies/{version}/publications:
    post:
      tags: [Reservation Time Policy]
      summary: 예약 시간 정책 초안 즉시 또는 예약 게시
      operationId: publishReservationTimePolicyDraft
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/ReservationTimePolicyVersion"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationTimePolicyPublicationRequest"
      responses:
        "200":
          description: 즉시 게시되거나 예약된 시간 정책 버전
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationTimePolicySuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreNotFound"
        "409":
          $ref: "#/components/responses/ReservationTimePolicyConflict"
  /api/v1/store-operators/stores/{storeId}/reservation-time-policies/{version}/publication-cancellations:
    post:
      tags: [Reservation Time Policy]
      summary: 예약 시간 정책 예약 게시 철회
      operationId: cancelReservationTimePolicyPublication
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/ReservationTimePolicyVersion"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationTimePolicyPublicationCancellationRequest"
      responses:
        "200":
          description: 예약 게시가 철회되어 초안으로 돌아간 시간 정책 버전
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationTimePolicySuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreNotFound"
        "409":
          $ref: "#/components/responses/ReservationTimePolicyConflict"
components:
  securitySchemes:
    bearerAuth:
      $ref: "../mvp1-common/openapi.yaml#/components/securitySchemes/bearerAuth"
  parameters:
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
    StoreId:
      name: storeId
      in: path
      required: true
      schema:
        $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
    ServiceDate:
      name: serviceDate
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StoreLocalDate"
    ReservationTimePolicyVersion:
      name: version
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    ReservationHistoryStatus:
      type: string
      enum: [CONFIRMED, CANCELLED, FULFILLED]
    ReservationHistoryItem:
      type: object
      additionalProperties: false
      required:
        - reservationId
        - storeId
        - storeName
        - serviceDate
        - timeStatus
        - startAt
        - serviceEndAt
        - timeZoneId
        - partySize
        - status
        - createdAt
      properties:
        reservationId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        storeId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        storeName:
          type: string
          minLength: 1
          maxLength: 100
        serviceDate:
          $ref: "#/components/schemas/StoreLocalDate"
        timeStatus:
          $ref: "#/components/schemas/ReservationTimeStatus"
        startAt:
          oneOf:
            - $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
            - type: "null"
          description: LEGACY_UNRESOLVED이면 null
        serviceEndAt:
          oneOf:
            - $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
            - type: "null"
          description: LEGACY_UNRESOLVED이면 null
        timeZoneId:
          type: [string, "null"]
          minLength: 1
          maxLength: 64
          description: 예약 계산에 사용한 매장 IANA 시간대. LEGACY_UNRESOLVED이면 null
          examples:
            - Asia/Seoul
        partySize:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/ReservationHistoryStatus"
        createdAt:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
    ReservationHistoryPageData:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReservationHistoryItem"
        page:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PageMetadata"
    StoreLocalDate:
      type: string
      format: date
      description: 대상 매장의 IANA 시간대 기준 업무 날짜
      examples:
        - "2026-08-01"
    StoreLocalTime:
      type: string
      pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
      description: 대상 매장의 IANA 시간대 기준 분 단위 현지 시각
      examples:
        - "14:30"
    ReservationStatus:
      type: string
      enum: [CONFIRMED, CANCELLED, FULFILLED]
    ReservationTimeStatus:
      type: string
      enum: [RESOLVED, LEGACY_UNRESOLVED]
      description: >-
        RESOLVED는 실제 Instant·offset 스냅샷을 제공한다.
        LEGACY_UNRESOLVED는 V15 현지 시각 행을 임의 변환하지 않아
        startAt, serviceEndAt, timeZoneId가 null인 상태다.
    ReservationTimePolicyStatus:
      type: string
      enum: [DRAFT, SCHEDULED, ACTIVE, RETIRED, ACTIVATION_FAILED]
    ReservationTimePolicyDraftRequest:
      type: object
      additionalProperties: false
      required: [slotInterval, serviceDuration, turnoverDuration]
      properties:
        slotInterval:
          type: integer
          minimum: 1
          maximum: 1440
          description: 예약 시작 슬롯 간격(분)
        serviceDuration:
          type: integer
          minimum: 1
          maximum: 1440
          description: 고객 서비스 소요시간(분)
        turnoverDuration:
          type: integer
          minimum: 0
          maximum: 1440
          description: 서비스 뒤 자원 전환 시간(분)
      description: serviceDuration과 turnoverDuration의 합은 1440분 이하여야 한다.
    ReservationTimePolicyPublicationRequest:
      type: object
      additionalProperties: false
      required: [publicationMode, changeReason]
      properties:
        publicationMode:
          type: string
          enum: [IMMEDIATE, SCHEDULED]
        effectiveAt:
          type: string
          format: date-time
          description: SCHEDULED에서만 허용하는 미래 offset 포함 ISO 8601 시각
        changeReason:
          type: string
          minLength: 1
          maxLength: 500
      allOf:
        - if:
            properties:
              publicationMode:
                const: SCHEDULED
          then:
            properties:
              effectiveAt: {}
            required: [effectiveAt]
        - if:
            properties:
              publicationMode:
                const: IMMEDIATE
          then:
            not:
              properties:
                effectiveAt: {}
              required: [effectiveAt]
    ReservationTimePolicyPublicationCancellationRequest:
      type: object
      additionalProperties: false
      required: [changeReason]
      properties:
        changeReason:
          type: string
          minLength: 1
          maxLength: 500
    ReservationTimePolicyResponse:
      type: object
      additionalProperties: false
      required:
        - storeId
        - version
        - slotInterval
        - serviceDuration
        - turnoverDuration
        - status
        - effectiveAt
      properties:
        storeId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        version:
          type: integer
          format: int64
          minimum: 1
        slotInterval:
          type: integer
          minimum: 1
          maximum: 1440
        serviceDuration:
          type: integer
          minimum: 1
          maximum: 1440
        turnoverDuration:
          type: integer
          minimum: 0
          maximum: 1440
        status:
          $ref: "#/components/schemas/ReservationTimePolicyStatus"
        effectiveAt:
          oneOf:
            - $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
            - type: "null"
    PartyComposition:
      type: object
      additionalProperties: false
      required: [adultCount, childCount, infantCount, totalCount]
      properties:
        adultCount:
          type: integer
          minimum: 0
        childCount:
          type: integer
          minimum: 0
        infantCount:
          type: integer
          minimum: 0
        totalCount:
          type: integer
          minimum: 1
    PartyCompositionRequest:
      type: object
      additionalProperties: false
      required: [adultCount, childCount, infantCount]
      properties:
        adultCount:
          type: integer
          minimum: 0
          maximum: 100
        childCount:
          type: integer
          minimum: 0
          maximum: 100
        infantCount:
          type: integer
          minimum: 0
          maximum: 100
      description: 세 값의 합은 1 이상이며 매장 정책 범위 안이어야 한다.
    MenuSelectionRequest:
      type: object
      additionalProperties: false
      required: [menuId, quantity]
      properties:
        menuId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        quantity:
          type: integer
          minimum: 1
          maximum: 100
    ReservationCreateRequest:
      type: object
      additionalProperties: false
      required: [storeId, serviceDate, startTime, party]
      properties:
        storeId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        serviceDate:
          $ref: "#/components/schemas/StoreLocalDate"
        startTime:
          $ref: "#/components/schemas/StoreLocalTime"
        startOffset:
          type: string
          pattern: "^[+-](?:(?:0[0-9]|1[0-7]):[0-5][0-9]|18:00)$"
          description: DST 중복 현지 시각 식별용 선택적 UTC offset. 매장 시간대의 유효 offset과 일치해야 한다.
          examples:
            - "+09:00"
        party:
          $ref: "#/components/schemas/PartyCompositionRequest"
        menuSelections:
          type: array
          maxItems: 20
          default: []
          items:
            $ref: "#/components/schemas/MenuSelectionRequest"
    ConsumerCancellationRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    StoreCancellationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    EmptyCommandRequest:
      type: object
      additionalProperties: false
    MenuHoldItem:
      type: object
      additionalProperties: false
      required: [menuId, menuName, unitPrice, quantity]
      properties:
        menuId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        menuName:
          type: string
          minLength: 1
          maxLength: 100
        unitPrice:
          type: integer
          format: int64
          minimum: 0
        quantity:
          type: integer
          minimum: 1
    ReservationDetail:
      type: object
      additionalProperties: false
      required:
        - reservationId
        - storeId
        - storeName
        - serviceDate
        - timeStatus
        - startAt
        - serviceEndAt
        - timeZoneId
        - party
        - status
        - menuSelections
        - createdAt
        - cancelledBy
        - cancellationReason
      properties:
        reservationId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        storeId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        storeName:
          type: string
          minLength: 1
          maxLength: 100
        serviceDate:
          $ref: "#/components/schemas/StoreLocalDate"
        timeStatus:
          $ref: "#/components/schemas/ReservationTimeStatus"
        startAt:
          oneOf:
            - $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
            - type: "null"
          description: LEGACY_UNRESOLVED이면 null
        serviceEndAt:
          oneOf:
            - $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
            - type: "null"
          description: LEGACY_UNRESOLVED이면 null
        timeZoneId:
          type: [string, "null"]
          minLength: 1
          maxLength: 64
          description: 예약 계산에 사용한 매장 IANA 시간대. LEGACY_UNRESOLVED이면 null
          examples:
            - Asia/Seoul
        party:
          $ref: "#/components/schemas/PartyComposition"
        status:
          $ref: "#/components/schemas/ReservationStatus"
        menuSelections:
          type: array
          items:
            $ref: "#/components/schemas/MenuHoldItem"
        cancelledBy:
          type:
            - string
            - "null"
          enum: [CONSUMER, STORE_OPERATOR, null]
        cancellationReason:
          type:
            - string
            - "null"
          maxLength: 500
        createdAt:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
    ReservationSummary:
      type: object
      additionalProperties: false
      required:
        - reservationId
        - serviceDate
        - timeStatus
        - startAt
        - serviceEndAt
        - timeZoneId
        - totalPartySize
        - status
      properties:
        reservationId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        serviceDate:
          $ref: "#/components/schemas/StoreLocalDate"
        timeStatus:
          $ref: "#/components/schemas/ReservationTimeStatus"
        startAt:
          oneOf:
            - $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
            - type: "null"
          description: LEGACY_UNRESOLVED이면 null
        serviceEndAt:
          oneOf:
            - $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
            - type: "null"
          description: LEGACY_UNRESOLVED이면 null
        timeZoneId:
          type: [string, "null"]
          minLength: 1
          maxLength: 64
          description: 예약 계산에 사용한 매장 IANA 시간대. LEGACY_UNRESOLVED이면 null
          examples:
            - Asia/Seoul
        totalPartySize:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/ReservationStatus"
    ReservationPageData:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReservationSummary"
        page:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PageMetadata"
    CapacityBucketRequest:
      type: object
      additionalProperties: false
      required:
        - startTime
        - endTime
        - maxPeople
        - maxTeams
        - minPartySize
        - maxPartySize
        - infantsAllowed
      properties:
        startTime:
          $ref: "#/components/schemas/StoreLocalTime"
        endTime:
          $ref: "#/components/schemas/StoreLocalTime"
        maxPeople:
          type: integer
          minimum: 1
          maximum: 10000
        maxTeams:
          type: integer
          minimum: 0
          maximum: 10000
        minPartySize:
          type: integer
          minimum: 1
          maximum: 100
        maxPartySize:
          type: integer
          minimum: 1
          maximum: 100
        infantsAllowed:
          type: boolean
    ReservationCapacitiesRequest:
      type: object
      additionalProperties: false
      required: [buckets]
      properties:
        buckets:
          type: array
          minItems: 1
          maxItems: 96
          items:
            $ref: "#/components/schemas/CapacityBucketRequest"
    CapacityBucket:
      type: object
      additionalProperties: false
      required:
        - capacityBucketId
        - startTime
        - endTime
        - maxPeople
        - maxTeams
        - occupiedPeople
        - occupiedTeams
        - availablePeople
        - availableTeams
      properties:
        capacityBucketId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        startTime:
          $ref: "#/components/schemas/StoreLocalTime"
        endTime:
          $ref: "#/components/schemas/StoreLocalTime"
        maxPeople:
          type: integer
          minimum: 1
        maxTeams:
          type: integer
          minimum: 0
        occupiedPeople:
          type: integer
          minimum: 0
        occupiedTeams:
          type: integer
          minimum: 0
        availablePeople:
          type: integer
          minimum: 0
        availableTeams:
          type: integer
          minimum: 0
    ReservationCapacitiesData:
      type: object
      additionalProperties: false
      required: [serviceDate, policyVersion, buckets]
      properties:
        serviceDate:
          $ref: "#/components/schemas/StoreLocalDate"
        policyVersion:
          type: integer
          format: int64
          minimum: 1
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/CapacityBucket"
    ReservationSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/ReservationDetail"
    ReservationPageSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/ReservationPageData"
    ReservationCapacitiesSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/ReservationCapacitiesData"
    ReservationTimePolicySuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/ReservationTimePolicyResponse"
    ReservationHistoryPageSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/ReservationHistoryPageData"
  responses:
    AccountRestricted:
      description: 현재 계정 상태가 이용을 허용하지 않음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: AUTH_011
            message: 현재 계정 상태로 이용할 수 없습니다.
    ReservationNotFound:
      description: 본인 또는 대상 매장 범위에서 예약을 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: RESERVATION_001
            message: 예약을 찾을 수 없습니다.
    ReservationCreationNotFound:
      description: 매장, 선택 메뉴 또는 해당 시간대 메뉴 수량 버킷을 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          examples:
            storeNotFound:
              value:
                code: STORE_001
                message: 매장을 찾을 수 없습니다.
            menuNotFound:
              value:
                code: STORE_009
                message: 메뉴를 찾을 수 없습니다.
            menuInventoryBucketNotFound:
              value:
                code: MENU_HOLD_003
                message: 메뉴 수량 버킷을 찾을 수 없습니다.
    StoreReservationNotFound:
      description: 대상 매장 또는 대상 매장 범위의 예약을 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          examples:
            storeNotFound:
              value:
                code: STORE_001
                message: 매장을 찾을 수 없습니다.
            reservationNotFound:
              value:
                code: RESERVATION_001
                message: 예약을 찾을 수 없습니다.
    ReservationConflict:
      description: 시간·수용량·중복·정책·메뉴 수량 충돌 또는 예약 연락처 미등록
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          examples:
            capacityConflict:
              value:
                code: RESERVATION_003
                message: 요청한 시간의 예약 수용량이 부족합니다.
            contactMissing:
              value:
                code: ACCOUNT_006
                message: 예약 알림에 사용할 연락처를 먼저 등록해야 합니다.
            ineligibleMenu:
              value:
                code: MENU_HOLD_001
                message: 현재 메뉴 상태 또는 자격에서 홀드할 수 없습니다.
            insufficientMenuQuantity:
              value:
                code: MENU_HOLD_002
                message: 요청한 구간의 온라인 메뉴 수량이 부족합니다.
    ReservationStateConflict:
      description: 현재 상태 또는 취소 정책에서 명령 불가
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          examples:
            invalidState:
              value:
                code: RESERVATION_005
                message: 현재 예약 상태에서 처리할 수 없습니다.
            cancellationPolicyRejected:
              value:
                code: RESERVATION_006
                message: 현재 취소 정책에서 처리할 수 없습니다.
    ReservationFulfillmentForbidden:
      description: 비활성 운영자 계정 또는 대상 매장의 대표 운영자 권한 없음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          examples:
            restrictedOperatorAccount:
              value:
                code: AUTH_011
                message: 현재 계정 상태로는 이용할 수 없습니다.
            storeAccessDenied:
              value:
                code: STORE_003
                message: 대상 매장의 대표 운영자가 아닙니다.
    ReservationFulfillmentConflict:
      description: 방문 완료 상태·MenuHold·멱등·동시 요청 충돌
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          examples:
            invalidReservationState:
              value: { code: RESERVATION_005, message: 현재 예약 상태에서 처리할 수 없습니다. }
            invalidMenuHoldState:
              value: { code: MENU_HOLD_006, message: 현재 수량 상태에서 요청한 전이를 수행할 수 없습니다. }
            idempotencyKeyReused:
              value: { code: COMMON_007, message: 동일한 Idempotency-Key를 다른 요청에 사용할 수 없습니다. }
            concurrentModification:
              value: { code: COMMON_008, message: 동시 요청 충돌로 처리하지 못했습니다. 다시 시도해 주세요. }
    CapacityConfigurationConflict:
      description: 시간대·현재 점유와 수용량 설정 충돌
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: RESERVATION_008
            message: 현재 예약 점유와 수용량 설정이 충돌합니다.
    ReservationTimePolicyConflict:
      description: 시간 정책 lifecycle·매장 상태·멱등·동시 요청 충돌
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          examples:
            policyLifecycleConflict:
              value:
                code: RESERVATION_010
                message: 현재 시간 정책 상태에서 요청한 작업을 수행할 수 없습니다.
            invalidStoreState:
              value:
                code: STORE_005
                message: 현재 매장 상태에서 요청한 작업을 수행할 수 없습니다.
            invalidVerificationState:
              value:
                code: STORE_007
                message: 현재 입점 검증 상태에서 운영할 수 없습니다.
            idempotencyKeyReused:
              value:
                code: COMMON_007
                message: 동일한 Idempotency-Key를 다른 요청에 사용할 수 없습니다.
            concurrentModification:
              value:
                code: COMMON_008
                message: 동시 요청 충돌로 처리하지 못했습니다. 다시 시도해 주세요.
    StoreNotFound:
      description: 매장을 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: STORE_001
            message: 매장을 찾을 수 없습니다.
    StoreAccessDenied:
      description: 대상 매장 운영 권한 없음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: STORE_003
            message: 대상 매장의 운영 권한이 없습니다.
