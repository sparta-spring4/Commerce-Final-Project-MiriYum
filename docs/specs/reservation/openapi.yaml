openapi: 3.1.0
info:
  title: MiriYum MVP1 Reservation API
  version: 1.0.0
  description: 일반 예약·수용량·취소·방문 완료 계약
  license:
    name: All rights reserved
    identifier: LicenseRef-All-Rights-Reserved
servers:
  - url: /
    description: 배포 환경의 동일 origin
security: []
tags:
  - name: Reservation
    description: 일반 사용자 예약
  - name: Reservation Management
    description: 매장 운영자 예약 관리
  - name: Reservation Capacity
    description: 매장 날짜·시간 구간별 인원·팀 수
paths:
  /api/v1/reservations:
    post:
      tags: [Reservation]
      summary: 일반 예약과 선택 메뉴 홀드 생성
      operationId: createReservation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationCreateRequest"
      responses:
        "201":
          description: 즉시 확정된 예약
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ReservationConflict"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/reservations/{reservationId}:
    get:
      tags: [Reservation]
      summary: 본인 예약 상세 조회
      operationId: getReservation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: 본인 예약 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationSuccessResponse"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ReservationNotFound"
  /api/v1/reservations/{reservationId}/cancellations:
    post:
      tags: [Reservation]
      summary: 본인 예약 취소
      operationId: cancelReservationByConsumer
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReservationId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerCancellationRequest"
      responses:
        "200":
          description: 취소된 예약과 복구 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ReservationNotFound"
        "409":
          $ref: "#/components/responses/ReservationStateConflict"
  /api/v1/store-operator/stores/{storeId}/reservations:
    get:
      tags: [Reservation Management]
      summary: 매장 예약 목록 조회
      operationId: getStoreReservations
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - name: serviceDate
          in: query
          required: false
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalDate"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ReservationStatus"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/Page"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/Size"
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - "serviceDate,asc"
              - "serviceDate,desc"
              - "createdAt,asc"
              - "createdAt,desc"
            default: "serviceDate,asc"
          description: 허용된 정렬 하나
      responses:
        "200":
          description: 대상 매장 예약 페이지
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationPageSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
  /api/v1/store-operator/stores/{storeId}/reservations/{reservationId}:
    get:
      tags: [Reservation Management]
      summary: 매장 예약 상세 조회
      operationId: getStoreReservation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: 대상 매장 예약 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationSuccessResponse"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/ReservationNotFound"
  /api/v1/store-operator/stores/{storeId}/reservations/{reservationId}/cancellations:
    post:
      tags: [Reservation Management]
      summary: 매장 사유 예약 취소
      operationId: cancelReservationByStoreOperator
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/ReservationId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreCancellationRequest"
      responses:
        "200":
          description: 취소된 예약과 복구 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/ReservationNotFound"
        "409":
          $ref: "#/components/responses/ReservationStateConflict"
  /api/v1/store-operator/stores/{storeId}/reservations/{reservationId}/fulfillments:
    post:
      tags: [Reservation Management]
      summary: 예약 방문 완료
      operationId: fulfillReservation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/ReservationId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyCommandRequest"
      responses:
        "200":
          description: 방문 완료된 예약
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/ReservationNotFound"
        "409":
          $ref: "#/components/responses/ReservationStateConflict"
  /api/v1/store-operator/stores/{storeId}/reservation-capacities/{serviceDate}:
    put:
      tags: [Reservation Capacity]
      summary: 날짜별 예약 수용량 전체 게시
      operationId: replaceReservationCapacities
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/ServiceDate"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationCapacitiesRequest"
      responses:
        "200":
          description: 게시된 수용량 정책
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationCapacitiesSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "409":
          $ref: "#/components/responses/CapacityConfigurationConflict"
components:
  securitySchemes:
    bearerAuth:
      $ref: "../mvp1-common/openapi.yaml#/components/securitySchemes/bearerAuth"
  parameters:
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
    StoreId:
      name: storeId
      in: path
      required: true
      schema:
        $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
    ServiceDate:
      name: serviceDate
      in: path
      required: true
      schema:
        $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalDate"
  schemas:
    ReservationStatus:
      type: string
      enum: [CONFIRMED, CANCELLED, FULFILLED]
    PartyComposition:
      type: object
      additionalProperties: false
      required: [adultCount, childCount, infantCount, totalCount]
      properties:
        adultCount:
          type: integer
          minimum: 0
        childCount:
          type: integer
          minimum: 0
        infantCount:
          type: integer
          minimum: 0
        totalCount:
          type: integer
          minimum: 1
    PartyCompositionRequest:
      type: object
      additionalProperties: false
      required: [adultCount, childCount, infantCount]
      properties:
        adultCount:
          type: integer
          minimum: 0
          maximum: 100
        childCount:
          type: integer
          minimum: 0
          maximum: 100
        infantCount:
          type: integer
          minimum: 0
          maximum: 100
      description: 세 값의 합은 1 이상이며 매장 정책 범위 안이어야 한다.
    MenuSelectionRequest:
      type: object
      additionalProperties: false
      required: [menuId, quantity]
      properties:
        menuId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        quantity:
          type: integer
          minimum: 1
          maximum: 100
    ReservationCreateRequest:
      type: object
      additionalProperties: false
      required: [storeId, serviceDate, startTime, party]
      properties:
        storeId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        serviceDate:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalDate"
        startTime:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalTime"
        party:
          $ref: "#/components/schemas/PartyCompositionRequest"
        menuSelections:
          type: array
          maxItems: 20
          default: []
          items:
            $ref: "#/components/schemas/MenuSelectionRequest"
    ConsumerCancellationRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    StoreCancellationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    EmptyCommandRequest:
      type: object
      additionalProperties: false
    MenuHoldItem:
      type: object
      additionalProperties: false
      required: [menuId, menuName, unitPrice, quantity]
      properties:
        menuId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        menuName:
          type: string
          minLength: 1
          maxLength: 100
        unitPrice:
          type: integer
          format: int64
          minimum: 0
        quantity:
          type: integer
          minimum: 1
    ReservationDetail:
      type: object
      additionalProperties: false
      required:
        - reservationId
        - storeId
        - storeName
        - serviceDate
        - startTime
        - endTime
        - party
        - status
        - menuSelections
        - createdAt
      properties:
        reservationId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        storeId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        storeName:
          type: string
          minLength: 1
          maxLength: 100
        serviceDate:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalDate"
        startTime:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalTime"
        endTime:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalTime"
        party:
          $ref: "#/components/schemas/PartyComposition"
        status:
          $ref: "#/components/schemas/ReservationStatus"
        menuSelections:
          type: array
          items:
            $ref: "#/components/schemas/MenuHoldItem"
        cancelledBy:
          type:
            - string
            - "null"
          enum: [CONSUMER, STORE_OPERATOR, null]
        cancellationReason:
          type:
            - string
            - "null"
          maxLength: 500
        createdAt:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
    ReservationSummary:
      type: object
      additionalProperties: false
      required:
        - reservationId
        - serviceDate
        - startTime
        - endTime
        - totalPartySize
        - status
      properties:
        reservationId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        serviceDate:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalDate"
        startTime:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalTime"
        endTime:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalTime"
        totalPartySize:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/ReservationStatus"
    ReservationPageData:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReservationSummary"
        page:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PageMetadata"
    CapacityBucketRequest:
      type: object
      additionalProperties: false
      required:
        - startTime
        - endTime
        - maxPeople
        - maxTeams
        - minPartySize
        - maxPartySize
        - infantsAllowed
      properties:
        startTime:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalTime"
        endTime:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalTime"
        maxPeople:
          type: integer
          minimum: 0
          maximum: 10000
        maxTeams:
          type: integer
          minimum: 0
          maximum: 10000
        minPartySize:
          type: integer
          minimum: 1
          maximum: 100
        maxPartySize:
          type: integer
          minimum: 1
          maximum: 100
        infantsAllowed:
          type: boolean
    ReservationCapacitiesRequest:
      type: object
      additionalProperties: false
      required: [buckets]
      properties:
        buckets:
          type: array
          minItems: 1
          maxItems: 96
          items:
            $ref: "#/components/schemas/CapacityBucketRequest"
    CapacityBucket:
      type: object
      additionalProperties: false
      required:
        - capacityBucketId
        - startTime
        - endTime
        - maxPeople
        - maxTeams
        - occupiedPeople
        - occupiedTeams
        - availablePeople
        - availableTeams
      properties:
        capacityBucketId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        startTime:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalTime"
        endTime:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalTime"
        maxPeople:
          type: integer
          minimum: 0
        maxTeams:
          type: integer
          minimum: 0
        occupiedPeople:
          type: integer
          minimum: 0
        occupiedTeams:
          type: integer
          minimum: 0
        availablePeople:
          type: integer
          minimum: 0
        availableTeams:
          type: integer
          minimum: 0
    ReservationCapacitiesData:
      type: object
      additionalProperties: false
      required: [serviceDate, policyVersion, buckets]
      properties:
        serviceDate:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalDate"
        policyVersion:
          type: integer
          format: int64
          minimum: 1
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/CapacityBucket"
    ReservationSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/ReservationDetail"
    ReservationPageSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/ReservationPageData"
    ReservationCapacitiesSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/ReservationCapacitiesData"
  responses:
    ReservationNotFound:
      description: 본인 또는 대상 매장 범위에서 예약을 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: RESERVATION_001
            message: 예약을 찾을 수 없습니다.
    ReservationConflict:
      description: 시간·수용량·중복·정책 또는 메뉴 수량 충돌
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: RESERVATION_003
            message: 요청한 시간의 예약 수용량이 부족합니다.
    ReservationStateConflict:
      description: 현재 상태 또는 취소 정책에서 명령 불가
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: RESERVATION_005
            message: 현재 예약 상태에서 처리할 수 없습니다.
    CapacityConfigurationConflict:
      description: 시간대·현재 점유와 수용량 설정 충돌
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: RESERVATION_008
            message: 현재 예약 점유와 수용량 설정이 충돌합니다.
    StoreAccessDenied:
      description: 대상 매장 운영 권한 없음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: STORE_003
            message: 대상 매장의 운영 권한이 없습니다.
