openapi: 3.1.0
info:
  title: MiriYum Store Dashboard Analytics API
  version: 1.0.0
  description: Contract-first API for the Issue #270 store-operator dashboard snapshot.
  license:
    name: All rights reserved
    identifier: LicenseRef-All-Rights-Reserved
servers:
  - url: /
security: []
paths:
  /api/v1/store-operators/stores/{storeId}/dashboard-statistics:
    get:
      tags: [Store Dashboard Analytics]
      operationId: getStoreDashboardStatistics
      summary: 매장 운영 대시보드 통계 snapshot 조회
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/DashboardSnapshotSuccess"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AnalyticsStoreForbidden"
        "404":
          $ref: "#/components/responses/AnalyticsStoreNotFound"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      $ref: "../mvp1-common/openapi.yaml#/components/securitySchemes/bearerAuth"
  schemas:
    MetricCompleteness:
      type: string
      enum: [COMPLETE, DELAYED, PARTIAL, UNAVAILABLE]
      description: 지표 하나의 입력 완전성 상태
    MetricReasonCode:
      type: [string, "null"]
      enum:
        - null
        - SOURCE_CONTRACT_MISSING
        - SOURCE_DELAYED
        - SOURCE_FAILED
        - SOURCE_QUARANTINED
        - INVALID_DENOMINATOR
      description: COMPLETE이면 null이고 그 밖의 상태에서는 공개 가능한 원인 코드
    NullableDataThrough:
      oneOf:
        - $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
        - type: "null"
      description: 해당 지표가 반영한 마지막 원본 사건 시각. 원본 계약이 없으면 null이다.
    CountMetric:
      type: object
      additionalProperties: false
      required:
        - value
        - definitionVersion
        - aggregationVersion
        - asOf
        - dataThrough
        - inputCheckpoint
        - completeness
        - corrected
        - reasonCode
      properties:
        value:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: 집계 가능한 고유 팀 수. UNAVAILABLE이면 null이며 0으로 가장하지 않는다.
        definitionVersion:
          type: string
          minLength: 1
        aggregationVersion:
          type: integer
          format: int64
          minimum: 1
        asOf:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
        dataThrough:
          $ref: "#/components/schemas/NullableDataThrough"
        inputCheckpoint:
          type: [string, "null"]
          minLength: 1
        completeness:
          $ref: "#/components/schemas/MetricCompleteness"
        corrected:
          type: boolean
        reasonCode:
          $ref: "#/components/schemas/MetricReasonCode"
    RateValue:
      type: object
      additionalProperties: false
      required: [numerator, denominator, ratio]
      properties:
        numerator:
          type: integer
          format: int64
          minimum: 0
        denominator:
          type: integer
          format: int64
          minimum: 1
        ratio:
          type: number
          format: double
          minimum: 0
          description: numerator / denominator의 합산 비율이며 구간별 비율을 더하지 않는다.
    RateMetric:
      type: object
      additionalProperties: false
      required:
        - value
        - definitionVersion
        - aggregationVersion
        - asOf
        - dataThrough
        - inputCheckpoint
        - completeness
        - corrected
        - reasonCode
      properties:
        value:
          oneOf:
            - $ref: "#/components/schemas/RateValue"
            - type: "null"
          description: 유효한 분모가 없거나 원본을 읽지 못하면 null이다.
        definitionVersion:
          type: string
          minLength: 1
        aggregationVersion:
          type: integer
          format: int64
          minimum: 1
        asOf:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
        dataThrough:
          $ref: "#/components/schemas/NullableDataThrough"
        inputCheckpoint:
          type: [string, "null"]
          minLength: 1
        completeness:
          $ref: "#/components/schemas/MetricCompleteness"
        corrected:
          type: boolean
        reasonCode:
          $ref: "#/components/schemas/MetricReasonCode"
    WaitingValue:
      type: object
      additionalProperties: false
      required:
        - waitingTeams
        - calledTeams
        - waitingPeople
        - calledPeople
        - longestWaitSeconds
      properties:
        waitingTeams:
          type: integer
          format: int64
          minimum: 0
        calledTeams:
          type: integer
          format: int64
          minimum: 0
        waitingPeople:
          type: integer
          format: int64
          minimum: 0
        calledPeople:
          type: integer
          format: int64
          minimum: 0
        longestWaitSeconds:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: WAITING·CALLED 팀의 최초 등록 시각부터 asOf까지이며 활성 팀이 없으면 null이다.
    WaitingMetric:
      type: object
      additionalProperties: false
      required:
        - value
        - definitionVersion
        - aggregationVersion
        - asOf
        - dataThrough
        - inputCheckpoint
        - completeness
        - corrected
        - reasonCode
      properties:
        value:
          oneOf:
            - $ref: "#/components/schemas/WaitingValue"
            - type: "null"
        definitionVersion:
          type: string
          minLength: 1
        aggregationVersion:
          type: integer
          format: int64
          minimum: 1
        asOf:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
        dataThrough:
          $ref: "#/components/schemas/NullableDataThrough"
        inputCheckpoint:
          type: [string, "null"]
          minLength: 1
        completeness:
          $ref: "#/components/schemas/MetricCompleteness"
        corrected:
          type: boolean
        reasonCode:
          $ref: "#/components/schemas/MetricReasonCode"
    NoShowValue:
      type: object
      additionalProperties: false
      required: [reservationCandidate, reservationConfirmed, waitingConfirmed]
      properties:
        reservationCandidate:
          $ref: "#/components/schemas/CountMetric"
        reservationConfirmed:
          $ref: "#/components/schemas/CountMetric"
        waitingConfirmed:
          $ref: "#/components/schemas/CountMetric"
    NoShowMetric:
      type: object
      additionalProperties: false
      required:
        - value
        - definitionVersion
        - aggregationVersion
        - asOf
        - dataThrough
        - inputCheckpoint
        - completeness
        - corrected
        - reasonCode
      properties:
        value:
          $ref: "#/components/schemas/NoShowValue"
        definitionVersion:
          type: string
          minLength: 1
        aggregationVersion:
          type: integer
          format: int64
          minimum: 1
        asOf:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
        dataThrough:
          $ref: "#/components/schemas/NullableDataThrough"
        inputCheckpoint:
          type: [string, "null"]
          minLength: 1
        completeness:
          $ref: "#/components/schemas/MetricCompleteness"
        corrected:
          type: boolean
        reasonCode:
          $ref: "#/components/schemas/MetricReasonCode"
    DashboardSnapshotData:
      type: object
      additionalProperties: false
      required:
        - snapshotId
        - storeId
        - businessDate
        - timeZoneId
        - asOf
        - generatedAt
        - storeAuthorityVersion
        - metrics
      properties:
        snapshotId:
          type: string
          format: uuid
        storeId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        businessDate:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalDate"
        timeZoneId:
          type: string
          const: Asia/Seoul
        asOf:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
        generatedAt:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
        storeAuthorityVersion:
          type: integer
          format: int64
          minimum: 1
        metrics:
          type: object
          additionalProperties: false
          required:
            - todayReservationTeams
            - reservationRate
            - teamCapacityUsageRate
            - cancellationRate
            - waiting
            - noShow
          properties:
            todayReservationTeams:
              $ref: "#/components/schemas/CountMetric"
            reservationRate:
              $ref: "#/components/schemas/RateMetric"
            teamCapacityUsageRate:
              $ref: "#/components/schemas/RateMetric"
            cancellationRate:
              $ref: "#/components/schemas/RateMetric"
            waiting:
              $ref: "#/components/schemas/WaitingMetric"
            noShow:
              $ref: "#/components/schemas/NoShowMetric"
    DashboardSnapshotSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/DashboardSnapshotData"
  responses:
    DashboardSnapshotSuccess:
      description: 동일 기준 시각의 대시보드 통계 snapshot. 지표 실패는 지표별 완전성으로 반환한다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DashboardSnapshotSuccessResponse"
          examples:
            reservationNoShowPending:
              summary: 예약 노쇼 계약은 없고 Waiting 확정 미응답만 집계된 부분 snapshot
              value:
                code: SUCCESS
                message: 대시보드 통계를 조회했습니다.
                data:
                  snapshotId: 8db61ee7-2df6-4cbc-ab53-720ef1a79cc1
                  storeId: "17"
                  businessDate: "2026-08-16"
                  timeZoneId: Asia/Seoul
                  asOf: "2026-08-16T18:00:00+09:00"
                  generatedAt: "2026-08-16T18:00:01+09:00"
                  storeAuthorityVersion: 1
                  metrics:
                    todayReservationTeams:
                      value: 12
                      definitionVersion: analytics-004-today-reservation-teams-v1
                      aggregationVersion: 3
                      asOf: "2026-08-16T18:00:00+09:00"
                      dataThrough: "2026-08-16T17:59:40+09:00"
                      inputCheckpoint: "reservation:481"
                      completeness: COMPLETE
                      corrected: false
                      reasonCode: null
                    reservationRate:
                      value:
                        numerator: 48
