                          inputCheckpoint: "waiting:912"
                          completeness: COMPLETE
                          corrected: false
                          reasonCode: null
                      definitionVersion: analytics-004-no-show-v1
                      aggregationVersion: 2
                      asOf: "2026-08-16T18:00:00+09:00"
                      dataThrough: "2026-08-16T17:59:54+09:00"
                      inputCheckpoint: "waiting:912"
                      completeness: PARTIAL
                      corrected: false
                      reasonCode: SOURCE_CONTRACT_MISSING
    AnalyticsStoreForbidden:
      description: 현재 매장 운영자 계정 상태 또는 대상 매장 소유권이 허용되지 않음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          examples:
            accountRestricted:
              value:
                code: AUTH_011
                message: 현재 계정 상태에서는 요청할 수 없습니다.
            storeOwnershipRequired:
              value:
                code: STORE_003
                message: 대상 매장을 관리할 권한이 없습니다.
    AnalyticsStoreNotFound:
      description: 대상 매장이 실제로 존재하지 않음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: STORE_001
            message: 매장을 찾을 수 없습니다.
