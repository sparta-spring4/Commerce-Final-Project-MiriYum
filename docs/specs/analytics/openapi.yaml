                      reasonCode: null
                    teamCapacityUsageRate:
                      value:
                        numerator: 12
                        denominator: 20
                        ratio: 0.6
                      definitionVersion: analytics-004-team-capacity-usage-rate-v1
                      aggregationVersion: 3
                      asOf: "2026-08-16T18:00:00+09:00"
                      dataThrough: "2026-08-16T17:59:40+09:00"
                      inputCheckpoint: "reservation:481"
                      completeness: COMPLETE
                      corrected: false
                      reasonCode: null
                    cancellationRate:
                      value:
                        numerator: 2
                        denominator: 14
                        ratio: 0.142857142857
                      definitionVersion: analytics-004-cancellation-rate-v1
                      aggregationVersion: 3
                      asOf: "2026-08-16T18:00:00+09:00"
                      dataThrough: "2026-08-16T17:59:40+09:00"
