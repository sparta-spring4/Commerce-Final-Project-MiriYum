                    noShow:
                      value:
                        reservationCandidate:
                          value: null
                          definitionVersion: analytics-004-reservation-no-show-candidate-v1
                          aggregationVersion: 1
                          asOf: "2026-08-16T18:00:00+09:00"
                          dataThrough: null
                          inputCheckpoint: null
                          completeness: UNAVAILABLE
                          corrected: false
