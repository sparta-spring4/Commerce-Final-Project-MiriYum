openapi: 3.1.0
info:
  title: MiriYum 1차 MVP 통합 API
  version: 1.0.0
  description: |
    1차 MVP의 공개 HTTP 계약을 기능별 OpenAPI 원본에서 모은 통합 진입점이다.
    기능별 파일이 각 경로의 단일 소유자이며 이 파일에는 중복 정의하지 않는다.
  license:
    name: All rights reserved
    identifier: LicenseRef-All-Rights-Reserved
servers:
  - url: /
    description: 배포 환경의 동일 origin
security: []
tags:
  - name: Consumer Auth
    description: 일반 사용자 가입·로그인·토큰·세션
  - name: Store Operator Auth
    description: 매장 운영자 가입·로그인·토큰·세션
  - name: Account
    description: 계정 유형별 본인 정보
  - name: My Page
    description: 일반 사용자 마이페이지
  - name: Store Search
    description: 공개 매장·메뉴 탐색
  - name: Catalog
    description: 검색·입력 허용 코드
  - name: Store Management
    description: 매장 운영자 기본 관리
  - name: Reservation
    description: 일반 사용자 예약
  - name: Reservation Management
    description: 매장 운영자 예약 관리
  - name: Reservation Capacity
    description: 날짜·시간 구간별 인원·팀 수
  - name: Menu Hold Availability
    description: 일반 예약 선택 메뉴 가용량
  - name: Pickup
    description: 일반 사용자 픽업 예약
  - name: Pickup Management
    description: 매장 운영자 픽업 관리
  - name: Menu Inventory
    description: 매장 운영자 시간대별 메뉴 수량 관리
