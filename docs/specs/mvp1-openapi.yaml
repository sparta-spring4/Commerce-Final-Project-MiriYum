components:
  securitySchemes:
    bearerAuth:
      $ref: "./mvp1-common/openapi.yaml#/components/securitySchemes/bearerAuth"
    consumerRefreshCookie:
      type: apiKey
      in: cookie
      name: MIRIYUM_CONSUMER_REFRESH
      description: 일반 사용자 Refresh JWT HttpOnly 쿠키
    storeOperatorRefreshCookie:
      type: apiKey
      in: cookie
      name: MIRIYUM_STORE_OPERATOR_REFRESH
      description: 매장 운영자 Refresh JWT HttpOnly 쿠키
