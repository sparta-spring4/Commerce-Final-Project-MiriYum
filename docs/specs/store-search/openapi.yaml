      tags: [Store Management]
      summary: 메뉴 판매 상태 변경
      description: >-
        SELLING, SOLD_OUT, PAUSED는 운영자가 관리하는 메뉴 전체 수동 판매 상태다.
        메뉴 홀드·픽업의 InventoryAvailabilityStatus AVAILABLE/SOLD_OUT은 운영자가 제어하는
        제공 날짜·시간 구간별 수동 가용 상태다. 온라인 가용량은 ONLINE_HOLD와 정책상 허용된
        SHARED 잔여로 별도 계산하며 수량 변화만으로 구간 상태나 메뉴 기본 판매 상태를 자동 변경하지 않는다.
        신규 거래는 구간 상태가 AVAILABLE이고 온라인 가용량이 양수일 때만 허용한다.
      operationId: changeMenuSellingStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/MenuId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuSellingStatusRequest"
      responses:
        "200":
          description: 판매 상태가 변경된 메뉴
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedMenuSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/MenuNotFound"
        "409":
          $ref: "#/components/responses/MenuStateConflict"
  /api/v1/store-operators/stores/{storeId}/menus/{menuId}/retirements:
    post:
      tags: [Store Management]
      summary: 메뉴 운영 종료
      operationId: retireMenu
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/MenuId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuChangeReasonRequest"
      responses:
        "200":
          description: 운영 종료된 메뉴
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedMenuSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/MenuNotFound"
        "409":
          $ref: "#/components/responses/MenuStateConflict"
  /api/v1/store-operators/stores/{storeId}/representative-menus:
    get:
      tags: [Store Management]
      summary: 대표(인기) 메뉴 설정 조회
      operationId: getRepresentativeMenus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: 현재 대표 메뉴 설정
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepresentativeMenuSettingSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreNotFound"
    put:
      tags: [Store Management]
      summary: 대표(인기) 메뉴 3~5개와 순서 전체 교체
      description: SOLD_OUT 메뉴는 선정을 유지할 수 있지만 HIDDEN, PAUSED, RETIRED 또는 미게시 메뉴는 저장할 수 없다.
      operationId: replaceRepresentativeMenus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepresentativeMenuReplaceRequest"
      responses:
        "200":
          description: 교체된 대표 메뉴 설정
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepresentativeMenuSettingSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/RepresentativeMenuNotFound"
        "409":
          $ref: "#/components/responses/RepresentativeMenuConflict"
components:
  securitySchemes:
    bearerAuth:
      $ref: "../mvp1-common/openapi.yaml#/components/securitySchemes/bearerAuth"
  parameters:
    StoreId:
      name: storeId
      in: path
      required: true
      schema:
        $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
    ScheduleVersion:
      name: version
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    MenuId:
      name: menuId
      in: path
      required: true
      schema:
        $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
    ImageId:
      name: imageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    MenuAlternativeMode:
      type: string
      enum: [SAME_STORE, NEARBY_STORE, NO_ALTERNATIVE, REGION_SELECTION_REQUIRED]
    AlternativeReasonCode:
      type: string
      enum: [SAME_PRIMARY_CATEGORY, PRICE_WITHIN_20_PERCENT, SECONDARY_CATEGORY_MATCH, ALLERGEN_FILTER_PASSED, IN_STOCK]
    MenuAlternativeRankingReason:
      type: string
      enum: [LLM_CONCEPT, SECONDARY_CATEGORY, PRICE_SIMILARITY]
    AllergenIngredientCode:
      type: string
      enum: [EGG, MILK, BUCKWHEAT, PEANUT, SOYBEAN, WHEAT, MACKEREL, CRAB, SHRIMP, PORK, PEACH, TOMATO, SULFITES, WALNUT, CHICKEN, BEEF, SQUID, SHELLFISH, PINE_NUT]
    MenuAlternativeSearchRequest:
      type: object
      additionalProperties: false
      required: [quantity, serviceDate, startTime, partySize]
      properties:
        quantity:
          type: integer
          minimum: 1
        serviceDate:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalDate"
        startTime:
          type: string
          pattern: "^(?:[01]\\d|2[0-3]):[0-5]\\d$"
        startOffset:
          type: string
          pattern: "^(?:[+-](?:0\\d|1[0-7]):[0-5]\\d|[+-]18:00)$"
        partySize:
          type: integer
          minimum: 1
          maximum: 100
        includesInfants:
          type: boolean
          default: false
        excludedAllergenCodes:
          type: array
          uniqueItems: true
          default: []
          items:
            $ref: "#/components/schemas/AllergenIngredientCode"
        size:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
    MenuAlternativeCoordinates:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
        longitude:
          type: number
    MenuAlternativeItem:
      type: object
      additionalProperties: false
      required: [storeId, storeName, menuId, menuName, unitPrice, availableOnlineQuantity, secondaryCategoryMatchCount, distanceMeters, coordinates, reasonCodes, alternativeScore, rankingReason, scoreBreakdown]
      properties:
        storeId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        storeName:
          type: string
        menuId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        menuName:
          type: string
        unitPrice:
          type: integer
          minimum: 0
        availableOnlineQuantity:
          type: integer
          minimum: 0
        secondaryCategoryMatchCount:
          type: integer
          minimum: 0
        distanceMeters:
          type: [number, "null"]
        coordinates:
          oneOf:
            - $ref: "#/components/schemas/MenuAlternativeCoordinates"
            - type: "null"
        reasonCodes:
          type: array
          items:
            $ref: "#/components/schemas/AlternativeReasonCode"
        alternativeScore:
          type: integer
          minimum: 0
          maximum: 100
        rankingReason:
          $ref: "#/components/schemas/MenuAlternativeRankingReason"
        scoreBreakdown:
          $ref: "#/components/schemas/MenuAlternativeScoreBreakdown"
    MenuAlternativeScoreBreakdown:
      type: object
      additionalProperties: false
      required: [llmConcept, secondaryCategory, priceSimilarity]
      properties:
        llmConcept:
          type: integer
          minimum: 0
          maximum: 50
        secondaryCategory:
          type: integer
          minimum: 0
          maximum: 20
        priceSimilarity:
          type: integer
          minimum: 0
          maximum: 30
    MenuAlternativeSearchData:
      type: object
      additionalProperties: false
      required: [sourceStoreId, sourceMenuId, quantity, startAt, serviceEndAt, timeZoneId, mode, items]
      properties:
        sourceStoreId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        sourceMenuId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        quantity:
          type: integer
          minimum: 1
        startAt:
          type: string
          format: date-time
        serviceEndAt:
          type: string
          format: date-time
        timeZoneId:
          type: string
        mode:
          $ref: "#/components/schemas/MenuAlternativeMode"
        items:
          type: array
          items:
            $ref: "#/components/schemas/MenuAlternativeItem"
    MenuAlternativeSearchSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/MenuAlternativeSearchData"
    Region:
      type: string
      enum: [SEOUL, BUSAN, DAEGU, DAEJEON, GWANGJU]
    CatalogCode:
      type: string
      pattern: "^[A-Z][A-Z0-9_]{1,49}$"
    ReservationAvailability:
      type: string
      enum: [NOT_REQUESTED, AVAILABLE, UNAVAILABLE]
    VerificationStatus:
      type: string
      enum: [APPROVED]
    OperationStatus:
      type: string
      enum: [OPEN, TEMPORARILY_CLOSED, CLOSED]
    EditableOperationStatus:
      type: string
      enum: [OPEN, TEMPORARILY_CLOSED]
    BusinessType:
      type: string
      description: 매장 등록 신청에서 선택하는 업종 구분. 픽업 가능 여부에는 사용하지 않는다.
      enum: [CAFE, BAKERY, OTHER]
    StoreModes:
      type: object
      description: 등록 업종과 무관하게 거래별 기능 활성화 여부를 선택한다.
      additionalProperties: false
      required: [reservationEnabled, menuHoldEnabled, pickupEnabled]
      properties:
        reservationEnabled:
          type: boolean
        menuHoldEnabled:
          type: boolean
        pickupEnabled:
          type: boolean
    StoreSummary:
      type: object
      additionalProperties: false
      required:
        - storeId
        - name
        - region
        - address
        - storeCategoryCode
        - operationStatus
        - modes
        - reservationAvailability
        - coordinates
      properties:
        storeId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        name:
          type: string
          minLength: 1
          maxLength: 100
        region:
          $ref: "#/components/schemas/Region"
        address:
          type: string
          minLength: 1
          maxLength: 300
        storeCategoryCode:
          $ref: "#/components/schemas/CatalogCode"
        operationStatus:
          $ref: "#/components/schemas/OperationStatus"
        modes:
          $ref: "#/components/schemas/StoreModes"
        reservationAvailability:
          $ref: "#/components/schemas/ReservationAvailability"
        coordinates:
          description: 현재 주소 버전에 결합된 VERIFIED 저장 좌표. 없으면 null이다.
          oneOf:
            - $ref: "#/components/schemas/PublicStoreCoordinates"
            - type: "null"
    PublicStoreCoordinates:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    InterpretationWarning:
      type: object
      additionalProperties: false
      required: [code, field]
      properties:
        code:
          type: string
          enum:
            - AMBIGUOUS_DICTIONARY_TERM
            - AMBIGUOUS_PRICE
            - CONFLICTING_PRICE
            - INVALID_PARTY_SIZE
            - CONFLICTING_PARTY_SIZE
            - AMBIGUOUS_DATE
            - CONFLICTING_DATE
            - AMBIGUOUS_TIME
            - CONFLICTING_TIME
            - INCOMPLETE_RESERVATION_CONDITION
            - OUT_OF_RANGE_NUMBER
        field:
          type: string
          enum: [DICTIONARY, PRICE, PARTY_SIZE, DATE, TIME, RESERVATION]
    NormalizedSearchCondition:
      type: object
      additionalProperties: false
      required:
        - regionCodes
        - storeCategoryCodes
        - menuCategoryCodes
        - tagCodes
        - minimumPrice
        - maximumPrice
        - partySize
        - reservationDate
        - reservationTime
        - remainingKeyword
      properties:
        regionCodes:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Region" }
        storeCategoryCodes:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/CatalogCode" }
        menuCategoryCodes:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/CatalogCode" }
        tagCodes:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/CatalogCode" }
        minimumPrice:
          type: [integer, "null"]
          format: int64
          minimum: 0
        maximumPrice:
          type: [integer, "null"]
          format: int64
          minimum: 0
        partySize:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
        reservationDate:
          oneOf:
            - $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalDate"
            - type: "null"
        reservationTime:
          oneOf:
            - $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalTime"
            - type: "null"
        remainingKeyword:
          type: string
          maxLength: 100
    IntegratedStoreSearchItem:
      type: object
      additionalProperties: false
      required:
        - storeId
        - name
        - region
        - address
        - storeCategoryCode
        - operationStatus
        - modes
        - reservationAvailability
        - coordinates
        - recommendationReason
      properties:
        storeId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        name:
          type: string
          minLength: 1
          maxLength: 100
        region:
          $ref: "#/components/schemas/Region"
        address:
          type: string
          minLength: 1
          maxLength: 300
        storeCategoryCode:
          $ref: "#/components/schemas/CatalogCode"
        operationStatus:
          $ref: "#/components/schemas/OperationStatus"
        modes:
          $ref: "#/components/schemas/StoreModes"
        reservationAvailability:
          $ref: "#/components/schemas/ReservationAvailability"
        coordinates:
          oneOf:
            - $ref: "#/components/schemas/PublicStoreCoordinates"
            - type: "null"
        recommendationReason:
          oneOf:
            - $ref: "#/components/schemas/RecommendationReason"
            - type: "null"
    RecommendationReason:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - KEYWORD_MATCH
            - STORE_CATEGORY_MATCH
            - MENU_PRIMARY_CATEGORY_MATCH
            - MENU_SECONDARY_CATEGORY_MATCH
            - TAG_MATCH
            - AVAILABILITY_MATCH
            - VISITED_STORE
            - ORDERED_MENU
        message:
          type: string
          minLength: 1
    IntegratedStoreSearchData:
      type: object
      additionalProperties: false
      required:
        - items
        - normalizedCondition
        - warnings
        - ruleVersion
        - vocabularyVersion
        - rankingRuleVersion
        - nextCursor
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IntegratedStoreSearchItem" }
        normalizedCondition:
          $ref: "#/components/schemas/NormalizedSearchCondition"
        warnings:
          type: array
          items: { $ref: "#/components/schemas/InterpretationWarning" }
        ruleVersion:
          type: string
          minLength: 1
        vocabularyVersion:
          type: string
          minLength: 1
        rankingRuleVersion:
          type: [string, "null"]
          description: recommendation,desc일 때 history-v1, 다른 정렬에서는 null
        nextCursor:
          type: [string, "null"]
          maxLength: 1024
    StoreDetail:
      type: object
      additionalProperties: false
      required:
        - storeId
        - name
        - description
        - region
        - address
        - timeZoneId
        - storeCategoryCode
        - tags
        - operationStatus
        - modes
        - operatingHours
        - reservationTimeSlots
        - representativeMenus
        - reservationAvailability
      properties:
        storeId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        region:
          $ref: "#/components/schemas/Region"
        address:
          type: string
          minLength: 1
          maxLength: 300
        timeZoneId:
          $ref: "#/components/schemas/TimeZoneId"
        storeCategoryCode:
          $ref: "#/components/schemas/CatalogCode"
        tags:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CatalogCode"
        operationStatus:
          $ref: "#/components/schemas/OperationStatus"
        modes:
          $ref: "#/components/schemas/StoreModes"
        operatingHours:
          type: array
          items:
            $ref: "#/components/schemas/DailySchedule"
        reservationTimeSlots:
          type: array
          items:
            $ref: "#/components/schemas/DailyTimeSlots"
        representativeMenus:
          type: array
          items:
            $ref: "#/components/schemas/PublicMenu"
        reservationAvailability:
          $ref: "#/components/schemas/ReservationAvailability"
    ManagedStore:
      type: object
      additionalProperties: false
      required:
        - storeId
        - name
        - region
        - address
        - timeZoneId
        - storeCategoryCode
        - verificationStatus
        - operationStatus
        - modes
        - geocoding
      properties:
        storeId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        name:
          type: string
          minLength: 1
          maxLength: 100
        region:
          $ref: "#/components/schemas/Region"
        address:
          type: string
          minLength: 1
          maxLength: 300
        timeZoneId:
          $ref: "#/components/schemas/TimeZoneId"
        storeCategoryCode:
          $ref: "#/components/schemas/CatalogCode"
        verificationStatus:
          $ref: "#/components/schemas/VerificationStatus"
        operationStatus:
          $ref: "#/components/schemas/OperationStatus"
        modes:
          $ref: "#/components/schemas/StoreModes"
        geocoding:
          $ref: "#/components/schemas/StoreGeocoding"
    StoreGeocoding:
      type: object
      description: 현재 매장 주소 버전의 좌표 검증 상태. 외부 제공자 메타데이터는 공개하지 않는다.
      additionalProperties: false
      required:
        - status
        - latitude
        - longitude
        - verifiedAddress
        - verifiedAt
        - addressVersion
      properties:
        status:
          type: string
          enum: [UNVERIFIED, VERIFIED]
        latitude:
          type: [number, "null"]
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: [number, "null"]
          format: double
          minimum: -180
          maximum: 180
        verifiedAddress:
          type: [string, "null"]
          maxLength: 300
        verifiedAt:
          type: [string, "null"]
          format: date-time
        addressVersion:
          type: integer
          format: int64
          minimum: 1
    PublicMenu:
      type: object
      additionalProperties: false
      required:
        - menuId
        - name
        - description
        - imageUrl
        - price
        - representative
        - primaryCategoryCode
        - secondaryCategoryCodes
        - localTags
        - holdEnabled
        - pickupEnabled
        - saleStatus
      properties:
        menuId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        imageUrl:
          type: [string, "null"]
          description: 완료된 공개 메뉴 대표 이미지가 없으면 null인 공개 조회 URL
        price:
          type: integer
          format: int64
          minimum: 0
        representative:
          type: boolean
        primaryCategoryCode:
          $ref: "#/components/schemas/CatalogCode"
        secondaryCategoryCodes:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CatalogCode"
        localTags:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 30
        holdEnabled:
          type: boolean
        pickupEnabled:
          type: boolean
        saleStatus:
          type: string
          enum: [SELLING, SOLD_OUT, PAUSED]
    RepresentativeMenuSettingStatus:
      type: string
      enum: [UNCONFIGURED, CONFIGURED, REQUIRES_ATTENTION]
    RepresentativeMenuReplaceRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, menuIds]
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        menuIds:
          type: array
          minItems: 3
          maxItems: 5
          uniqueItems: true
          items:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
    RepresentativeMenuItem:
      type: object
      additionalProperties: false
      required:
        - menuId
        - displayOrder
        - publishedVersionNumber
        - name
        - price
        - sellingStatus
      properties:
        menuId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        displayOrder:
          type: integer
          minimum: 1
          maximum: 5
        publishedVersionNumber:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        price:
          type: integer
          format: int64
          minimum: 0
        sellingStatus:
          type: string
          enum: [SELLING, SOLD_OUT]
    RepresentativeMenuSetting:
      type: object
      additionalProperties: false
      required: [version, status, items]
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
        status:
          $ref: "#/components/schemas/RepresentativeMenuSettingStatus"
        items:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/RepresentativeMenuItem"
    RepresentativeMenuSettingSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/RepresentativeMenuSetting"
    ManagedMenu:
      type: object
      additionalProperties: false
      required: [menuId, storeId, visibility, sellingStatus, retired]
      properties:
        menuId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        storeId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        visibility:
          type: string
          enum: [VISIBLE, HIDDEN]
        sellingStatus:
          type: string
          enum: [SELLING, SOLD_OUT, PAUSED]
          description: 판매 중, 일시 품절, 운영자 판매 중지를 구분한다.
        retired:
          type: boolean
        draft:
          oneOf:
            - $ref: "#/components/schemas/MenuVersion"
            - type: "null"
        scheduled:
          oneOf:
            - $ref: "#/components/schemas/MenuVersion"
            - type: "null"
        published:
          oneOf:
            - $ref: "#/components/schemas/MenuVersion"
            - type: "null"
    MenuVersion:
      type: object
      additionalProperties: false
      required:
        - versionNumber
        - status
        - name
        - description
        - price
        - representative
        - primaryCategoryCode
        - secondaryCategoryCodes
        - localTags
        - holdSelectionAllowed
        - pickupSelectionAllowed
        - allergenInformationStatus
        - allergenDisclosures
        - originInformationStatus
        - originDisclosures
        - alcoholic
      properties:
        versionNumber:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [DRAFT, SCHEDULED, PUBLISHED, RETIRED]
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        price:
          type: integer
          minimum: 0
          maximum: 2000000000
        representative:
          type: boolean
        primaryCategoryCode:
          $ref: "#/components/schemas/CatalogCode"
        secondaryCategoryCodes:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CatalogCode"
        localTags:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 30
        holdSelectionAllowed:
          type: boolean
        pickupSelectionAllowed:
          type: boolean
        allergenInformationStatus:
          $ref: "#/components/schemas/DisclosureRegistrationStatus"
        allergenDisclosures:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/AllergenDisclosure"
        originInformationStatus:
          $ref: "#/components/schemas/DisclosureRegistrationStatus"
        originDisclosures:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/OriginDisclosure"
        alcoholic:
          type: boolean
        effectiveAt:
          type: [string, "null"]
          format: date-time
    DisclosureRegistrationStatus:
      type: string
      enum: [REGISTERED, NOT_REGISTERED, NOT_APPLICABLE]
      description: 알레르기는 REGISTERED와 초안의 NOT_REGISTERED만 허용하며 REGISTERED 게시에는 최소 1개 항목이 필요하다. NOT_APPLICABLE은 원산지에만 사용한다.
    AllergenDisclosure:
      type: object
      additionalProperties: false
      required: [ingredientCode, status]
      properties:
        ingredientCode:
          type: string
          enum:
            - EGG
            - MILK
            - BUCKWHEAT
            - PEANUT
            - SOYBEAN
            - WHEAT
            - MACKEREL
            - CRAB
            - SHRIMP
            - PORK
            - PEACH
            - TOMATO
            - SULFITES
            - WALNUT
            - CHICKEN
            - BEEF
            - SQUID
            - SHELLFISH
            - PINE_NUT
        status:
          type: string
          enum: [CONTAINS, MAY_CONTAIN]
    OriginDisclosure:
      type: object
      additionalProperties: false
      required: [ingredient, origin]
      properties:
        ingredient:
          type: string
          minLength: 1
          maxLength: 100
        origin:
          type: string
          minLength: 1
          maxLength: 200
    CatalogItem:
      type: object
      additionalProperties: false
      required: [code, displayName]
      properties:
        code:
          $ref: "#/components/schemas/CatalogCode"
        displayName:
          type: string
          minLength: 1
          maxLength: 100
    CatalogListData:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogItem"
    TimeRange:
      type: object
      additionalProperties: false
      required: [startTime, endTime]
      properties:
        startTime:
          $ref: "#/components/schemas/StoreScheduleLocalTime"
        endTime:
          $ref: "#/components/schemas/StoreScheduleLocalTime"
    StoreScheduleLocalTime:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: 영업·예약 일정의 매장 timeZoneId를 기준으로 해석하는 분 단위 현지 시각
      examples: ["09:00"]
    DailySchedule:
      type: object
      additionalProperties: false
      required: [dayOfWeek, businessHours, breakTimes]
      properties:
        dayOfWeek:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
        businessHours:
          type: array
          maxItems: 48
          items:
            $ref: "#/components/schemas/TimeRange"
        breakTimes:
          type: array
          maxItems: 48
          items:
            $ref: "#/components/schemas/TimeRange"
    DailyTimeSlots:
      type: object
      additionalProperties: false
      required: [dayOfWeek, slots]
      properties:
        dayOfWeek:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
        slots:
          type: array
          maxItems: 48
          items:
            $ref: "#/components/schemas/TimeRange"
    StoreCreateRequest:
      type: object
      description: 1차 MVP는 사업자등록번호 형식과 전체 매장 이력에 대한 영구 유일성을 검증하고 플랫폼 운영자 심사 없이 즉시 등록한다. 폐점한 매장의 번호도 재사용할 수 없다. 모든 등록 업종은 modes.pickupEnabled를 선택할 수 있다.
      additionalProperties: false
      required:
        - businessRegistrationNumber
        - businessType
        - name
        - description
        - region
        - address
        - timeZoneId
        - storeCategoryCode
        - tagCodes
        - modes
        - applicantSelfAttested
        - requiredTermsAgreed
      properties:
        businessRegistrationNumber:
          type: string
          pattern: "^[0-9]{10}$"
        businessType:
          $ref: "#/components/schemas/BusinessType"
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        region:
          $ref: "#/components/schemas/Region"
        address:
          type: string
          minLength: 1
          maxLength: 300
        timeZoneId:
          $ref: "#/components/schemas/TimeZoneId"
        storeCategoryCode:
          $ref: "#/components/schemas/CatalogCode"
        tagCodes:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CatalogCode"
        modes:
          $ref: "#/components/schemas/StoreModes"
        applicantSelfAttested:
          type: boolean
          const: true
          description: 신청자가 입력한 사업자 정보에 대한 책임을 자기확약한다.
        requiredTermsAgreed:
          type: boolean
          const: true
          description: 필수 입점 약관에 동의한다. 서버가 동의 시각과 STORE_ONBOARDING_REQUIRED_TERMS_V1 버전을 기록한다.
    StoreUpdateRequest:
      type: object
      description: 등록 업종과 무관하게 modes.pickupEnabled를 변경할 수 있다.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        region:
          $ref: "#/components/schemas/Region"
        address:
          type: string
          minLength: 1
          maxLength: 300
        storeCategoryCode:
          $ref: "#/components/schemas/CatalogCode"
        tagCodes:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CatalogCode"
        modes:
          $ref: "#/components/schemas/StoreModes"
        operationStatus:
          $ref: "#/components/schemas/EditableOperationStatus"
    WeeklyOperatingHoursRequest:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: "#/components/schemas/DailySchedule"
    WeeklyReservationTimeSlotsRequest:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: "#/components/schemas/DailyTimeSlots"
    TimeZoneId:
      type: string
      minLength: 1
      maxLength: 64
      description: IANA Time Zone Database 식별자. 주소나 서버 기본 시간대로 추측하지 않는다.
      examples: [Asia/Seoul]
    ScheduleVersionStatus:
      type: string
      enum: [DRAFT, SCHEDULED, ACTIVE, RETIRED, ACTIVATION_FAILED]
    ConflictCheckStatus:
      type: string
      enum: [NOT_EVALUATED, EVALUATED]
    SchedulePublicationRequest:
      type: object
      additionalProperties: false
      required: [publicationMode, changeReason]
      properties:
        publicationMode:
          type: string
          enum: [IMMEDIATE, SCHEDULED]
        effectiveAt:
          type: string
          format: date-time
          description: SCHEDULED에서만 허용하는 미래 RFC 3339 date-time. 오프셋을 반드시 포함한다.
        changeReason:
          type: string
          minLength: 1
          maxLength: 500
      allOf:
        - if:
            properties:
              publicationMode:
                const: SCHEDULED
          then:
            properties:
              effectiveAt: {}
            required: [effectiveAt]
        - if:
            properties:
              publicationMode:
                const: IMMEDIATE
          then:
            not:
              properties:
                effectiveAt: {}
              required: [effectiveAt]
    SchedulePublicationCancellationRequest:
      type: object
      additionalProperties: false
      required: [changeReason]
      properties:
        changeReason:
          type: string
          minLength: 1
          maxLength: 500
    RegularClosureDraftRequest:
      type: object
      additionalProperties: false
      required: [weeklyDays, dates]
      properties:
        weeklyDays:
          type: array
          maxItems: 7
          uniqueItems: true
          items: { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
        dates:
          type: array
          maxItems: 366
          uniqueItems: true
          items: { type: string, format: date }
    TemporaryClosureCreateRequest:
      type: object
      additionalProperties: false
      required: [startAt, endAt, reason]
      properties:
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        reason: { type: string, enum: [MAINTENANCE, STAFFING, PRIVATE_EVENT, OTHER] }
        publicMessage: { type: string, maxLength: 200 }
    TemporaryClosureEndAtRequest:
      type: object
      additionalProperties: false
      required: [endAt, changeReason]
      properties:
        endAt: { type: string, format: date-time }
        changeReason: { type: string, minLength: 1, maxLength: 500 }
    TemporaryClosureCancellationRequest:
      type: object
      additionalProperties: false
      required: [changeReason]
      properties:
        changeReason: { type: string, minLength: 1, maxLength: 500 }
    RegularClosureData:
      type: object
      additionalProperties: false
      required: [version, status, timeZoneId, weeklyDays, dates]
      properties:
        version: { type: integer, format: int64, minimum: 1 }
        status: { $ref: "#/components/schemas/ScheduleVersionStatus" }
        timeZoneId: { $ref: "#/components/schemas/TimeZoneId" }
        effectiveAt: { type: [string, "null"], format: date-time }
        changeReason: { type: [string, "null"], maxLength: 500 }
        weeklyDays:
          type: array
          uniqueItems: true
          items: { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
        dates:
          type: array
          uniqueItems: true
          items: { type: string, format: date }
    TemporaryClosureData:
      type: object
      additionalProperties: false
      required: [closureId, storeId, startAt, endAt, timeZoneId, reason, status, changeVersion]
      properties:
        closureId: { type: integer, format: int64, minimum: 1 }
        storeId: { type: integer, format: int64, minimum: 1 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        timeZoneId: { $ref: "#/components/schemas/TimeZoneId" }
        reason: { type: string, enum: [MAINTENANCE, STAFFING, PRIVATE_EVENT, OTHER] }
        publicMessage: { type: [string, "null"], maxLength: 200 }
        status: { type: string, enum: [SCHEDULED, ACTIVE, ENDED, CANCELLED] }
        changeVersion: { type: integer, format: int64, minimum: 1 }
    RegularClosureSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code: { $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode" }
        message: { $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage" }
        data: { $ref: "#/components/schemas/RegularClosureData" }
    TemporaryClosureSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code: { $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode" }
        message: { $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage" }
        data: { $ref: "#/components/schemas/TemporaryClosureData" }
    MenuWriteRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - description
        - price
        - representative
        - primaryCategoryCode
        - secondaryCategoryCodes
        - localTags
        - holdSelectionAllowed
        - pickupSelectionAllowed
        - allergenInformationStatus
        - allergenDisclosures
        - originInformationStatus
        - originDisclosures
        - alcoholic
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        price:
          type: integer
          minimum: 0
          maximum: 2000000000
        representative:
          type: boolean
        primaryCategoryCode:
          $ref: "#/components/schemas/CatalogCode"
        secondaryCategoryCodes:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CatalogCode"
        localTags:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 30
        holdSelectionAllowed:
          type: boolean
        pickupSelectionAllowed:
          type: boolean
        allergenInformationStatus:
          $ref: "#/components/schemas/DisclosureRegistrationStatus"
        allergenDisclosures:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/AllergenDisclosure"
        originInformationStatus:
          $ref: "#/components/schemas/DisclosureRegistrationStatus"
        originDisclosures:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/OriginDisclosure"
        alcoholic:
          type: boolean
      allOf:
        - if:
            properties:
              allergenInformationStatus:
                const: REGISTERED
          then:
            properties:
              allergenDisclosures:
                minItems: 1
    PublicImage:
      type: object
      additionalProperties: false
      required: [imageId, url]
      properties:
        imageId:
