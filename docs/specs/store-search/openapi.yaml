openapi: 3.1.0
info:
  title: MiriYum MVP1 Store and Search API
  version: 1.1.0
  description: 공개 매장 탐색과 매장 운영자 기본 관리 계약
  license:
    name: All rights reserved
    identifier: LicenseRef-All-Rights-Reserved
servers:
  - url: /
    description: 배포 환경의 동일 origin
security: []
tags:
  - name: Store Search
    description: 공개 매장·메뉴 탐색
  - name: Catalog
    description: 검색·입력 허용 코드
  - name: Store Management
    description: 매장 운영자 기본 관리
paths:
  /api/v1/stores:
    get:
      tags: [Store Search]
      summary: 매장 목록 검색
      operationId: searchStores
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
            pattern: '.*\S.*'
            description: 공백이 아닌 문자를 하나 이상 포함해야 한다.
        - name: region
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Region"
        - name: storeCategoryCode
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CatalogCode"
        - name: serviceDate
          in: query
          required: false
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalDate"
        - name: startTime
          in: query
          required: false
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalTime"
        - name: partySize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: includesInfants
          in: query
          required: false
          description: 영유아가 한 명 이상 포함되는지 여부. 생략하면 false다.
          schema:
            type: boolean
            default: false
        - name: availableOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/Page"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/Size"
        - name: sort
          in: query
          description: 매장 목록 정렬. 아래 허용값 외에는 400을 반환한다.
          schema:
            type: string
            enum:
              - "name,asc"
              - "name,desc"
              - "createdAt,desc"
              - "createdAt,asc"
            default: "name,asc"
      responses:
        "200":
          description: 매장 검색 결과 페이지
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorePageSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
  /api/v1/stores/{storeId}:
    get:
      tags: [Store Search]
      summary: 매장 상세 조회
      operationId: getStore
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - name: serviceDate
          in: query
          required: false
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalDate"
        - name: startTime
          in: query
          required: false
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalTime"
        - name: partySize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: includesInfants
          in: query
          required: false
          description: 영유아가 한 명 이상 포함되는지 여부. 생략하면 false다.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 매장 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreDetailSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/StoreNotFound"
  /api/v1/stores/{storeId}/menus:
    get:
      tags: [Store Search]
      summary: 매장 공개 메뉴 조회
      operationId: getStoreMenus
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: 공개 메뉴 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuListSuccessResponse"
        "404":
          $ref: "#/components/responses/StoreNotFound"
  /api/v1/store-categories:
    get:
      tags: [Catalog]
      summary: 매장 카테고리 조회
      operationId: getStoreCategories
      responses:
        "200":
          description: 매장 주 카테고리 catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogListSuccessResponse"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/menu-categories:
    get:
      tags: [Catalog]
      summary: 메뉴 카테고리 조회
      operationId: getMenuCategories
      responses:
        "200":
          description: 메뉴 카테고리 catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogListSuccessResponse"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/store-tags:
    get:
      tags: [Catalog]
      summary: 매장 태그 조회
      operationId: getStoreTags
      responses:
        "200":
          description: 매장 태그 catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogListSuccessResponse"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/store-operator/stores:
    post:
      tags: [Store Management]
      summary: 매장 등록
      operationId: createStore
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreCreateRequest"
      responses:
        "201":
          description: 매장 신청 생성
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedStoreSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/StoreConflict"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/store-operator/stores/{storeId}:
    get:
      tags: [Store Management]
      summary: 운영 매장 정보 조회
      operationId: getManagedStore
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: 운영 매장 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedStoreSuccessResponse"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreNotFound"
    patch:
      tags: [Store Management]
      summary: 매장 기본정보 수정
      operationId: updateStore
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreUpdateRequest"
      responses:
        "200":
          description: 수정된 매장 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedStoreSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreNotFound"
        "409":
          $ref: "#/components/responses/StoreStateConflict"
  /api/v1/store-operator/stores/{storeId}/operating-hours:
    put:
      tags: [Store Management]
      summary: 주간 영업시간 전체 초안 저장
      operationId: createOperatingHoursDraft
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeeklyOperatingHoursRequest"
      responses:
        "200":
          description: 저장된 영업시간 초안
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatingHoursSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreNotFound"
        "409":
          $ref: "#/components/responses/SchedulePublicationConflict"
  /api/v1/store-operator/stores/{storeId}/operating-hours/{version}/publication:
    post:
      tags: [Store Management]
      summary: 영업시간 초안 즉시 또는 예약 게시
      operationId: publishOperatingHoursDraft
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/ScheduleVersion"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePublicationRequest"
      responses:
        "200":
          description: 즉시 게시되거나 예약된 영업시간 버전
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatingHoursSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreNotFound"
        "409":
          $ref: "#/components/responses/SchedulePublicationConflict"
  /api/v1/store-operator/stores/{storeId}/operating-hours/{version}/publication-cancellation:
    post:
      tags: [Store Management]
      summary: 영업시간 예약 게시 취소
      operationId: cancelOperatingHoursPublication
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/ScheduleVersion"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePublicationCancellationRequest"
      responses:
        "200":
          description: 예약이 취소되어 초안으로 돌아간 영업시간 버전
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatingHoursSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreNotFound"
        "409":
          $ref: "#/components/responses/SchedulePublicationConflict"
  /api/v1/store-operator/stores/{storeId}/reservation-time-slots:
    put:
      tags: [Store Management]
      summary: 주간 예약 접수 시간대 전체 초안 저장
      operationId: createReservationTimeSlotsDraft
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeeklyReservationTimeSlotsRequest"
      responses:
        "200":
          description: 저장된 예약 접수 시간대 초안
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationTimeSlotsSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreNotFound"
        "409":
          $ref: "#/components/responses/SchedulePublicationConflict"
  /api/v1/store-operator/stores/{storeId}/reservation-time-slots/{version}/publication:
    post:
      tags: [Store Management]
      summary: 예약 접수 시간대 초안 즉시 또는 예약 게시
      operationId: publishReservationTimeSlotsDraft
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/ScheduleVersion"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePublicationRequest"
      responses:
        "200":
          description: 즉시 게시되거나 예약된 예약 접수 시간대 버전
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationTimeSlotsSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreNotFound"
        "409":
          $ref: "#/components/responses/SchedulePublicationConflict"
  /api/v1/store-operator/stores/{storeId}/reservation-time-slots/{version}/publication-cancellation:
    post:
      tags: [Store Management]
      summary: 예약 접수 시간대 예약 게시 취소
      operationId: cancelReservationTimeSlotsPublication
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/ScheduleVersion"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePublicationCancellationRequest"
      responses:
        "200":
          description: 예약이 취소되어 초안으로 돌아간 예약 접수 시간대 버전
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationTimeSlotsSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreNotFound"
        "409":
          $ref: "#/components/responses/SchedulePublicationConflict"
  /api/v1/store-operator/stores/{storeId}/regular-closures:
    put:
      tags: [Store Management]
      summary: 정기 휴무 전체 초안 저장
      operationId: createRegularClosureDraft
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegularClosureDraftRequest" }
      responses:
        "200":
          description: 저장된 정기 휴무 초안
          content: { application/json: { schema: { $ref: "#/components/schemas/RegularClosureSuccessResponse" } } }
        "400": { $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/StoreAccessDenied" }
        "404": { $ref: "#/components/responses/StoreNotFound" }
        "409": { $ref: "#/components/responses/SchedulePublicationConflict" }
  /api/v1/store-operator/stores/{storeId}/regular-closures/{version}/publication:
    post:
      tags: [Store Management]
      summary: 정기 휴무 초안 즉시 또는 예약 게시
      operationId: publishRegularClosureDraft
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/ScheduleVersion"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SchedulePublicationRequest" } } }
      responses:
        "200":
          description: 게시 처리된 정기 휴무 버전
          content: { application/json: { schema: { $ref: "#/components/schemas/RegularClosureSuccessResponse" } } }
        "400": { $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/StoreAccessDenied" }
        "404": { $ref: "#/components/responses/StoreNotFound" }
        "409": { $ref: "#/components/responses/SchedulePublicationConflict" }
  /api/v1/store-operator/stores/{storeId}/regular-closures/{version}/publication-cancellation:
    post:
      tags: [Store Management]
      summary: 정기 휴무 예약 게시 취소
      operationId: cancelRegularClosurePublication
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/ScheduleVersion"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SchedulePublicationCancellationRequest" } } }
      responses:
        "200":
          description: 초안으로 돌아간 정기 휴무 버전
          content: { application/json: { schema: { $ref: "#/components/schemas/RegularClosureSuccessResponse" } } }
        "400": { $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/StoreAccessDenied" }
        "404": { $ref: "#/components/responses/StoreNotFound" }
        "409": { $ref: "#/components/responses/SchedulePublicationConflict" }
  /api/v1/store-operator/stores/{storeId}/temporary-closures:
    post:
      tags: [Store Management]
      summary: 임시 휴무 등록
      operationId: createTemporaryClosure
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TemporaryClosureCreateRequest" } } }
      responses:
        "200":
          description: 등록된 임시 휴무
          content: { application/json: { schema: { $ref: "#/components/schemas/TemporaryClosureSuccessResponse" } } }
        "400": { $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/StoreAccessDenied" }
        "404": { $ref: "#/components/responses/StoreNotFound" }
        "409": { $ref: "#/components/responses/SchedulePublicationConflict" }
  /api/v1/store-operator/stores/{storeId}/temporary-closures/{closureId}/end-at:
    put:
      tags: [Store Management]
      summary: 임시 휴무 종료 시각 변경
      operationId: changeTemporaryClosureEndAt
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - { name: closureId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TemporaryClosureEndAtRequest" } } }
      responses:
        "200":
          description: 변경된 임시 휴무
          content: { application/json: { schema: { $ref: "#/components/schemas/TemporaryClosureSuccessResponse" } } }
        "400": { $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/StoreAccessDenied" }
        "404": { $ref: "#/components/responses/StoreNotFound" }
        "409": { $ref: "#/components/responses/SchedulePublicationConflict" }
  /api/v1/store-operator/stores/{storeId}/temporary-closures/{closureId}/cancellation:
    post:
      tags: [Store Management]
      summary: 임시 휴무 취소
      operationId: cancelTemporaryClosure
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - { name: closureId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TemporaryClosureCancellationRequest" } } }
      responses:
        "200":
          description: 취소된 임시 휴무
          content: { application/json: { schema: { $ref: "#/components/schemas/TemporaryClosureSuccessResponse" } } }
        "400": { $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/StoreAccessDenied" }
        "404": { $ref: "#/components/responses/StoreNotFound" }
        "409": { $ref: "#/components/responses/SchedulePublicationConflict" }
  /api/v1/store-operator/stores/{storeId}/menus:
    get:
