        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreNotFound"
        "409":
          $ref: "#/components/responses/MenuStateConflict"
  /api/v1/store-operator/stores/{storeId}/menus/{menuId}:
    get:
      tags: [Store Management]
