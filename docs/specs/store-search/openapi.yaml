openapi: 3.1.0
info:
  title: MiriYum Store and Search API
  version: 1.2.0
  description: 1차 페이지 검색, 2차 통합 검색과 매장 운영자 기본 관리 계약
  license:
    name: All rights reserved
    identifier: LicenseRef-All-Rights-Reserved
servers:
  - url: /
    description: 배포 환경의 동일 origin
security: []
tags:
  - name: Store Search
    description: 공개 매장·메뉴 탐색
  - name: Catalog
    description: 검색·입력 허용 코드
  - name: Store Management
    description: 매장 운영자 기본 관리
paths:
  /api/v1/stores:
    get:
      tags: [Store Search]
      summary: 매장 목록 검색
      operationId: searchStores
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: searchInput
          in: query
          required: false
          description: >-
            2차 MVP 통합 검색 원문. 있으면 cursor 응답 모드를 사용하며 keyword, region,
            storeCategoryCode, serviceDate, startTime, partySize, page와 혼용할 수 없다.
            원문 안의 날짜·시각·인원은 독립적으로 해석하며 날짜가 있을 때만 예약
            가용성을 판정한다. 최초 정확 검색 결과가 부족하면 LLM이 제한된 음식 개념만
            해석하고 현재 MySQL 메뉴에서 보완 후보를 다시 조회한다.
          schema:
            type: string
            minLength: 1
            maxLength: 100
            pattern: '.*\S.*'
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
            pattern: '.*\S.*'
            description: 공백이 아닌 문자를 하나 이상 포함해야 한다.
        - name: region
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Region"
        - name: storeCategoryCode
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CatalogCode"
        - name: serviceDate
          in: query
          required: false
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalDate"
        - name: startTime
          in: query
          required: false
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalTime"
        - name: partySize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: includesInfants
          in: query
          required: false
          description: 영유아가 한 명 이상 포함되는지 여부. 생략하면 false다.
          schema:
            type: boolean
            default: false
        - name: availableOnly
          in: query
          required: false
          description: >-
            true이면 선택한 고정 정렬에서 먼저 매칭되는 공개 후보 최대 5,000개의
            예약 가용성을 평가하고 AVAILABLE인 매장만 반환한다. 통합 검색에서는
            해석된 날짜가 있어야 하며 시각·인원은 선택 조건이다.
          schema:
            type: boolean
            default: false
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/Page"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/Size"
        - name: cursor
          in: query
          required: false
          description: 통합 검색에서 서버가 발급하고 HMAC 인증한 조건·정렬·크기 결합 불투명 cursor. 변조되었거나 서버 비밀키 회전 전에 발급된 값은 COMMON_001로 거부한다.
          schema:
            type: string
            minLength: 1
            maxLength: 1024
        - name: sort
          in: query
          description: 매장 목록 정렬. 아래 허용값 외에는 400을 반환한다.
          schema:
            type: string
            enum:
              - "name,asc"
              - "name,desc"
              - "createdAt,desc"
              - "createdAt,asc"
              - "relevance,desc"
              - "recommendation,desc"
      responses:
        "200":
          description: >-
            매장 검색 결과 페이지. availableOnly=true일 때 totalElements는
            고정 정렬의 공개 후보 최대 5,000개 안에서 AVAILABLE로 판정된 정확한 수다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSearchSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/stores/{storeId}:
    get:
      tags: [Store Search]
      summary: 매장 상세 조회
      operationId: getStore
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - name: serviceDate
          in: query
          required: false
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalDate"
        - name: startTime
          in: query
          required: false
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalTime"
        - name: partySize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: includesInfants
          in: query
          required: false
          description: 영유아가 한 명 이상 포함되는지 여부. 생략하면 false다.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 매장 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreDetailSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/StoreNotFound"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/stores/{storeId}/menus:
    get:
      tags: [Store Search]
      summary: 매장 공개 메뉴 조회
      operationId: getStoreMenus
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: 공개 메뉴 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuListSuccessResponse"
        "404":
          $ref: "#/components/responses/StoreNotFound"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/stores/{storeId}/menus/{menuId}/alternative-searches:
    post:
      tags: [Store Search]
      summary: 품절 메뉴 대안 검색
      operationId: searchMenuAlternatives
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/MenuId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuAlternativeSearchRequest"
      responses:
        "200":
          description: >-
            같은 매장 우선 메뉴 대안 검색 결과. LLM 음식 개념 후보를 기존 일반 후보보다
            먼저 검증하되 판매·재고·알레르기·가격·거리·예약 규칙은 서버의 현재 데이터가 결정한다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuAlternativeSearchSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/MenuNotFound"
        "409":
          $ref: "#/components/responses/MenuAlternativeReservationConflict"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/store-categories:
    get:
      tags: [Catalog]
      summary: 매장 카테고리 조회
      operationId: getStoreCategories
      responses:
        "200":
          description: 매장 주 카테고리 catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogListSuccessResponse"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/menu-categories:
    get:
      tags: [Catalog]
      summary: 메뉴 카테고리 조회
      operationId: getMenuCategories
      responses:
        "200":
          description: 메뉴 카테고리 catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogListSuccessResponse"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/store-tags:
    get:
      tags: [Catalog]
      summary: 매장 태그 조회
      operationId: getStoreTags
      responses:
        "200":
          description: 매장 태그 catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogListSuccessResponse"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/public-files/{imageId}:
    get:
      tags: [Store Public Image]
      summary: 공개 이미지 원본 조회
      description: >-
        CONFIRMED 상태의 PUBLIC 이미지만 반환한다. S3 객체 키·버킷 URL·체크섬·원본 파일명은 응답에 포함하지 않는다.
      operationId: getPublicImageFile
      parameters:
        - $ref: "#/components/parameters/ImageId"
      responses:
        "200":
          description: 공개 이미지 바이트
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/PublicImageNotFound"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/store-operators/stores:
    post:
      tags: [Store Management]
      summary: 매장 등록
      operationId: createStore
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreCreateRequest"
      responses:
        "201":
          description: 매장 신청 생성
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedStoreSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/StoreConflict"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/store-operators/stores/{storeId}/images:
    get:
      tags: [Store Public Image]
      summary: 매장 공개 이미지 목록 조회
      operationId: listManagedStoreImages
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: 매장 공개 이미지 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicImageListSuccessResponse"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreNotFound"
    post:
      tags: [Store Public Image]
      summary: 매장 공개 이미지 추가
      description: JPEG, PNG, WebP 파일만 허용하며 매장당 최대 10장까지 유지한다.
      operationId: uploadStoreImage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: 저장·검증을 완료한 공개 이미지
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicImageSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreNotFound"
        "409":
          $ref: "#/components/responses/StorePublicImageConflict"
        "413":
          $ref: "#/components/responses/ImageSizeExceeded"
        "415":
          $ref: "#/components/responses/UnsupportedImageMediaType"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/store-operators/stores/{storeId}/images/{imageId}:
    put:
      tags: [Store Public Image]
      summary: 매장 공개 이미지 교체
      description: 새 파일의 저장·검증이 끝나기 전까지 기존 공개 이미지를 유지한다.
      operationId: replaceStoreImage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/ImageId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: 교체된 공개 이미지
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicImageSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreImageTargetNotFound"
        "409":
          $ref: "#/components/responses/StorePublicImageConflict"
        "413":
          $ref: "#/components/responses/ImageSizeExceeded"
        "415":
          $ref: "#/components/responses/UnsupportedImageMediaType"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
    delete:
      tags: [Store Public Image]
      summary: 매장 공개 이미지 삭제
      operationId: deleteStoreImage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/ImageId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: 삭제 완료 또는 이미 삭제된 이미지
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreNotFound"
        "409":
          $ref: "#/components/responses/StorePublicImageConflict"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/store-operators/stores/{storeId}:
    get:
      tags: [Store Management]
      summary: 운영 매장 정보 조회
      operationId: getManagedStore
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: 운영 매장 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedStoreSuccessResponse"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreNotFound"
    patch:
      tags: [Store Management]
      summary: 매장 기본정보 수정
      operationId: updateStore
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreUpdateRequest"
      responses:
        "200":
          description: 수정된 매장 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedStoreSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreNotFound"
        "409":
          $ref: "#/components/responses/StoreStateConflict"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/store-operators/stores/{storeId}/operating-hours:
    put:
      tags: [Store Management]
      summary: 주간 영업시간 전체 초안 저장
      operationId: createOperatingHoursDraft
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeeklyOperatingHoursRequest"
      responses:
        "200":
          description: 저장된 영업시간 초안
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatingHoursSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreNotFound"
        "409":
          $ref: "#/components/responses/SchedulePublicationConflict"
  /api/v1/store-operators/stores/{storeId}/operating-hours/{version}/publications:
    post:
      tags: [Store Management]
      summary: 영업시간 초안 즉시 또는 예약 게시
      operationId: publishOperatingHoursDraft
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/ScheduleVersion"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePublicationRequest"
      responses:
        "200":
          description: 즉시 게시되거나 예약된 영업시간 버전
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatingHoursSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreNotFound"
        "409":
          $ref: "#/components/responses/SchedulePublicationConflict"
  /api/v1/store-operators/stores/{storeId}/operating-hours/{version}/publication-cancellations:
    post:
      tags: [Store Management]
      summary: 영업시간 예약 게시 취소
      operationId: cancelOperatingHoursPublication
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/ScheduleVersion"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePublicationCancellationRequest"
      responses:
        "200":
          description: 예약이 취소되어 초안으로 돌아간 영업시간 버전
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatingHoursSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StoreAccessDenied"
        "404":
          $ref: "#/components/responses/StoreNotFound"
        "409":
          $ref: "#/components/responses/SchedulePublicationConflict"
  /api/v1/store-operators/stores/{storeId}/reservation-time-slots:
    put:
      tags: [Store Management]
      summary: 주간 예약 접수 시간대 전체 초안 저장
      operationId: createReservationTimeSlotsDraft
      security:
        - bearerAuth: []
      parameters:
