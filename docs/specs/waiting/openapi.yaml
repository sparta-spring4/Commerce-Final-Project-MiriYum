openapi: 3.1.0
info:
  title: MiriYum Waiting API
  version: 1.0.0
  description: 매장 운영자의 웨이팅 기능 설정과 비활성화 영향 조회 계약
  license:
    name: All Rights Reserved
    identifier: LicenseRef-All-Rights-Reserved
servers:
  - url: /
security: []
tags:
  - name: Waiting Settings
    description: Reservation 도메인이 소유하는 매장별 웨이팅 운영 설정
paths:
  /api/v1/store-operators/stores/{storeId}/waiting-settings:
    get:
      tags: [Waiting Settings]
      summary: 웨이팅 운영 설정 조회
      description: >-
        APPROVED 매장의 대표 운영자가 조회한다. OPEN, TEMPORARILY_CLOSED, CLOSED 운영 상태를
        모두 허용하며 입점 검증 상태를 APPROVED로 확인할 수 없으면 STORE_007로 거절한다.
      operationId: getWaitingSettings
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: 현재 웨이팅 운영 설정. 저장된 설정이 없으면 안전한 기본값을 반환한다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitingSettingSuccessResponse"
        "400":
          $ref: "#/components/responses/WaitingStoreIdBadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WaitingStoreForbidden"
        "404":
          $ref: "#/components/responses/WaitingStoreNotFound"
        "409":
          $ref: "#/components/responses/WaitingStoreStateConflict"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
    put:
      tags: [Waiting Settings]
      summary: 웨이팅 운영 설정 전체 교체
      description: >-
        APPROVED 매장의 대표 운영자가 OPEN 또는 TEMPORARILY_CLOSED 운영 상태에서만 교체한다.
        CLOSED는 STORE_005, APPROVED로 확인할 수 없는 입점 검증 상태는 STORE_007로 거절한다.
      operationId: updateWaitingSettings
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitingSettingUpdateRequest"
      responses:
        "200":
          description: 새 버전으로 전체 교체된 웨이팅 운영 설정
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitingSettingSuccessResponse"
        "400":
          $ref: "#/components/responses/WaitingBadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WaitingStoreForbidden"
        "404":
          $ref: "#/components/responses/WaitingStoreNotFound"
        "409":
          $ref: "#/components/responses/WaitingSettingConflict"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/store-operators/stores/{storeId}/waiting-settings/disable-impact:
    get:
      tags: [Waiting Settings]
      summary: 웨이팅 기능 비활성화 영향 조회
      description: >-
        APPROVED 매장의 대표 운영자가 조회한다. OPEN, TEMPORARILY_CLOSED, CLOSED 운영 상태를
        모두 허용하며 입점 검증 상태를 APPROVED로 확인할 수 없으면 STORE_007로 거절한다.
      operationId: getWaitingDisableImpact
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: 현재 설정 버전과 활성 팀 영향
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitingDisableImpactSuccessResponse"
        "400":
          $ref: "#/components/responses/WaitingStoreIdBadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WaitingStoreForbidden"
        "404":
          $ref: "#/components/responses/WaitingStoreNotFound"
        "409":
          $ref: "#/components/responses/WaitingStoreStateConflict"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
components:
  securitySchemes:
    bearerAuth:
      $ref: "../mvp1-common/openapi.yaml#/components/securitySchemes/bearerAuth"
  parameters:
    StoreId:
      name: storeId
      in: path
      required: true
      description: 권한을 확인할 대상 매장의 공개 문자열 ID
      schema:
        $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
  schemas:
    WaitingReceptionMode:
      type: string
      enum: [AUTO, MANUAL, PAUSED]
      description: 자동 접수, 수동 접수 또는 신규 접수 일시중지
    WaitingDisableAction:
      type: string
      enum: [KEEP_ACTIVE]
      description: >-
        비활성화 시 기존 활성 팀을 유지하도록 요청하는 명시적 intent.
        enabled=false인 요청에서만 허용하며 활성 팀이 있으면 필수다.
    WaitingSetting:
      type: object
      additionalProperties: false
      required:
        - storeId
        - enabled
        - receptionMode
        - advanceOpenMinutes
        - version
      properties:
        storeId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        enabled:
          type: boolean
        receptionMode:
          $ref: "#/components/schemas/WaitingReceptionMode"
        advanceOpenMinutes:
          type: integer
          minimum: 0
          maximum: 180
          description: 자동 접수를 영업 시작보다 먼저 여는 시간(분)
        version:
          type: integer
          format: int64
          minimum: 0
          description: 설정이 없으면 0이며 성공한 새 교체마다 단조 증가한다.
      allOf:
        - if:
            properties:
              enabled:
                const: false
            required: [enabled]
          then:
            properties:
              receptionMode:
                const: PAUSED
    WaitingSettingUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - enabled
        - receptionMode
        - advanceOpenMinutes
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
          description: 마지막으로 조회한 현재 설정 버전
        enabled:
          type: boolean
        receptionMode:
          $ref: "#/components/schemas/WaitingReceptionMode"
        advanceOpenMinutes:
          type: integer
          minimum: 0
          maximum: 180
        disableAction:
          $ref: "#/components/schemas/WaitingDisableAction"
      allOf:
        - if:
            properties:
              enabled:
                const: false
            required: [enabled]
          then:
            properties:
              receptionMode:
                const: PAUSED
        - if:
            properties:
              disableAction: {}
            required: [disableAction]
          then:
            properties:
              enabled:
                const: false
    WaitingDisableImpact:
      type: object
      additionalProperties: false
      required:
        - storeId
        - version
        - activeTeamCount
        - canCloseActiveTeams
      properties:
        storeId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        version:
          type: integer
          format: int64
          minimum: 0
          description: 설정 조회·수정 응답과 같은 현재 설정 버전
        activeTeamCount:
          type: integer
          format: int64
          minimum: 0
        canCloseActiveTeams:
          type: boolean
          description: "Issue #272가 소유하는 활성 팀 종결 가능성 판정"
    WaitingSettingSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/WaitingSetting"
    WaitingDisableImpactSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/WaitingDisableImpact"
  responses:
    WaitingStoreIdBadRequest:
      description: storeId가 양의 정수 문자열 PublicId 형식이 아님
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: COMMON_001
            message: 입력값이 올바르지 않습니다.
            details:
              - field: storeId
                reason: 양의 정수 문자열이어야 합니다.
    WaitingBadRequest:
      description: storeId·본문 검증, JSON 역직렬화 또는 필수 멱등성 헤더가 올바르지 않음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          examples:
            invalidStoreId:
              value:
                code: COMMON_001
                message: 입력값이 올바르지 않습니다.
                details:
                  - field: storeId
                    reason: 양의 정수 문자열이어야 합니다.
            validationFailed:
              value:
                code: COMMON_001
                message: 입력값이 올바르지 않습니다.
                details:
                  - field: advanceOpenMinutes
                    reason: 0 이상 180 이하여야 합니다.
            malformedRequest:
              value:
                code: COMMON_002
                message: 요청 본문을 읽을 수 없습니다.
            idempotencyKeyRequired:
              value:
                code: COMMON_003
                message: Idempotency-Key 헤더가 필요합니다.
            invalidIdempotencyKey:
              value:
                code: COMMON_004
                message: Idempotency-Key 형식이 올바르지 않습니다.
    WaitingStoreForbidden:
      description: 현재 계정 상태가 제한됐거나 대상 매장의 현재 대표 운영자가 아님
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          examples:
            accountRestricted:
              value:
                code: AUTH_011
                message: 현재 계정 상태로 이용할 수 없습니다.
            storeAccessDenied:
              value:
                code: STORE_003
                message: 대상 매장의 운영 권한이 없습니다.
    WaitingStoreNotFound:
      description: 대상 매장이 실제로 존재하지 않음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: STORE_001
            message: 매장을 찾을 수 없습니다.
    WaitingStoreStateConflict:
      description: 조회 시 대상 매장의 입점 검증 상태를 APPROVED로 확인할 수 없음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: STORE_007
            message: 현재 입점 검증 상태에서 운영할 수 없습니다.
    WaitingSettingConflict:
      description: 설정 버전, 비활성화 action, Store 상태, 멱등성 또는 동시 요청 충돌
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          examples:
            staleVersion:
              value:
                code: WAITING_001
                message: 웨이팅 설정이 변경되었습니다. 최신 설정을 다시 확인해 주세요.
            disableActionRequired:
              value:
                code: WAITING_002
                message: 활성 대기 팀의 처리 방법을 선택해 주세요.
            idempotencyKeyReused:
              value:
                code: COMMON_007
                message: 동일한 Idempotency-Key를 다른 요청에 사용할 수 없습니다.
            concurrentModification:
              value:
                code: COMMON_008
                message: 동시 요청 충돌로 처리하지 못했습니다. 다시 시도해 주세요.
            invalidStoreState:
              value:
                code: STORE_005
                message: 현재 매장 상태에서 요청한 작업을 수행할 수 없습니다.
            invalidVerificationState:
              value:
                code: STORE_007
                message: 현재 입점 검증 상태에서 운영할 수 없습니다.
