openapi: 3.1.0
info:
  title: MiriYum Waiting API
  version: 1.0.0
  description: 매장 운영자 웨이팅 원장과 소비자 등록·현재 조회·취소 계약
  license:
    name: All Rights Reserved
    identifier: LicenseRef-All-Rights-Reserved
servers:
  - url: /
security: []
tags:
  - name: Waiting Settings
    description: Reservation 도메인이 소유하는 매장별 웨이팅 운영 설정
  - name: Waiting Ledger
    description: Reservation 도메인이 소유하는 중앙 FIFO 웨이팅 원장 조회와 운영자 전이
  - name: Consumer Waiting
    description: 로그인 소비자의 접수 가능 상태 조회, 등록, 현재 웨이팅 조회와 취소
paths:
  /api/v1/store-operators/stores/{storeId}/waiting-settings:
    get:
      tags: [Waiting Settings]
      summary: 웨이팅 운영 설정 조회
      description: >-
        APPROVED 매장의 대표 운영자가 조회한다. OPEN, TEMPORARILY_CLOSED, CLOSED 운영 상태를
        모두 허용하며 입점 검증 상태를 APPROVED로 확인할 수 없으면 STORE_007로 거절한다.
      operationId: getWaitingSettings
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: 현재 웨이팅 운영 설정. 저장된 설정이 없으면 안전한 기본값을 반환한다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitingSettingSuccessResponse"
        "400":
          $ref: "#/components/responses/WaitingStoreIdBadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WaitingStoreForbidden"
        "404":
          $ref: "#/components/responses/WaitingStoreNotFound"
        "409":
          $ref: "#/components/responses/WaitingStoreStateConflict"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
    put:
      tags: [Waiting Settings]
      summary: 웨이팅 운영 설정 전체 교체
      description: >-
        APPROVED 매장의 대표 운영자가 OPEN 또는 TEMPORARILY_CLOSED 운영 상태에서만 교체한다.
        CLOSED는 STORE_005, APPROVED로 확인할 수 없는 입점 검증 상태는 STORE_007로 거절한다.
      operationId: updateWaitingSettings
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitingSettingUpdateRequest"
      responses:
        "200":
          description: 새 버전으로 전체 교체된 웨이팅 운영 설정
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitingSettingSuccessResponse"
        "202":
          description: 설정을 비활성화하고 활성 팀 비동기 일괄 종결 작업을 생성함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitingClosureJobSuccessResponse"
        "400":
          $ref: "#/components/responses/WaitingBadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WaitingStoreForbidden"
        "404":
          $ref: "#/components/responses/WaitingStoreNotFound"
        "409":
          $ref: "#/components/responses/WaitingSettingConflict"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/store-operators/stores/{storeId}/waiting-settings/deactivation-impact:
    get:
      tags: [Waiting Settings]
      summary: 웨이팅 기능 비활성화 영향 조회
      description: >-
        APPROVED 매장의 대표 운영자가 조회한다. OPEN, TEMPORARILY_CLOSED, CLOSED 운영 상태를
        모두 허용하며 입점 검증 상태를 APPROVED로 확인할 수 없으면 STORE_007로 거절한다.
      operationId: getWaitingDisableImpact
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: 현재 설정 버전과 활성 팀 영향
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitingDisableImpactSuccessResponse"
        "400":
          $ref: "#/components/responses/WaitingStoreIdBadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WaitingStoreForbidden"
        "404":
          $ref: "#/components/responses/WaitingStoreNotFound"
        "409":
          $ref: "#/components/responses/WaitingStoreStateConflict"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/store-operators/stores/{storeId}/waiting-teams:
    get:
      tags: [Waiting Ledger]
      summary: 웨이팅 팀 FIFO 목록 조회
      operationId: getWaitingTeams
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/WaitingTeamStatus"
        - $ref: "#/components/parameters/WaitingQueueCursor"
        - $ref: "#/components/parameters/WaitingPageSize"
      responses:
        "200":
          description: "(queueSequence, waitingTeamId) 오름차순의 FIFO 페이지"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitingTeamPageSuccessResponse"
        "400":
          $ref: "#/components/responses/WaitingLedgerBadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WaitingStoreForbidden"
        "404":
          $ref: "#/components/responses/WaitingLedgerNotFound"
        "409":
          $ref: "#/components/responses/WaitingLedgerConflict"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/store-operators/stores/{storeId}/waiting-teams/{waitingTeamId}:
    get:
      tags: [Waiting Ledger]
      summary: 웨이팅 팀 상세 조회
      operationId: getWaitingTeam
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/WaitingTeamId"
      responses:
        "200":
          description: 운영자가 안전하게 확인할 수 있는 웨이팅 팀 원장 스냅샷
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitingTeamDetailSuccessResponse"
        "400":
          $ref: "#/components/responses/WaitingLedgerBadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WaitingStoreForbidden"
        "404":
          $ref: "#/components/responses/WaitingLedgerNotFound"
        "409":
          $ref: "#/components/responses/WaitingLedgerConflict"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/store-operators/stores/{storeId}/waiting-teams/{waitingTeamId}/calls:
    post:
      tags: [Waiting Ledger]
      summary: FIFO 선두 웨이팅 팀 호출
      operationId: callWaitingTeam
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/WaitingTeamId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitingTeamTransitionRequest"
      responses:
        "200":
          $ref: "#/components/responses/WaitingTeamDetailSuccess"
        "400":
          $ref: "#/components/responses/WaitingLedgerBadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WaitingStoreForbidden"
        "404":
          $ref: "#/components/responses/WaitingLedgerNotFound"
        "409":
          $ref: "#/components/responses/WaitingLedgerConflict"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/store-operators/stores/{storeId}/waiting-teams/{waitingTeamId}/arrivals:
    post:
      tags: [Waiting Ledger]
      summary: 호출된 웨이팅 팀 도착 처리
      operationId: arriveWaitingTeam
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/WaitingTeamId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitingTeamTransitionRequest"
      responses:
        "200":
          $ref: "#/components/responses/WaitingTeamDetailSuccess"
        "400":
          $ref: "#/components/responses/WaitingLedgerBadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WaitingStoreForbidden"
        "404":
          $ref: "#/components/responses/WaitingLedgerNotFound"
        "409":
          $ref: "#/components/responses/WaitingLedgerConflict"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/store-operators/stores/{storeId}/waiting-teams/{waitingTeamId}/check-ins:
    post:
      tags: [Waiting Ledger]
      summary: 도착한 웨이팅 팀 입장 처리
      operationId: checkInWaitingTeam
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/WaitingTeamId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitingTeamTransitionRequest"
      responses:
        "200":
          $ref: "#/components/responses/WaitingTeamDetailSuccess"
        "400":
          $ref: "#/components/responses/WaitingLedgerBadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WaitingStoreForbidden"
        "404":
          $ref: "#/components/responses/WaitingLedgerNotFound"
        "409":
          $ref: "#/components/responses/WaitingLedgerConflict"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/store-operators/stores/{storeId}/waiting-teams/{waitingTeamId}/cancellations:
    post:
      tags: [Waiting Ledger]
      summary: 웨이팅 팀 취소 처리
      description: >-
        WAITING, CALLED, ARRIVED 또는 비종결 RESERVATION_CONVERTING 팀을 CANCELLED로 종결한다.
        RESERVATION_CONVERTING에서는 예약 선점·결제 성공·매장 종료와 조건부 갱신으로 한 결과만
        확정하고 취소가 먼저 확정되면 필요한 선점 해제 또는 승인 취소·환불 후속 작업을 기록한다.
      x-allowed-source-statuses: [WAITING, CALLED, ARRIVED, RESERVATION_CONVERTING]
      x-result-status: CANCELLED
      operationId: cancelWaitingTeam
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/WaitingTeamId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitingTeamTransitionRequest"
      responses:
        "200":
          $ref: "#/components/responses/WaitingTeamDetailSuccess"
        "400":
          $ref: "#/components/responses/WaitingLedgerBadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WaitingStoreForbidden"
        "404":
          $ref: "#/components/responses/WaitingLedgerNotFound"
        "409":
          $ref: "#/components/responses/WaitingLedgerConflict"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/store-operators/stores/{storeId}/waiting-closure-jobs/{jobId}:
    get:
      tags: [Waiting Ledger]
      summary: 활성 웨이팅 팀 종결 작업 조회
      description: >-
        #271의 설정 비활성화 명령이 생성한 작업만 조회한다. 이 계약은 작업을 생성하거나
        #271의 `202 Accepted` 응답을 다시 정의하지 않는다.
      operationId: getWaitingCloseJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/WaitingCloseJobId"
      responses:
        "200":
          description: 대상 스냅샷과 처리·실패·대사가 필요한 팀 수
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitingClosureJobSuccessResponse"
        "400":
          $ref: "#/components/responses/WaitingLedgerBadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WaitingStoreForbidden"
        "404":
          $ref: "#/components/responses/WaitingLedgerNotFound"
        "409":
          $ref: "#/components/responses/WaitingLedgerConflict"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/consumers/me/stores/{storeId}/waiting-availabilities:
    get:
      tags: [Consumer Waiting]
      summary: 현재 웨이팅 접수 가능 상태 조회
      operationId: getConsumerWaitingAvailability
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: 현재 중앙 시각 기준 접수 가능 여부와 접수 가능한 영업일
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitingReceptionAvailabilitySuccessResponse"
        "400":
          $ref: "#/components/responses/WaitingLedgerBadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WaitingConsumerAccountForbidden"
        "404":
          $ref: "#/components/responses/WaitingConsumerStoreNotFound"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/consumers/me/stores/{storeId}/waiting-location-proofs:
    post:
      tags: [Consumer Waiting]
      summary: 웨이팅 등록용 GPS 위치 판정
      operationId: issueConsumerWaitingLocationProof
      description: >-
        계정·매장·WAITING_REGISTRATION 목적에 결속된 120초 일회 소비 세션을 발급한다.
        좌표·원본 정확도·측정 시각·계산 거리는 요청 처리 중에만 사용하고 응답, DB, 감사,
        로그에 저장하지 않는다. 권한 거부·위치 미수신·낮은 정확도·오래된 측정·조작 의심은
        성공으로 추정하거나 IP 위치로 대체하지 않고 해당 판정 범주를 HTTP 200으로 반환한다.
      x-location-raw-retention: none
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitingLocationProofRequest"
      responses:
        "200":
          description: 위치 원문을 포함하지 않는 판정 세션 snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitingLocationProofSuccessResponse"
        "400":
          $ref: "#/components/responses/WaitingLocationProofBadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WaitingConsumerAccountForbidden"
        "404":
          $ref: "#/components/responses/WaitingConsumerStoreNotFound"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/consumers/me/stores/{storeId}/waiting-teams:
    post:
      tags: [Consumer Waiting]
      summary: 웨이팅 등록
      operationId: createConsumerWaitingTeam
      description: >-
        계정·매장·WAITING_REGISTRATION 목적에 결속된 VERIFIED 위치 증명 세션을
        팀·순번·대표자 membership 생성과 같은 멱등 트랜잭션에서 한 번만 소비한다.
      x-location-proof-required: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitingConsumerCreateRequest"
      responses:
        "200":
          description: 생성되거나 같은 멱등 키로 재생된 본인 웨이팅 snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitingConsumerSnapshotSuccessResponse"
        "400":
          $ref: "#/components/responses/WaitingLedgerBadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WaitingConsumerCreateForbidden"
        "404":
          $ref: "#/components/responses/WaitingConsumerStoreNotFound"
        "409":
          $ref: "#/components/responses/WaitingConsumerCreateConflict"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/consumers/me/waiting-teams/current:
    get:
      tags: [Consumer Waiting]
      summary: 본인 현재 활성 웨이팅 조회
      operationId: getCurrentConsumerWaitingTeam
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 본인의 현재 활성 웨이팅 snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitingConsumerSnapshotSuccessResponse"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WaitingConsumerAccountForbidden"
        "404":
          $ref: "#/components/responses/WaitingConsumerTeamNotFound"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/consumers/me/waiting-teams/{waitingTeamId}/cancellations:
    post:
      tags: [Consumer Waiting]
      summary: 본인 활성 웨이팅 취소
      operationId: cancelCurrentConsumerWaitingTeam
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WaitingTeamId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitingTeamTransitionRequest"
      responses:
        "200":
          description: 취소되거나 같은 멱등 키로 재생된 본인 웨이팅 snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitingConsumerSnapshotSuccessResponse"
        "400":
          $ref: "#/components/responses/WaitingLedgerBadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WaitingConsumerAccountForbidden"
        "404":
          $ref: "#/components/responses/WaitingConsumerTeamNotFound"
        "409":
          $ref: "#/components/responses/WaitingConsumerCancelConflict"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/consumers/me/waiting-teams/{teamId}/invitations:
    post:
      tags: [Consumer Waiting]
      summary: 일행 초대 발급
      operationId: issueWaitingPartyInvitation
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PartyTeamId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaitingExpectedVersionRequest" }
      responses:
        "200":
          description: 새 초대 또는 멱등 재생
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitingInvitationSuccessResponse" }
        "400": { $ref: "#/components/responses/WaitingLedgerBadRequest" }
        "401": { $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized" }
