          description: 대표자가 변경된 팀 snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitingConsumerSnapshotSuccessResponse" }
        "400": { $ref: "#/components/responses/WaitingLedgerBadRequest" }
        "401": { $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WaitingConsumerAccountForbidden" }
        "404": { $ref: "#/components/responses/WaitingConsumerTeamNotFound" }
        "409": { $ref: "#/components/responses/WaitingConsumerCancelConflict" }
        "429": { $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests" }
  /api/v1/consumers/me/waiting-teams/{teamId}/representative-transfer-offers/{offerId}/rejections:
    post:
      tags: [Consumer Waiting]
      summary: 대상 구성원의 대표자 이전 거절
      operationId: rejectWaitingRepresentativeTransfer
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PartyTeamId"
        - $ref: "#/components/parameters/TransferOfferId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaitingExpectedVersionRequest" }
      responses:
        "200":
          description: 거절된 제안
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitingTransferOfferSuccessResponse" }
        "400": { $ref: "#/components/responses/WaitingLedgerBadRequest" }
        "401": { $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WaitingConsumerAccountForbidden" }
        "404": { $ref: "#/components/responses/WaitingConsumerTeamNotFound" }
        "409": { $ref: "#/components/responses/WaitingConsumerCancelConflict" }
        "429": { $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests" }
  /api/v1/consumers/me/waiting-teams/{teamId}/representative-transfer-offers/{offerId}/revocations:
    post:
      tags: [Consumer Waiting]
      summary: 기존 대표자의 대표자 이전 철회
      operationId: revokeWaitingRepresentativeTransfer
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PartyTeamId"
        - $ref: "#/components/parameters/TransferOfferId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaitingExpectedVersionRequest" }
      responses:
        "200":
          description: 철회된 제안
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitingTransferOfferSuccessResponse" }
        "400": { $ref: "#/components/responses/WaitingLedgerBadRequest" }
        "401": { $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WaitingConsumerAccountForbidden" }
        "404": { $ref: "#/components/responses/WaitingConsumerTeamNotFound" }
        "409": { $ref: "#/components/responses/WaitingConsumerCancelConflict" }
        "429": { $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests" }
components:
  securitySchemes:
    bearerAuth:
      $ref: "../mvp1-common/openapi.yaml#/components/securitySchemes/bearerAuth"
  parameters:
    StoreId:
      name: storeId
      in: path
      required: true
      description: 권한을 확인할 대상 매장의 공개 문자열 ID
      schema:
        $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
    WaitingTeamId:
      name: waitingTeamId
      in: path
      required: true
      description: 조회하거나 전이할 웨이팅 팀의 공개 문자열 ID
      schema:
        $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
    PartyTeamId:
      name: teamId
      in: path
      required: true
      schema: { $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId" }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId" }
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: { $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId" }
    TransferOfferId:
      name: offerId
      in: path
      required: true
      schema: { $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId" }
    WaitingCloseJobId:
      name: jobId
      in: path
      required: true
      description: "#271의 비활성화 명령이 만든 웨이팅 종결 작업의 공개 문자열 ID"
      schema:
        $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
    WaitingTeamStatus:
      name: status
      in: query
      required: false
      description: 지정하면 해당 상태의 팀만 반환한다.
      schema:
        $ref: "#/components/schemas/WaitingTeamStatus"
    WaitingQueueCursor:
      name: cursor
      in: query
      required: false
      description: 직전 페이지 마지막 항목의 opaque `(queueSequence, waitingTeamId)` cursor
      schema:
        $ref: "#/components/schemas/WaitingQueueCursor"
    WaitingPageSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    WaitingReceptionMode:
      type: string
      enum: [AUTO, MANUAL, PAUSED]
      description: 자동 접수, 수동 접수 또는 신규 접수 일시중지
    WaitingDisableAction:
      type: string
      enum: [KEEP_ACTIVE, CLOSE_ACTIVE_TEAMS]
      description: >-
        비활성화 시 기존 활성 팀을 유지하거나 비동기 일괄 종결하도록 요청하는 명시적 intent.
        enabled=false인 요청에서만 허용하며 활성 팀이 있으면 필수다.
    WaitingSetting:
      type: object
      additionalProperties: false
      required:
        - storeId
        - enabled
        - receptionMode
        - advanceOpenMinutes
        - version
      properties:
        storeId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        enabled:
          type: boolean
        receptionMode:
          $ref: "#/components/schemas/WaitingReceptionMode"
        advanceOpenMinutes:
          type: integer
          minimum: 0
          maximum: 180
          description: 자동 접수를 영업 시작보다 먼저 여는 시간(분)
        version:
          type: integer
          format: int64
          minimum: 0
          description: 설정이 없으면 0이며 성공한 새 교체마다 단조 증가한다.
      allOf:
        - if:
            properties:
              enabled:
                const: false
            required: [enabled]
          then:
            properties:
              receptionMode:
                const: PAUSED
    WaitingSettingUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - enabled
        - receptionMode
        - advanceOpenMinutes
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
          description: 마지막으로 조회한 현재 설정 버전
        enabled:
          type: boolean
        receptionMode:
          $ref: "#/components/schemas/WaitingReceptionMode"
        advanceOpenMinutes:
          type: integer
          minimum: 0
          maximum: 180
        disableAction:
          $ref: "#/components/schemas/WaitingDisableAction"
      allOf:
        - if:
            properties:
              enabled:
                const: false
            required: [enabled]
          then:
            properties:
              receptionMode:
                const: PAUSED
        - if:
            properties:
              disableAction: {}
            required: [disableAction]
          then:
            properties:
              enabled:
                const: false
    WaitingDisableImpact:
      type: object
      additionalProperties: false
      required:
        - storeId
        - version
        - activeTeamCount
      properties:
        storeId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        version:
          type: integer
          format: int64
          minimum: 0
          description: 설정 조회·수정 응답과 같은 현재 설정 버전
        activeTeamCount:
          type: integer
          format: int64
          minimum: 0
          description: WAITING, CALLED, ARRIVED, RESERVATION_CONVERTING 상태의 현재 팀 수
          x-counted-statuses: [WAITING, CALLED, ARRIVED, RESERVATION_CONVERTING]
    WaitingSettingSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/WaitingSetting"
    WaitingDisableImpactSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/WaitingDisableImpact"
    WaitingTeamStatus:
      type: string
      enum:
        - WAITING
        - CALLED
        - ARRIVED
        - CHECKED_IN
        - CANCELLED
        - NO_SHOW
        - CLOSED_BY_STORE
        - RESERVATION_CONVERTING
        - RESERVATION_CONVERTED
      description: >-
        웨이팅 원장의 팀 상태. RESERVATION_CONVERTING은 비종결이며 예약 전환 결과가 확정될
        때까지 계정 활성 membership 유지 상태다. 전환 실패로 WAITING 복귀해도 같은 membership을
        유지한다. RESERVATION_CONVERTED는 결제 기반 예약 전환이 최종 Reservation scalar ID로
        완료된 종결 상태다. RESERVATION_CONVERTING은 운영자 cancel만 허용한다.
    WaitingTeamTransitionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
          description: 마지막으로 조회한 대상 웨이팅 팀의 원장 버전
    WaitingConsumerCreateRequest:
      type: object
      additionalProperties: false
      required: [businessDate, partySize, locationProofSessionId]
      properties:
        businessDate:
          type: string
          format: date
          description: 직전 접수 가능 상태 조회에서 서버가 반환한 영업일
        partySize:
          type: integer
          minimum: 1
          description: 대표자가 등록하는 팀 인원수
        locationProofSessionId:
          type: string
          format: uuid
          description: 같은 계정·매장·등록 목적에 결속된 미소비 VERIFIED 위치 증명 세션
    WaitingLocationProofRequest:
      type: object
      additionalProperties: false
      required: [measurementStatus, integrityStatus]
      properties:
        measurementStatus:
          type: string
          enum: [MEASURED, PERMISSION_DENIED, POSITION_UNAVAILABLE]
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: number
          exclusiveMinimum: 0
        measuredAt:
          type: string
          format: date-time
        integrityStatus:
          type: string
          enum: [CLEAR, MANIPULATION_SUSPECTED]
      oneOf:
        - properties:
            measurementStatus:
              const: MEASURED
          required: [latitude, longitude, accuracyMeters, measuredAt]
        - properties:
            measurementStatus:
              enum: [PERMISSION_DENIED, POSITION_UNAVAILABLE]
            latitude: false
            longitude: false
            accuracyMeters: false
            measuredAt: false
    WaitingLocationProofSnapshot:
      type: object
      additionalProperties: false
      required:
        - proofSessionId
        - resultCategory
        - accuracyCategory
        - policyVersion
        - storeCoordinateVersion
        - issuedAt
        - judgedAt
        - expiresAt
      properties:
        proofSessionId:
          type: string
          format: uuid
        resultCategory:
          type: string
          enum:
            - VERIFIED
            - OUTSIDE_RADIUS
            - ACCURACY_INSUFFICIENT
            - PERMISSION_DENIED
            - MEASUREMENT_STALE
            - POSITION_UNAVAILABLE
            - MANIPULATION_SUSPECTED
        accuracyCategory:
          type: string
          enum: [ACCEPTABLE, INSUFFICIENT, NOT_APPLICABLE]
        policyVersion:
          type: string
          enum: [WAITING_LOCATION_V1]
        storeCoordinateVersion:
          type: integer
          format: int64
          minimum: 0
        issuedAt:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
        judgedAt:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
        expiresAt:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
    WaitingReceptionAvailability:
      type: object
      additionalProperties: false
      required: [storeId, accepting, businessDate]
      properties:
        storeId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        accepting:
          type: boolean
        businessDate:
          type: [string, "null"]
          format: date
          description: accepting=true일 때 등록 요청에 사용할 현재 영업일
    WaitingConsumerSnapshot:
      type: object
      additionalProperties: false
      required:
        - waitingTeamId
        - storeId
        - businessDate
        - status
        - queueSequence
        - teamsAhead
        - partySize
        - createdAt
        - calledAt
        - arrivalDeadline
        - arrivedAt
        - cancelledAt
        - version
        - memberships
      properties:
        waitingTeamId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        storeId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        businessDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/WaitingTeamStatus"
        queueSequence:
          type: integer
          format: int64
          minimum: 1
        teamsAhead:
          type: integer
          format: int64
          minimum: 0
        partySize:
          type: integer
          minimum: 1
        createdAt:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
        calledAt:
          type: [string, "null"]
          format: date-time
        arrivalDeadline:
          type: [string, "null"]
          format: date-time
        arrivedAt:
          type: [string, "null"]
          format: date-time
        cancelledAt:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
        memberships:
          type: array
          items: { $ref: "#/components/schemas/WaitingPartyMember" }
    WaitingExpectedVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    WaitingInvitationAcceptanceRequest:
      type: object
      additionalProperties: false
      required: [invitationCode]
      properties:
        invitationCode: { type: string, minLength: 1, maxLength: 128 }
    WaitingPartyMember:
      type: object
      additionalProperties: false
      required: [membershipId, role, joinedAt, self]
      properties:
        membershipId: { $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId" }
        role: { type: string, enum: [REPRESENTATIVE, MEMBER] }
        joinedAt: { $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime" }
        self: { type: boolean }
    WaitingInvitation:
      type: object
      additionalProperties: false
      required: [invitationId, expiresAt, invitationCode]
      properties:
        invitationId: { $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId" }
        expiresAt: { $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime" }
        invitationCode: { type: [string, "null"], description: 신규 발급 응답에서만 반환 }
    WaitingInvitationSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code: { type: string, const: SUCCESS }
        message: { type: string }
        data: { $ref: "#/components/schemas/WaitingInvitation" }
    WaitingTransferProposalRequest:
      type: object
      additionalProperties: false
      required: [targetMembershipId, expectedVersion]
      properties:
        targetMembershipId: { $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId" }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    WaitingTransferOffer:
      type: object
      additionalProperties: false
      required: [offerId, targetMembershipId, status, proposedAt, expiresAt]
      properties:
        offerId: { $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId" }
        targetMembershipId: { $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId" }
        status: { type: string, enum: [PROPOSED, ACCEPTED, REJECTED, REVOKED, EXPIRED] }
        proposedAt: { $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime" }
        expiresAt: { $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime" }
    WaitingTransferOfferSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code: { type: string, const: SUCCESS }
        message: { type: string }
        data: { $ref: "#/components/schemas/WaitingTransferOffer" }
    WaitingTeamListItem:
      type: object
      additionalProperties: false
      required:
        - waitingTeamId
        - status
        - queueSequence
        - partySize
        - createdAt
        - version
      properties:
        waitingTeamId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        status:
          $ref: "#/components/schemas/WaitingTeamStatus"
        queueSequence:
          type: integer
          format: int64
          minimum: 1
          description: 매장과 KST 영업일 안에서 단조 증가하는 중앙 FIFO 순번
        partySize:
          type: integer
          minimum: 1
        createdAt:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
        version:
          type: integer
          format: int64
          minimum: 0
    WaitingTeamDetail:
      type: object
      additionalProperties: false
      required:
        - waitingTeamId
        - storeId
        - status
        - queueSequence
        - partySize
        - createdAt
        - version
      properties:
        waitingTeamId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        storeId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        status:
          $ref: "#/components/schemas/WaitingTeamStatus"
        queueSequence:
          type: integer
          format: int64
          minimum: 1
        partySize:
          type: integer
          minimum: 1
        createdAt:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
        calledAt:
          type: [string, "null"]
          format: date-time
        arrivedAt:
          type: [string, "null"]
          format: date-time
        checkedInAt:
          type: [string, "null"]
          format: date-time
        cancelledAt:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
    WaitingQueueCursor:
      type: string
      description: >-
        서버가 발급하는 opaque cursor. 목록은 `(queueSequence, waitingTeamId)` 오름차순으로
        정렬하며, 다음 페이지는 이 복합 키보다 큰 항목부터 시작한다.
    WaitingTeamPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WaitingTeamListItem"
        nextCursor:
          type: [string, "null"]
          description: 다음 페이지가 없으면 null인 opaque cursor
    WaitingClosureJobStatus:
      type: string
      enum: [PENDING, PROCESSING, COMPLETED, RECONCILIATION_REQUIRED]
      description: 종결 대상 스냅샷 처리 작업의 현재 상태
    WaitingClosureJob:
      type: object
      additionalProperties: false
      required:
        - jobId
        - storeId
        - status
        - totalTeamCount
        - completedTeamCount
        - failedTeamCount
        - reconciliationRequiredTeamCount
        - createdAt
      properties:
        jobId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        storeId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        status:
          $ref: "#/components/schemas/WaitingClosureJobStatus"
        totalTeamCount:
          type: integer
          format: int64
          minimum: 0
        completedTeamCount:
          type: integer
          format: int64
          minimum: 0
        failedTeamCount:
          type: integer
          format: int64
          minimum: 0
        reconciliationRequiredTeamCount:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
        completedAt:
          type: [string, "null"]
          format: date-time
    WaitingTeamPageSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/WaitingTeamPage"
    WaitingTeamDetailSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/WaitingTeamDetail"
    WaitingClosureJobSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/WaitingClosureJob"
    WaitingReceptionAvailabilitySuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/WaitingReceptionAvailability"
    WaitingLocationProofSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/WaitingLocationProofSnapshot"
    WaitingConsumerSnapshotSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/WaitingConsumerSnapshot"
  responses:
    WaitingLocationProofBadRequest:
      description: storeId, 조건부 위치 측정 본문 또는 JSON 형식이 올바르지 않음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          examples:
            validationFailed:
              value:
                code: COMMON_001
                message: 입력값이 올바르지 않습니다.
            malformedRequest:
              value:
                code: COMMON_002
                message: 요청 본문을 읽을 수 없습니다.
    WaitingStoreIdBadRequest:
      description: storeId가 양의 정수 문자열 PublicId 형식이 아님
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: COMMON_001
            message: 입력값이 올바르지 않습니다.
            details:
              - field: storeId
                reason: 양의 정수 문자열이어야 합니다.
    WaitingBadRequest:
      description: storeId·본문 검증, JSON 역직렬화 또는 필수 멱등성 헤더가 올바르지 않음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          examples:
            invalidStoreId:
              value:
                code: COMMON_001
                message: 입력값이 올바르지 않습니다.
                details:
                  - field: storeId
                    reason: 양의 정수 문자열이어야 합니다.
            validationFailed:
              value:
                code: COMMON_001
                message: 입력값이 올바르지 않습니다.
                details:
                  - field: advanceOpenMinutes
                    reason: 0 이상 180 이하여야 합니다.
            malformedRequest:
              value:
                code: COMMON_002
                message: 요청 본문을 읽을 수 없습니다.
            idempotencyKeyRequired:
              value:
                code: COMMON_003
                message: Idempotency-Key 헤더가 필요합니다.
            invalidIdempotencyKey:
              value:
                code: COMMON_004
                message: Idempotency-Key 형식이 올바르지 않습니다.
    WaitingStoreForbidden:
      description: 현재 계정 상태가 제한됐거나 대상 매장의 현재 대표 운영자가 아님
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          examples:
            accountRestricted:
              value:
                code: AUTH_011
                message: 현재 계정 상태로 이용할 수 없습니다.
            storeAccessDenied:
              value:
                code: STORE_003
                message: 대상 매장의 운영 권한이 없습니다.
    WaitingStoreNotFound:
      description: 대상 매장이 실제로 존재하지 않음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: STORE_001
            message: 매장을 찾을 수 없습니다.
    WaitingStoreStateConflict:
      description: 조회 시 대상 매장의 입점 검증 상태를 APPROVED로 확인할 수 없음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: STORE_007
            message: 현재 입점 검증 상태에서 운영할 수 없습니다.
    WaitingSettingConflict:
      description: 설정 버전, 비활성화 action, Store 상태, 멱등성 또는 동시 요청 충돌
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          examples:
            staleVersion:
              value:
                code: WAITING_001
                message: 웨이팅 설정이 변경되었습니다. 최신 설정을 다시 확인해 주세요.
            disableActionRequired:
              value:
                code: WAITING_002
                message: 활성 대기 팀의 처리 방법을 선택해 주세요.
            idempotencyKeyReused:
              value:
                code: COMMON_007
                message: 동일한 Idempotency-Key를 다른 요청에 사용할 수 없습니다.
            concurrentModification:
              value:
                code: COMMON_008
                message: 동시 요청 충돌로 처리하지 못했습니다. 다시 시도해 주세요.
            invalidStoreState:
              value:
                code: STORE_005
                message: 현재 매장 상태에서 요청한 작업을 수행할 수 없습니다.
            invalidVerificationState:
              value:
                code: STORE_007
                message: 현재 입점 검증 상태에서 운영할 수 없습니다.
    WaitingTeamDetailSuccess:
      description: 전이 뒤의 현재 웨이팅 팀 원장 스냅샷
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WaitingTeamDetailSuccessResponse"
    WaitingLedgerBadRequest:
      description: path·query·본문 또는 멱등성 헤더가 유효하지 않음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          examples:
            invalidIdentifier:
              value:
                code: COMMON_001
                message: 입력값이 올바르지 않습니다.
            malformedRequest:
              value:
                code: COMMON_002
                message: 요청 본문을 읽을 수 없습니다.
            idempotencyKeyRequired:
              value:
                code: COMMON_003
                message: Idempotency-Key 헤더가 필요합니다.
            invalidIdempotencyKey:
              value:
                code: COMMON_004
                message: Idempotency-Key 형식이 올바르지 않습니다.
    WaitingLedgerNotFound:
      description: 대상 매장, 웨이팅 팀 또는 종결 작업을 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          examples:
            storeNotFound:
              value:
                code: STORE_001
                message: 매장을 찾을 수 없습니다.
            waitingTeamNotFound:
              value:
                code: WAITING_003
                message: 웨이팅 팀을 찾을 수 없습니다.
            waitingCloseJobNotFound:
              value:
                code: WAITING_004
                message: 웨이팅 종결 작업을 찾을 수 없습니다.
    WaitingLedgerConflict:
      description: >-
        웨이팅 팀의 현재 상태·버전·FIFO 선두 조건·활성 membership·종결 작업 결과 또는 Store 상태와
        충돌했거나, 멱등 키가 다른 요청 지문에 재사용되었거나 동시 변경이 발생했다.
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          examples:
            staleTeamVersion:
              value:
                code: WAITING_005
                message: 웨이팅 팀이 변경되었습니다. 최신 상태를 다시 확인해 주세요.
            invalidTransition:
              value:
                code: WAITING_006
                message: 현재 상태에서는 요청한 전이를 수행할 수 없습니다.
            fifoHeadRequired:
              value:
                code: WAITING_007
                message: FIFO 선두 웨이팅 팀만 호출할 수 있습니다.
            activeMembershipConflict:
              value:
                code: WAITING_008
                message: 활성 웨이팅 멤버십과 요청 전제가 충돌합니다.
            closureJobFailed:
              value:
                code: WAITING_010
                message: 웨이팅 종결 작업에 실패한 팀이 있습니다.
            closureJobReconciliationRequired:
              value:
                code: WAITING_009
                message: 웨이팅 종결 결과의 대사가 필요합니다.
            idempotencyKeyReused:
              value:
                code: COMMON_007
                message: 동일한 Idempotency-Key를 다른 요청에 사용할 수 없습니다.
            concurrentModification:
              value:
                code: COMMON_008
                message: 동시 요청 충돌로 처리하지 못했습니다. 다시 시도해 주세요.
    WaitingConsumerStoreNotFound:
      description: 대상 매장을 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: STORE_001
            message: 매장을 찾을 수 없습니다.
    WaitingConsumerTeamNotFound:
      description: 본인 소유 웨이팅 팀을 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: WAITING_003
            message: 웨이팅 팀을 찾을 수 없습니다.
    WaitingConsumerAccountForbidden:
      description: 현재 소비자 계정 상태가 이용을 허용하지 않음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: AUTH_011
            message: 현재 계정 상태로는 이용할 수 없습니다.
    WaitingConsumerCreateForbidden:
      description: 소비자 계정이 제한됐거나 매장 웨이팅 기능이 제재로 제한됨
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          examples:
            accountRestricted:
              value:
                code: AUTH_011
                message: 현재 계정 상태로는 이용할 수 없습니다.
            waitingFeatureRestricted:
              value:
                code: STORE_015
                message: 제재로 제한된 매장 기능입니다.
    WaitingConsumerCreateConflict:
      description: 매장·입점·접수 상태, 단일 활성 웨이팅, 멱등성 또는 동시 요청 충돌
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          examples:
            storeStateConflict:
              value:
                code: STORE_005
                message: 현재 매장 상태에서 요청한 작업을 수행할 수 없습니다.
            verificationStateConflict:
              value:
                code: STORE_007
                message: 현재 입점 검증 상태에서 운영할 수 없습니다.
            accountActiveWaitingExists:
              value:
                code: WAITING_011
                message: 계정에 이미 활성 웨이팅이 있습니다. 기존 웨이팅을 종료한 후 다시 시도해 주세요.
            receptionClosed:
              value:
                code: WAITING_012
                message: 현재 매장은 신규 웨이팅 접수를 받지 않습니다.
            idempotencyKeyReused:
              value:
                code: COMMON_007
                message: 동일한 Idempotency-Key를 다른 요청에 사용할 수 없습니다.
            concurrentModification:
              value:
                code: COMMON_008
                message: 동시 요청 충돌로 처리하지 못했습니다. 다시 시도해 주세요.
    WaitingConsumerCancelConflict:
      description: 팀 버전·상태, 활성 membership, 멱등성 또는 동시 요청 충돌
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          examples:
            staleTeamVersion:
              value:
                code: WAITING_005
                message: 웨이팅 팀이 변경되었습니다. 최신 상태를 다시 확인해 주세요.
            invalidTransition:
              value:
                code: WAITING_006
                message: 현재 상태에서는 요청한 전이를 수행할 수 없습니다.
            activeMembershipConflict:
              value:
                code: WAITING_008
                message: 활성 웨이팅 멤버십과 요청 전제가 충돌합니다.
            idempotencyKeyReused:
              value:
                code: COMMON_007
                message: 동일한 Idempotency-Key를 다른 요청에 사용할 수 없습니다.
            concurrentModification:
              value:
                code: COMMON_008
                message: 동시 요청 충돌로 처리하지 못했습니다. 다시 시도해 주세요.
