        "429": { $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests" }
  /api/v1/consumers/me/waiting-teams/{teamId}/representative-transfer-offers/{offerId}/acceptances:
    post:
      tags: [Consumer Waiting]
      summary: 대상 구성원의 대표자 이전 수락
      operationId: acceptWaitingRepresentativeTransfer
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PartyTeamId"
        - $ref: "#/components/parameters/TransferOfferId"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
