openapi: 3.1.0
info:
  title: MiriYum MVP1 Auth and Account API
  version: 1.0.0
  description: 일반 사용자·매장 운영자 인증, 본인 정보와 마이페이지 예약 내역 계약
  license:
    name: All rights reserved
    identifier: LicenseRef-All-Rights-Reserved
servers:
  - url: /
    description: 배포 환경의 동일 origin
security: []
tags:
  - name: Consumer Auth
    description: 일반 사용자 인증
  - name: Store Operator Auth
    description: 매장 운영자 인증
  - name: Account
    description: 계정 유형별 본인 정보
  - name: My Page
    description: 일반 사용자 마이페이지
paths:
  /api/v1/consumer-auth/accounts:
    post:
      tags: [Consumer Auth]
      summary: 일반 사용자 가입
      operationId: createConsumerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerSignUpRequest"
      responses:
        "201":
          description: 일반 사용자 계정 생성
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountCreatedSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/AccountConflict"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/consumer-auth/sessions:
    post:
      tags: [Consumer Auth]
      summary: 일반 사용자 로그인
      operationId: createConsumerSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 로그인 성공
          headers:
            Set-Cookie:
              description: MIRIYUM_CONSUMER_REFRESH Refresh JWT 쿠키
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/AccountRestricted"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/consumer-auth/token-refreshes:
    post:
      tags: [Consumer Auth]
      summary: 일반 사용자 Access Token 재발급
      operationId: refreshConsumerToken
      security:
        - consumerRefreshCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyJsonRequest"
      responses:
        "200":
          description: Access Token 재발급
          headers:
            Set-Cookie:
              description: 새 MIRIYUM_CONSUMER_REFRESH 쿠키
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidRefreshToken"
        "403":
          $ref: "#/components/responses/OriginRejected"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/consumer-auth/csrf-tokens/current:
    get:
      tags: [Consumer Auth]
      summary: 일반 사용자 shell CSRF 토큰 준비
      operationId: getConsumerCsrfToken
      responses:
        "200":
          description: CSRF 토큰 준비
          headers:
            Set-Cookie:
              description: MIRIYUM_CONSUMER_XSRF_TOKEN 쿠키
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenSuccessResponse"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/consumer-auth/sessions/current:
    delete:
      tags: [Consumer Auth]
      summary: 일반 사용자 현재 shell 로그아웃
      operationId: deleteConsumerCurrentSession
      security:
        - consumerRefreshCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: 클라이언트 토큰 제거와 Refresh 쿠키 만료
          headers:
            Set-Cookie:
              description: Max-Age=0인 MIRIYUM_CONSUMER_REFRESH 쿠키
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoDataSuccessResponse"
        "401":
          $ref: "#/components/responses/InvalidRefreshToken"
        "403":
          $ref: "#/components/responses/CsrfRejected"
  /api/v1/store-operator-auth/accounts:
    post:
      tags: [Store Operator Auth]
      summary: 매장 운영자 가입
      operationId: createStoreOperatorAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreOperatorSignUpRequest"
      responses:
        "201":
          description: 매장 운영자 계정 생성
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountCreatedSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/AccountConflict"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/store-operator-auth/sessions:
    post:
      tags: [Store Operator Auth]
      summary: 매장 운영자 로그인
      operationId: createStoreOperatorSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 로그인 성공
          headers:
            Set-Cookie:
              description: MIRIYUM_STORE_OPERATOR_REFRESH Refresh JWT 쿠키
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/AccountRestricted"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/store-operator-auth/token-refreshes:
    post:
      tags: [Store Operator Auth]
      summary: 매장 운영자 Access Token 재발급
      operationId: refreshStoreOperatorToken
      security:
        - storeOperatorRefreshCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyJsonRequest"
      responses:
        "200":
          description: Access Token 재발급
          headers:
            Set-Cookie:
              description: 새 MIRIYUM_STORE_OPERATOR_REFRESH 쿠키
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidRefreshToken"
        "403":
          $ref: "#/components/responses/OriginRejected"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/store-operator-auth/csrf-tokens/current:
    get:
      tags: [Store Operator Auth]
      summary: 매장 운영자 shell CSRF 토큰 준비
      operationId: getStoreOperatorCsrfToken
      responses:
        "200":
          description: CSRF 토큰 준비
          headers:
            Set-Cookie:
              description: MIRIYUM_STORE_OPERATOR_XSRF_TOKEN 쿠키
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenSuccessResponse"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
  /api/v1/store-operator-auth/sessions/current:
    delete:
      tags: [Store Operator Auth]
      summary: 매장 운영자 현재 shell 로그아웃
      operationId: deleteStoreOperatorCurrentSession
      security:
        - storeOperatorRefreshCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: 클라이언트 토큰 제거와 Refresh 쿠키 만료
          headers:
            Set-Cookie:
              description: Max-Age=0인 MIRIYUM_STORE_OPERATOR_REFRESH 쿠키
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoDataSuccessResponse"
        "401":
          $ref: "#/components/responses/InvalidRefreshToken"
        "403":
          $ref: "#/components/responses/CsrfRejected"
  /api/v1/consumer-accounts/me:
    get:
      tags: [Account]
      summary: 일반 사용자 본인 정보 조회
      operationId: getCurrentConsumerAccount
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 일반 사용자 본인 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerAccountSuccessResponse"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountRestricted"
    patch:
      tags: [Account]
      summary: 일반 사용자 닉네임 수정
      operationId: updateCurrentConsumerAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerAccountUpdateRequest"
      responses:
        "200":
          description: 수정된 일반 사용자 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerAccountSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountRestricted"
        "409":
          $ref: "#/components/responses/NicknameChangeConflict"
  /api/v1/store-operator-accounts/me:
    get:
      tags: [Account]
      summary: 매장 운영자 본인 정보 조회
      operationId: getCurrentStoreOperatorAccount
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 매장 운영자 본인 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOperatorAccountSuccessResponse"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountRestricted"
    patch:
      tags: [Account]
      summary: 매장 운영자 표시 이름 수정
      operationId: updateCurrentStoreOperatorAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreOperatorAccountUpdateRequest"
      responses:
        "200":
          description: 수정된 매장 운영자 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOperatorAccountSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountRestricted"
        "409":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Conflict"
  /api/v1/consumer-accounts/me/reservations:
    get:
      tags: [My Page]
      summary: 내 예약 내역 조회
      operationId: getCurrentConsumerReservations
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ReservationHistoryStatus"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/Page"
        - $ref: "../mvp1-common/openapi.yaml#/components/parameters/Size"
        - name: sort
          in: query
          description: 예약 내역 정렬. 아래 허용값 외에는 400을 반환한다.
          schema:
            type: string
            enum:
              - "createdAt,desc"
              - "createdAt,asc"
              - "serviceDate,desc"
              - "serviceDate,asc"
            default: "createdAt,desc"
      responses:
        "200":
          description: 본인 예약 내역 페이지
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationHistoryPageSuccessResponse"
        "400":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountRestricted"
components:
  securitySchemes:
    bearerAuth:
      $ref: "../mvp1-common/openapi.yaml#/components/securitySchemes/bearerAuth"
    consumerRefreshCookie:
      type: apiKey
      in: cookie
      name: MIRIYUM_CONSUMER_REFRESH
      description: Path=/api/v1/consumer-auth인 HttpOnly Refresh JWT 쿠키
    storeOperatorRefreshCookie:
      type: apiKey
      in: cookie
      name: MIRIYUM_STORE_OPERATOR_REFRESH
      description: Path=/api/v1/store-operator-auth인 HttpOnly Refresh JWT 쿠키
  parameters:
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 512
      description: 현재 계정 shell의 namespace별 CSRF 쿠키 값
  schemas:
    Email:
      type: string
      format: email
      maxLength: 254
    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 64
      description: NFC 정규화 뒤 8~64 Unicode code point이며 문자 종류 정책은 기능 명세를 따른다.
    VerificationReference:
      type: string
      minLength: 1
      maxLength: 512
      description: 서버가 진위·대상·만료·일회성 소비를 확인하는 공급자 중립 참조
    EmptyJsonRequest:
      type: object
      additionalProperties: false
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"
    ConsumerSignUpRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - passwordConfirm
        - emailVerificationReference
        - identityVerificationReference
        - nickname
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"
        passwordConfirm:
          $ref: "#/components/schemas/Password"
        emailVerificationReference:
          $ref: "#/components/schemas/VerificationReference"
        identityVerificationReference:
          $ref: "#/components/schemas/VerificationReference"
        nickname:
          type: string
          minLength: 2
          maxLength: 20
          pattern: "^[가-힣A-Za-z0-9 _-]+$"
    StoreOperatorSignUpRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - passwordConfirm
        - emailVerificationReference
        - identityVerificationReference
        - displayName
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"
        passwordConfirm:
          $ref: "#/components/schemas/Password"
        emailVerificationReference:
          $ref: "#/components/schemas/VerificationReference"
        identityVerificationReference:
          $ref: "#/components/schemas/VerificationReference"
        displayName:
          type: string
          minLength: 2
          maxLength: 50
    ConsumerAccountUpdateRequest:
      type: object
      additionalProperties: false
      required: [nickname]
      properties:
        nickname:
          type: string
          minLength: 2
          maxLength: 20
          pattern: "^[가-힣A-Za-z0-9 _-]+$"
    StoreOperatorAccountUpdateRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 50
    AccountCreatedData:
      type: object
      additionalProperties: false
      required: [accountId, accountType, status]
      properties:
        accountId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        accountType:
          type: string
          enum: [CONSUMER, STORE_OPERATOR]
        status:
          type: string
          const: ACTIVE
    TokenData:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          minLength: 1
          description: shell 메모리에만 보관할 Access JWT
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          const: 3600
          description: Access JWT 수명(초)
    CsrfTokenData:
      type: object
      additionalProperties: false
      required: [token, headerName]
      properties:
        token:
          type: string
          minLength: 1
        headerName:
          type: string
          const: X-CSRF-TOKEN
    ConsumerAccount:
      type: object
      additionalProperties: false
      required: [accountId, email, phoneNumber, nickname, status]
      properties:
        accountId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        email:
          $ref: "#/components/schemas/Email"
        phoneNumber:
          type: [string, "null"]
          pattern: "^01[016789]-[0-9]{3,4}-[0-9]{4}$"
          description: 본인확인 제공업체가 선정되어 실제 전화번호를 해석하는 어댑터가 붙기 전까지는 null이다(BLOCKED).
        nickname:
          type: string
          minLength: 2
          maxLength: 20
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
    StoreOperatorAccount:
      type: object
      additionalProperties: false
      required: [accountId, email, phoneNumber, displayName, status]
      properties:
        accountId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        email:
          $ref: "#/components/schemas/Email"
        phoneNumber:
          type: string
          pattern: "^01[016789]-[0-9]{3,4}-[0-9]{4}$"
        displayName:
          type: string
          minLength: 2
          maxLength: 50
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
    ReservationHistoryStatus:
      type: string
      enum: [CONFIRMED, CANCELLED, FULFILLED]
    ReservationHistoryItem:
      type: object
      additionalProperties: false
      required:
        - reservationId
        - storeId
        - storeName
        - serviceDate
        - startTime
        - endTime
        - partySize
        - status
        - createdAt
      properties:
        reservationId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        storeId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        storeName:
          type: string
          minLength: 1
          maxLength: 100
        serviceDate:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalDate"
        startTime:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalTime"
        endTime:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/LocalTime"
        partySize:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/ReservationHistoryStatus"
        cancelledBy:
          type:
            - string
            - "null"
          enum: [CONSUMER, STORE_OPERATOR, null]
        createdAt:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
    ReservationHistoryPageData:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReservationHistoryItem"
        page:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PageMetadata"
    AccountCreatedSuccessResponse:
      $ref: "#/components/schemas/SuccessAccountCreated"
    SuccessAccountCreated:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/AccountCreatedData"
    TokenSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/TokenData"
    CsrfTokenSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/CsrfTokenData"
    NoDataSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/NoData"
    ConsumerAccountSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/ConsumerAccount"
    StoreOperatorAccountSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
