openapi: 3.1.0
info:
  title: MiriYum Admin Monitoring API
  version: 1.0.0
  description: 예약·웨이팅 사건과 연결 원장을 동일 기준 시각으로 조회하는 플랫폼 운영자 계약이다.
  license:
    name: All rights reserved
    identifier: LicenseRef-All-Rights-Reserved
servers:
  - url: /
security: []
paths:
  /api/v1/platform-operators/monitoring-cases:
    x-miriyum-owner-issue: 280
    get:
      tags: [Platform Operator Admin Monitoring]
      summary: 예약·웨이팅 통합 사건 목록 조회
      operationId: listAdminMonitoringCases
      security:
        - platformOperatorBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/CaseTypes"
        - $ref: "#/components/parameters/LifecycleStatuses"
        - $ref: "#/components/parameters/SourceStatuses"
        - $ref: "#/components/parameters/ReconciliationStatuses"
        - $ref: "#/components/parameters/ChangedFrom"
        - $ref: "#/components/parameters/ChangedTo"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 완전하거나 원장별 실패를 명시한 사건 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMonitoringCasePageSuccessResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SourcesUnavailable"
  /api/v1/platform-operators/monitoring-cases/{caseType}/{caseId}:
    x-miriyum-owner-issue: 280
    get:
      tags: [Platform Operator Admin Monitoring]
      summary: 예약·웨이팅 통합 사건 상세 조회
      operationId: getAdminMonitoringCase
      security:
        - platformOperatorBearerAuth: []
      parameters:
        - name: caseType
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AdminMonitoringCaseType"
        - name: caseId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: "reservation-hold:, reservation:, waiting: prefix를 포함한 공개 사건 ID"
        - name: asOf
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: 최소 마스킹 사건 상세 또는 부가 원장 부분 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMonitoringCaseDetailSuccessResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SourcesUnavailable"
components:
  securitySchemes:
    platformOperatorBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    StoreId:
      name: storeId
      in: query
      required: false
      schema:
        type: string
        pattern: "^[1-9][0-9]*$"
    CaseTypes:
      name: caseTypes
      in: query
      required: false
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: "#/components/schemas/AdminMonitoringCaseType"
    LifecycleStatuses:
      name: lifecycleStatuses
      in: query
      required: false
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: "#/components/schemas/AdminMonitoringLifecycleStatus"
    SourceStatuses:
      name: sourceStatuses
      in: query
      required: false
      description: RESERVATION:CONFIRMED처럼 원장 이름으로 한정한 원본 상태
      schema:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^[A-Z_]+:[A-Z_]+$"
    ReconciliationStatuses:
      name: reconciliationStatuses
      in: query
      required: false
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: "#/components/schemas/AdminMonitoringReconciliationStatus"
    ChangedFrom:
      name: changedFrom
      in: query
      required: true
      schema:
        type: string
        format: date-time
    ChangedTo:
      name: changedTo
      in: query
      required: true
      description: changedFrom 이후 최대 31일
      schema:
        type: string
        format: date-time
    PageSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: asOf, 필터 지문과 마지막 평가 후보 seek tuple을 HMAC으로 보호한 문자열
      schema:
        type: string
        minLength: 1
  schemas:
    AdminMonitoringCaseType:
      type: string
      enum: [RESERVATION, WAITING]
    AdminMonitoringLifecycleStatus:
      type: string
      enum: [PENDING, CONFIRMED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW]
    AdminMonitoringSource:
      type: string
      enum: [RESERVATION, RESERVATION_HOLD, MENU_HOLD, PAYMENT, WAITING]
    AdminMonitoringCompleteness:
      type: string
      enum: [COMPLETE, DELAYED, PARTIAL, UNAVAILABLE]
    AdminMonitoringReconciliationStatus:
      type: string
      enum: [MATCHED, REQUIRED, UNKNOWN]
    AdminMonitoringLedgerState:
      type: object
      additionalProperties: false
      required:
        - sourceStatus
        - statusVersion
        - statusChangedAt
      properties:
        sourceStatus:
          type: string
        statusVersion:
          type: integer
          format: int64
          minimum: 0
        statusChangedAt:
          type: string
          format: date-time
        amountMinor:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: Payment 원장에만 존재하는 결제 금액이다.
        refundedAmountMinor:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: Payment 원장에만 존재하는 누적 환불 금액이다.
        currency:
          type: [string, "null"]
          pattern: "^[A-Z]{3}$"
    AdminMonitoringLedgerCell:
      type: object
      additionalProperties: false
      required:
        - source
        - state
        - asOf
        - dataThrough
        - completeness
        - reconciliationStatus
      properties:
        source:
          $ref: "#/components/schemas/AdminMonitoringSource"
        state:
          oneOf:
            - $ref: "#/components/schemas/AdminMonitoringLedgerState"
            - type: "null"
          description: UNAVAILABLE이면 null이며 원본 상태·version·시각을 추측하지 않는다.
        asOf:
          type: string
          format: date-time
        dataThrough:
          type: string
          format: date-time
        completeness:
          $ref: "#/components/schemas/AdminMonitoringCompleteness"
        reconciliationStatus:
          $ref: "#/components/schemas/AdminMonitoringReconciliationStatus"
        historyAvailableFrom:
          type: [string, "null"]
          format: date-time
    AdminMonitoringDependencyFailure:
      type: object
      additionalProperties: false
      required: [source, errorCode, retryable]
      properties:
        source:
          $ref: "#/components/schemas/AdminMonitoringSource"
        errorCode:
          type: string
        retryable:
          type: boolean
    AdminMonitoringLinkedLedgerSummary:
      type: object
      additionalProperties: false
      required: [source, present, completeness, reconciliationStatus]
      properties:
        source:
          $ref: "#/components/schemas/AdminMonitoringSource"
        present:
          type: boolean
        completeness:
          $ref: "#/components/schemas/AdminMonitoringCompleteness"
        reconciliationStatus:
          $ref: "#/components/schemas/AdminMonitoringReconciliationStatus"
    AdminMonitoringCaseSummary:
      type: object
      additionalProperties: false
      required:
        - caseType
        - caseId
        - storeId
        - lifecycleStatus
        - sourceStatus
        - statusChangedAt
        - caseVersion
        - asOf
        - dataThrough
        - completeness
        - reconciliationStatus
        - ledgers
      properties:
        caseType:
          $ref: "#/components/schemas/AdminMonitoringCaseType"
        caseId:
          type: string
        storeId:
          type: string
        lifecycleStatus:
          $ref: "#/components/schemas/AdminMonitoringLifecycleStatus"
        sourceStatus:
          type: string
        statusChangedAt:
          type: string
          format: date-time
        caseVersion:
          type: integer
          format: int64
          minimum: 1
        asOf:
          type: string
          format: date-time
        dataThrough:
          type: string
          format: date-time
        completeness:
          $ref: "#/components/schemas/AdminMonitoringCompleteness"
        reconciliationStatus:
          $ref: "#/components/schemas/AdminMonitoringReconciliationStatus"
        ledgers:
          type: array
          items:
            $ref: "#/components/schemas/AdminMonitoringLinkedLedgerSummary"
    AdminMonitoringCasePage:
      type: object
      additionalProperties: false
      required: [items, asOf, dataThrough, completeness, failures, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminMonitoringCaseSummary"
        asOf:
          type: string
          format: date-time
        dataThrough:
          type: string
          format: date-time
        completeness:
          $ref: "#/components/schemas/AdminMonitoringCompleteness"
        failures:
          type: array
          items:
            $ref: "#/components/schemas/AdminMonitoringDependencyFailure"
        nextCursor:
          type: [string, "null"]
    AdminMonitoringTransition:
      type: object
      additionalProperties: false
      required: [source, resultVersion, afterStatus, occurredAt]
      properties:
        source:
          $ref: "#/components/schemas/AdminMonitoringSource"
        resultVersion:
          type: integer
          format: int64
          minimum: 0
        beforeStatus:
          type: [string, "null"]
        afterStatus:
          type: string
        occurredAt:
          type: string
          format: date-time
    AdminMonitoringMenuItem:
      type: object
      additionalProperties: false
      required: [menuId, displayName, quantity]
      properties:
        menuId:
          type: string
          pattern: "^[1-9][0-9]*$"
        displayName:
          type: string
        quantity:
          type: integer
          minimum: 1
    AdminMonitoringPaymentLedgerEvent:
      type: object
      additionalProperties: false
      required: [eventType, amountMinor, occurredAt]
      properties:
        eventType:
          type: string
        amountMinor:
          type: integer
          format: int64
          minimum: 0
        occurredAt:
          type: string
          format: date-time
    AdminMonitoringPaymentRefund:
      type: object
      additionalProperties: false
      required: [sourceStatus, statusVersion, amountMinor, requestedAt]
      properties:
        sourceStatus:
          type: string
        statusVersion:
          type: integer
          format: int64
          minimum: 0
        amountMinor:
          type: integer
          format: int64
          minimum: 1
        requestedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
    AdminMonitoringCaseDetail:
      type: object
      additionalProperties: false
      required:
        - caseType
        - caseId
        - storeId
        - lifecycleStatus
        - caseVersion
        - asOf
        - dataThrough
        - completeness
        - maskingLevel
        - ledgers
        - history
        - menuItems
        - paymentLedger
        - paymentLedgerTruncated
        - refunds
        - refundsTruncated
        - failures
      properties:
        caseType:
          $ref: "#/components/schemas/AdminMonitoringCaseType"
        caseId:
          type: string
        storeId:
          type: string
        lifecycleStatus:
          $ref: "#/components/schemas/AdminMonitoringLifecycleStatus"
        caseVersion:
          type: integer
          format: int64
          minimum: 1
        asOf:
          type: string
          format: date-time
        dataThrough:
          type: string
          format: date-time
        completeness:
          $ref: "#/components/schemas/AdminMonitoringCompleteness"
        maskingLevel:
          type: string
          enum: [MINIMIZED]
        partySize:
          type: [integer, "null"]
          minimum: 1
        scheduledStartAt:
          type: [string, "null"]
          format: date-time
        scheduledEndAt:
          type: [string, "null"]
          format: date-time
        queueSequence:
          type: [integer, "null"]
          format: int64
          minimum: 1
        ledgers:
          type: array
          items:
            $ref: "#/components/schemas/AdminMonitoringLedgerCell"
        history:
          type: array
          items:
            $ref: "#/components/schemas/AdminMonitoringTransition"
        menuItems:
          type: array
          items:
            $ref: "#/components/schemas/AdminMonitoringMenuItem"
        paymentLedger:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AdminMonitoringPaymentLedgerEvent"
        paymentLedgerTruncated:
          type: boolean
        refunds:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AdminMonitoringPaymentRefund"
        refundsTruncated:
          type: boolean
        failures:
          type: array
          items:
            $ref: "#/components/schemas/AdminMonitoringDependencyFailure"
    AdminMonitoringCasePageSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/AdminMonitoringCasePage"
    AdminMonitoringCaseDetailSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/AdminMonitoringCaseDetail"
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    InvalidRequest:
      description: 잘못된 필터, 손상·불일치·만료 cursor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            InvalidFilter:
              value: {code: MONITORING_001, message: 잘못된 모니터링 필터입니다.}
            InvalidCursor:
              value: {code: MONITORING_002, message: 잘못된 cursor입니다.}
            ExpiredCursor:
              value: {code: MONITORING_003, message: 만료된 cursor입니다.}
    Unauthorized:
      description: 유효한 플랫폼 운영자 세션 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 현재 읽기 권한 또는 상세 사건 배정 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 기능 비활성 또는 정상 조회 후 사건 부재
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SourcesUnavailable:
      description: 두 기본 원장 또는 상세 주 원장을 신뢰 가능하게 조회할 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
