openapi: 3.1.0
info:
  title: MiriYum MVP1 Common Components
  version: 1.0.0
  description: 1차 MVP 기능별 OpenAPI가 참조하는 공통 계약이다.
  license:
    name: All Rights Reserved
    identifier: LicenseRef-All-Rights-Reserved
servers:
  - url: /
security: []
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 계정 namespace가 일치하는 Access JWT를 사용한다.
  schemas:
    PublicId:
      type: string
      pattern: "^[1-9][0-9]*$"
      description: 내부 BIGINT 값을 정밀도 손실 없이 전달하는 불투명 문자열 ID
      examples:
        - "123"
    LocalDate:
      type: string
      format: date
      description: Asia/Seoul 기준 업무 날짜
      examples:
        - "2026-08-01"
    LocalTime:
      type: string
      pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
      description: Asia/Seoul 기준 분 단위 현지 시각
      examples:
        - "14:30"
    OffsetDateTime:
      type: string
      format: date-time
      description: UTC offset를 포함한 특정 시점
      examples:
        - "2026-08-01T14:30:00+09:00"
    SuccessCode:
      type: string
      const: SUCCESS
      description: 모든 일반 JSON 성공 응답의 고정 코드
    SuccessMessage:
      type: string
      minLength: 1
      description: 사용자 안내 문구이며 클라이언트 분기 조건이 아니다.
      examples:
        - 요청 성공
    NoData:
      type: "null"
      description: 반환할 JSON 데이터가 없는 성공 응답의 data 값
    ValidationErrorDetail:
      type: object
      additionalProperties: false
      required:
        - field
        - reason
      properties:
        field:
          type: string
          minLength: 1
          description: 공개 JSON 필드 경로이며 요청 전체 오류는 $를 사용한다.
          examples:
            - "menuSelections[0].quantity"
        reason:
          type: string
          minLength: 1
          description: 거절된 실제 값이나 민감정보를 포함하지 않는 설명
          examples:
            - 1개 이상이어야 합니다.
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          pattern: "^[A-Z]+(?:_[A-Z]+)*_[0-9]{3}$"
          description: 클라이언트가 분기에 사용하는 안정적인 외부 오류 코드
          examples:
            - COMMON_001
        message:
          type: string
          minLength: 1
          description: 사용자에게 표시 가능한 설명이며 분기 조건이 아니다.
          examples:
            - 입력값이 올바르지 않습니다.
        details:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ValidationErrorDetail"
    PageMetadata:
      type: object
      additionalProperties: false
      required:
        - number
        - size
        - totalElements
        - totalPages
        - hasNext
      properties:
        number:
          type: integer
          minimum: 0
          description: 0부터 시작하는 현재 페이지 번호
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        hasNext:
          type: boolean
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 0부터 시작하는 페이지 번호
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: 페이지 크기
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      required: false
      description: 기능별 허용 필드 하나와 방향을 쉼표로 구분한다.
      schema:
        type: string
        pattern: "^[A-Za-z][A-Za-z0-9]*,(?:asc|desc)$"
      example: createdAt,desc
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 같은 인증 주체와 HTTP method·route의 전체 요청을 재전송할 때 최초 결과를 식별하는 표준 UUID. path·query·body가 다른 요청에 같은 키를 재사용하면 409로 거절한다.
      schema:
        type: string
        minLength: 36
        maxLength: 36
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      example: 123e4567-e89b-12d3-a456-426614174000
  headers:
    RetryAfter:
      description: 서버가 계산할 수 있을 때 제공하는 재시도 대기 초
      schema:
        type: integer
        minimum: 0
  responses:
    BadRequest:
      description: 요청 형식 또는 입력값이 올바르지 않음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validationFailed:
              value:
                code: COMMON_001
                message: 입력값이 올바르지 않습니다.
                details:
                  - field: partySize
                    reason: 1명 이상이어야 합니다.
    Unauthorized:
      description: 현재 요청에 사용할 수 있는 인증 자격이 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: AUTH_001
            message: 로그인이 필요합니다.
    Forbidden:
      description: 인증 주체는 확인됐지만 요청한 동작이 허용되지 않음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: AUTH_006
            message: 접근 권한이 없습니다.
    Conflict:
      description: 현재 자원 상태·멱등성·동시성 계약과 충돌
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: COMMON_008
            message: 동시 요청 충돌로 처리하지 못했습니다. 다시 시도해 주세요.
    TooManyRequests:
      description: 요청 제한 초과
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: COMMON_010
            message: 요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.
    InternalServerError:
      description: 예상하지 못한 서버 내부 오류
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: COMMON_011
            message: 서버 내부 오류가 발생했습니다.
    ServiceUnavailable:
      description: 필수 인프라의 일시 장애
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: COMMON_012
            message: 서비스를 일시적으로 사용할 수 없습니다.
