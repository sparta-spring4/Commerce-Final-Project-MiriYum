openapi: 3.1.0
info:
  title: MiriYum Notification API
  version: 1.0.0
  description: Reservation·MenuHold·Pickup·Waiting 기반 소비자 본인 알림 이력과 변경 신호 계약
  license:
    name: All rights reserved
    identifier: LicenseRef-All-Rights-Reserved
servers:
  - url: /
    description: 배포 환경의 동일 origin
security: []
tags:
  - name: Notification
    description: 일반 사용자 본인 알림 이력
paths:
  /api/v1/consumers/me/notifications:
    get:
      tags: [Notification]
      summary: 본인 알림 이력 조회
      operationId: getMyNotificationHistory
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 발생 시각·notificationId 역순의 본인 알림 이력
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationHistorySuccessResponse"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountRestricted"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/consumers/me/notifications/unread-count:
    x-miriyum-runtime-status: contract-only
    x-miriyum-owner-issue: 500
    get:
      tags: [Notification]
      summary: 본인 미확인 알림 개수 조회
      operationId: getMyNotificationUnreadCount
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 본인 공개 IN_APP 전달 완료 알림의 미확인 개수
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationUnreadCountSuccessResponse"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountRestricted"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/consumers/me/notifications/{notificationId}/reads:
    x-miriyum-runtime-status: contract-only
    x-miriyum-owner-issue: 500
    post:
      tags: [Notification]
      summary: 본인 알림 개별 읽음 처리
      operationId: readMyNotification
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          description: 개별 읽음 처리 뒤의 본인 미확인 개수
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationUnreadCountSuccessResponse"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountRestricted"
        "404":
          $ref: "#/components/responses/NotificationNotFound"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/consumers/me/notifications/reads:
    x-miriyum-runtime-status: contract-only
    x-miriyum-owner-issue: 500
    post:
      tags: [Notification]
      summary: 본인 알림 전체 읽음 처리
      operationId: readAllMyNotifications
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 전체 읽음 처리 뒤의 본인 미확인 개수
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationUnreadCountSuccessResponse"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountRestricted"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
  /api/v1/consumers/me/notification-events:
    get:
      tags: [Notification]
      summary: 본인 알림 이력 변경 신호 구독
      description: >-
        Authorization header를 전달하는 fetch streaming으로 연결한다. 연결 직후와 유효한
        Last-Event-ID 재연결 뒤 현재 MySQL high-watermark에 결속된 notifications.changed
        신호를 보내며, 클라이언트는 본인 알림 이력 API를 다시 조회한다.
      operationId: streamMyNotificationChanges
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NotificationLastEventId"
      responses:
        "200":
          description: 본인에게 공개되는 IN_APP 전달 완료 이력의 최소 변경 신호 stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/NotificationChangedEventStream"
        "400":
          $ref: "#/components/responses/InvalidEventCursor"
        "401":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountRestricted"
        "429":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/TooManyRequests"
        "503":
          $ref: "../mvp1-common/openapi.yaml#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      $ref: "../mvp1-common/openapi.yaml#/components/securitySchemes/bearerAuth"
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: occurredAt·notificationId 정렬 경계와 계약 버전을 담은 무결성 보호 opaque cursor
      schema:
        type: string
        minLength: 1
        maxLength: 512
        pattern: "^[A-Za-z0-9_-]+$"
    Size:
      name: size
      in: query
      required: false
      description: 반환할 최대 항목 수
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    NotificationId:
      name: notificationId
      in: path
      required: true
      description: 본인 공개 알림 식별자
      schema:
        $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
    NotificationLastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: >-
        서버가 발급하고 consumer audience·인증 계정·계약 version에 결속한 무결성 보호 opaque
        cursor. 없으면 최초 연결이며 클라이언트가 해석하거나 수정하지 않는다.
      schema:
        type: string
        minLength: 1
        maxLength: 512
        pattern: "^[A-Za-z0-9_-]+$"
  schemas:
    NotificationChangedEventStream:
      type: string
      description: >-
        UTF-8 SSE stream. 업무 event는 notifications.changed이고 id는 다음 Last-Event-ID로
        그대로 재사용할 opaque cursor다. 최초 연결·유효한 재연결의 수렴 신호는 이력 유무나
        변경 여부와 관계없이 현재 MySQL high-watermark 기준으로 한 번 전송하고, 이후
        high-watermark 신호는 공개 이력의 새 IN_APP DELIVERED 또는 읽음 변경이 보이는 경우에
        발생한다. 각 업무 frame은 빈 줄(\n\n)로 종료한다. 신호는 상태 본문이나 전달 성공 근거가
        아니며 수신 뒤 GET /api/v1/consumers/me/notifications와 미확인 개수 API인 GET
        /api/v1/consumers/me/notifications/unread-count를 다시 조회해야 한다. keepalive comment는 업무
        event가 아니며 cursor를 전진시키지 않는다. PENDING·실패·취소 작업은 신호 대상이 아니다.
      example: |+
        id: opaque-notification-cursor
        event: notifications.changed
        data: {}

    NotificationPurpose:
      type: string
      description: RESERVATION_VISIT_COMPLETED와 RESERVATION_NO_SHOW는 예약 종결 상태를 설명하며 결제 결과를 뜻하지 않고 보호된 상세 route 활성화 전 action은 null이다.
      enum:
        - RESERVATION_CONFIRMED
        - RESERVATION_CHANGED
        - RESERVATION_REJECTED
        - RESERVATION_CANCELLED
        - RESERVATION_EXPIRED
        - RESERVATION_VISIT_REMINDER
        - RESERVATION_COORDINATION_REQUIRED
        - RESERVATION_VISIT_COMPLETED
        - RESERVATION_NO_SHOW
        - PICKUP_RESERVATION_CONFIRMED
        - PICKUP_RESERVATION_CANCELLED
        - MENU_HOLD_FULFILLMENT_AT_RISK
        - MENU_SUBSTITUTION_PROPOSED
        - MENU_SUBSTITUTION_ACCEPTED
        - MENU_SUBSTITUTION_REJECTED
        - MENU_SUBSTITUTION_EXPIRED
        - WAITING_ENTRY_IMMINENT
        - WAITING_CALLED
        - WAITING_CANCELLED
        - WAITING_NO_SHOW
        - WAITING_CHECKED_IN
        - WAITING_CLOSED_BY_STORE
    NonTerminalNotificationPurpose:
      allOf:
        - $ref: "#/components/schemas/NotificationPurpose"
        - type: string
          enum:
            - RESERVATION_CONFIRMED
            - RESERVATION_CHANGED
            - RESERVATION_REJECTED
            - RESERVATION_CANCELLED
            - RESERVATION_EXPIRED
            - RESERVATION_VISIT_REMINDER
            - RESERVATION_COORDINATION_REQUIRED
            - PICKUP_RESERVATION_CONFIRMED
            - PICKUP_RESERVATION_CANCELLED
            - MENU_HOLD_FULFILLMENT_AT_RISK
            - MENU_SUBSTITUTION_PROPOSED
            - MENU_SUBSTITUTION_ACCEPTED
            - MENU_SUBSTITUTION_REJECTED
            - MENU_SUBSTITUTION_EXPIRED
            - WAITING_ENTRY_IMMINENT
            - WAITING_CALLED
            - WAITING_CANCELLED
            - WAITING_NO_SHOW
            - WAITING_CHECKED_IN
            - WAITING_CLOSED_BY_STORE
    ReservationTerminalNotificationPurpose:
      allOf:
        - $ref: "#/components/schemas/NotificationPurpose"
        - type: string
          enum:
            - RESERVATION_VISIT_COMPLETED
            - RESERVATION_NO_SHOW
    NotificationResourceType:
      type: string
      enum: [RESERVATION, MENU_HOLD, PICKUP_RESERVATION, MENU_SUBSTITUTION_PROPOSAL, WAITING_TEAM]
    NotificationActionAvailability:
      type: string
      enum: [AVAILABLE, EXPIRED, SUPERSEDED, UNAVAILABLE]
    NotificationResourceRef:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          $ref: "#/components/schemas/NotificationResourceType"
        id:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
    NotificationAction:
      oneOf:
        - $ref: "#/components/schemas/ReservationDetailNotificationAction"
        - $ref: "#/components/schemas/PickupReservationDetailNotificationAction"
        - $ref: "#/components/schemas/MenuSubstitutionReviewNotificationAction"
    ReservationDetailNotificationAction:
      type: object
      additionalProperties: false
      required: [type, resource, availability, expiresAt]
      properties:
        type:
          type: string
          const: RESERVATION_DETAIL
        resource:
          type: object
          additionalProperties: false
          required: [type, id]
          properties:
            type:
              type: string
              const: RESERVATION
            id:
              $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        availability:
          $ref: "#/components/schemas/NotificationActionAvailability"
        expiresAt:
          oneOf:
            - $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
            - type: "null"
          description: 행동 자체의 중앙 만료 시각. null은 별도 시간 만료가 없음을 뜻한다.
    PickupReservationDetailNotificationAction:
      type: object
      additionalProperties: false
      required: [type, resource, availability, expiresAt]
      properties:
        type:
          type: string
          const: PICKUP_RESERVATION_DETAIL
        resource:
          type: object
          additionalProperties: false
          required: [type, id]
          properties:
            type:
              type: string
              const: PICKUP_RESERVATION
            id:
              $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        availability:
          $ref: "#/components/schemas/NotificationActionAvailability"
        expiresAt:
          oneOf:
            - $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
            - type: "null"
          description: 행동 자체의 중앙 만료 시각. null은 별도 시간 만료가 없음을 뜻한다.
    MenuSubstitutionReviewNotificationAction:
      type: object
      additionalProperties: false
      required: [type, resource, availability, expiresAt]
      properties:
        type:
          type: string
          const: MENU_SUBSTITUTION_REVIEW
        resource:
          type: object
          additionalProperties: false
          required: [type, id]
          properties:
            type:
              type: string
              const: MENU_SUBSTITUTION_PROPOSAL
            id:
              $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        availability:
          $ref: "#/components/schemas/NotificationActionAvailability"
        expiresAt:
          oneOf:
            - $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
            - type: "null"
          description: 행동 자체의 중앙 만료 시각. null은 별도 시간 만료가 없음을 뜻한다.
    NotificationHistoryItem:
      type: object
      additionalProperties: false
      required:
        - notificationId
        - purpose
        - title
        - resource
        - occurredAt
        - createdAt
        - deliveredAt
        - readAt
        - action
      properties:
        notificationId:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/PublicId"
        purpose:
          $ref: "#/components/schemas/NotificationPurpose"
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: 승인된 field allowlist로 렌더링한 안전한 제목
        resource:
          $ref: "#/components/schemas/NotificationResourceRef"
        occurredAt:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
        createdAt:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
        deliveredAt:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
          description: IN_APP 전달 성공이 중앙 기록된 필수 시각
        readAt:
          oneOf:
            - $ref: "../mvp1-common/openapi.yaml#/components/schemas/OffsetDateTime"
            - type: "null"
          description: null이면 미확인이고, 값이 있으면 서버가 확정한 최초 읽음 시각
        action:
          oneOf:
            - $ref: "#/components/schemas/NotificationAction"
            - type: "null"
          description: 안전한 행동 대상이 없으면 null
      oneOf:
        - $ref: "#/components/schemas/NonTerminalNotificationHistoryItem"
        - $ref: "#/components/schemas/ReservationTerminalNotificationHistoryItem"
    NonTerminalNotificationHistoryItem:
      type: object
      required: [purpose, action]
      properties:
        purpose:
          $ref: "#/components/schemas/NonTerminalNotificationPurpose"
        action:
          oneOf:
            - $ref: "#/components/schemas/NotificationAction"
            - type: "null"
          description: 안전한 행동 대상이 없으면 null
    ReservationTerminalNotificationHistoryItem:
      type: object
      required: [purpose, action]
      properties:
        purpose:
          $ref: "#/components/schemas/ReservationTerminalNotificationPurpose"
        action:
          type: "null"
          description: 예약 방문 완료·노쇼 목적은 보호된 상세 route 활성화 전 항상 null
    NotificationHistoryPageData:
      type: object
      additionalProperties: false
      required: [items, hasNext, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/NotificationHistoryItem"
        hasNext:
          type: boolean
        nextCursor:
          type: [string, "null"]
          minLength: 1
          maxLength: 512
          pattern: "^[A-Za-z0-9_-]+$"
          description: 다음 페이지가 없으면 null
    NotificationHistorySuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/NotificationHistoryPageData"
    NotificationUnreadCountData:
      type: object
      additionalProperties: false
      required: [unreadCount]
      properties:
        unreadCount:
          type: integer
          format: int64
          minimum: 0
          description: 본인 공개 IN_APP 전달 완료 알림 중 readAt이 없는 건수
    NotificationUnreadCountSuccessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessCode"
        message:
          $ref: "../mvp1-common/openapi.yaml#/components/schemas/SuccessMessage"
        data:
          $ref: "#/components/schemas/NotificationUnreadCountData"
  responses:
    InvalidEventCursor:
      description: Last-Event-ID 형식·무결성 또는 consumer 계정 결속이 유효하지 않음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: COMMON_001
            message: 입력값이 올바르지 않습니다.
    InvalidQuery:
      description: cursor 또는 size가 조회 계약에 맞지 않음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          examples:
            invalidCursor:
              value:
                code: NOTIFICATION_001
                message: 알림 이력 커서가 올바르지 않습니다.
            invalidSize:
              value:
                code: COMMON_001
                message: 입력값이 올바르지 않습니다.
    AccountRestricted:
      description: 현재 일반 사용자 계정 상태가 이력 조회를 허용하지 않음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: AUTH_011
            message: 현재 계정 상태로 이용할 수 없습니다.
    NotificationNotFound:
      description: 본인 공개 이력에 속한 알림을 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "../mvp1-common/openapi.yaml#/components/schemas/ErrorResponse"
          example:
            code: NOTIFICATION_003
            message: 알림을 찾을 수 없습니다.
