name: Staging Load-Test Control

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Apply a fixed staging load-test, SSE, or Valkey control"
        required: true
        type: choice
        options:
          - enable-load-test
          - disable-load-test
          - enable-sse
          - disable-sse
          - safe-recovery
          - interrupt-valkey
          - recover-valkey
      image_tag:
        description: "Existing immutable 40-character Git SHA image tag to redeploy"
        required: true
        type: string
      rendezvous_issue:
        description: "Issue number for interrupt-valkey rendezvous only"
        required: false
        default: ""
        type: string
      rendezvous_id:
        description: "One-time UUID for interrupt-valkey rendezvous only"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read
  deployments: write
  id-token: write
  issues: write

concurrency:
  group: staging-load-test-control
  cancel-in-progress: false

jobs:
  validate:
    name: validate-staging-load-test-control-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted validation revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate fixed action and immutable SHA
        env:
          ACTION: ${{ inputs.action }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          RENDEZVOUS_ISSUE: ${{ inputs.rendezvous_issue }}
          RENDEZVOUS_ID: ${{ inputs.rendezvous_id }}
        run: |
          node - <<'NODE'
          const action = process.env.ACTION || '';
          const imageTag = process.env.IMAGE_TAG || '';
          const rendezvousIssue = process.env.RENDEZVOUS_ISSUE || '';
          const rendezvousId = (process.env.RENDEZVOUS_ID || '').toLowerCase();
          const supportedActions = new Set([
            'enable-load-test',
            'disable-load-test',
            'enable-sse',
            'disable-sse',
            'safe-recovery',
            'interrupt-valkey',
            'recover-valkey',
          ]);

          if (!supportedActions.has(action)) {
            throw new Error(`Unsupported staging load-test action: ${action}`);
          }
          if ((action === 'interrupt-valkey' || action === 'recover-valkey') && process.env.GITHUB_REF !== 'refs/heads/dev') {
            throw new Error('Staging Valkey controls must run from refs/heads/dev.');
          }
          if (!/^[0-9a-f]{40}$/.test(imageTag)) {
            throw new Error('Invalid immutable image tag. A lowercase 40-character Git SHA is required.');
          }
          if (action === 'interrupt-valkey') {
            if (!/^[1-9][0-9]{0,9}$/.test(rendezvousIssue)
                || !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(rendezvousId)) {
              throw new Error('interrupt-valkey requires a positive rendezvous Issue and standard UUID.');
            }
          } else if (rendezvousIssue !== '' || rendezvousId !== '') {
            throw new Error('Rendezvous inputs are required only for interrupt-valkey.');
          }
          NODE

  deploy:
    name: apply-staging-load-test-control
    needs: validate
    if: ${{ inputs.action != 'interrupt-valkey' && inputs.action != 'recover-valkey' }}
    uses: ./.github/workflows/backend-cd.yml
    with:
      image_tag: ${{ inputs.image_tag }}
      rate_limit_exception: ${{ inputs.action == 'enable-load-test' && 'enable' || inputs.action == 'disable-load-test' && 'disable' || inputs.action == 'safe-recovery' && 'disable' || 'preserve' }}
      load_test_source_ip: ""
      runtime_recovery_mode: ${{ inputs.action == 'safe-recovery' && 'safe-disable' || 'preserve' }}
      runtime_config_mode: ${{ inputs.action == 'enable-sse' && 'enable' || inputs.action == 'disable-sse' && 'disable' || 'preserve' }}
    secrets: inherit

  valkey-control:
    name: apply-staging-valkey-control
    needs: validate
    if: ${{ inputs.action == 'interrupt-valkey' || inputs.action == 'recover-valkey' }}
    uses: ./.github/workflows/staging-valkey-control.yml
    with:
      action: ${{ inputs.action == 'interrupt-valkey' && 'interrupt' || 'recover' }}
      image_tag: ${{ inputs.image_tag }}
      rendezvous_issue: ${{ inputs.rendezvous_issue }}
      rendezvous_id: ${{ inputs.rendezvous_id }}
    secrets: inherit

  disable-after-failed-enable:
    name: disable-after-failed-enable
    needs: [validate, deploy]
    if: ${{ always() && (inputs.action == 'enable-load-test' || inputs.action == 'enable-sse') && (needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled') }}
    uses: ./.github/workflows/backend-cd.yml
    with:
      image_tag: ${{ inputs.image_tag }}
      rate_limit_exception: ${{ inputs.action == 'enable-load-test' && 'disable' || 'preserve' }}
      runtime_recovery_mode: preserve
      runtime_config_mode: preserve
      cancel_ssm_command_id: ${{ needs.deploy.outputs.ssm_command_id }}
    secrets: inherit
