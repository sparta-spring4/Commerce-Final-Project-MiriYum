# CI를 통과한 dev 리비전을 ARM64 이미지로 빌드하고 앱 비밀값 없이 SSM으로 배포한다.
name: Backend CD (Staging)

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Deploy an existing immutable 40-character Git SHA image tag"
        required: true
        type: string
      rate_limit_exception:
        description: "Staging k6 rate-limit exception: preserve, enable, or disable"
        required: false
        default: preserve
        type: string
      load_test_source_ip:
        description: "Public IPv4 address permitted only while staging load tests run"
        required: false
        default: ""
        type: string
      runtime_recovery_mode:
        description: "Fixed staging runtime recovery mode"
        required: false
        default: preserve
        type: string
      runtime_config_mode:
        description: "Staging runtime config: preserve, enable, or disable"
        required: false
        default: preserve
        type: string
      cancel_ssm_command_id:
        description: "Previously started SSM command that must reach a terminal state before this control deployment runs"
        required: false
        default: ""
        type: string
    outputs:
      ssm_command_id:
        description: "SSM command ID for the deployment invocation"
        value: ${{ jobs.deploy.outputs.ssm_command_id }}
  workflow_run:
    workflows: ["Backend CI"]
    branches: [dev]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Deploy an existing immutable 40-character Git SHA image tag"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  # 진행 중인 배포는 취소하지 않는다. 새 이미지는 기존 health 확인이 끝날 때까지 대기한다.
  group: backend-cd-staging
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
  EC2_INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
  BACKEND_DEPLOYMENT_ENVIRONMENT: staging-backend
  NOTIFICATION_READ_MINIMUM_COMPATIBLE_SHA: 515531e122ebbce13d8eead4a3ff15a94c25e0b3

jobs:
  verify-source:
    name: verify-staging-deployment-source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      deployments: read
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'dev' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
       github.ref == 'refs/heads/dev')
    outputs:
      deployable: ${{ steps.source.outputs.deployable }}

    steps:
      - name: Checkout automatic deployment revision
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify automatic deployment uses the current dev revision
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            current_dev_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq '.object.sha')

            if [ "$current_dev_sha" != "$WORKFLOW_SHA" ]; then
              echo "deployable=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping stale CI revision $WORKFLOW_SHA; current dev is $current_dev_sha."
              exit 0
            fi

            # 같은 dev SHA의 frontend CI가 성공한 뒤에만 same-origin runtime을 배포한다.
            for ((attempt = 0; attempt < 60; attempt++)); do
              frontend_conclusion=$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/frontend-ci.yml/runs?head_sha=$WORKFLOW_SHA&event=push&per_page=100" \
                --jq '[.workflow_runs[] | select(.head_branch == "dev") | .conclusion] | first // ""')

              case "$frontend_conclusion" in
                success)
                  break
                  ;;
                failure|cancelled|timed_out|action_required)
                  echo "::error::Frontend CI did not succeed for $WORKFLOW_SHA: $frontend_conclusion"
                  exit 1
                  ;;
              esac
              sleep 10
            done

            if [ "$frontend_conclusion" != "success" ]; then
              echo "::error::Frontend CI did not complete successfully for $WORKFLOW_SHA within 10 minutes."
              exit 1
            fi

            last_deployed_sha=$(gh api \
              "repos/$GITHUB_REPOSITORY/deployments?environment=$BACKEND_DEPLOYMENT_ENVIRONMENT&per_page=100" \
              --jq 'sort_by(.created_at) | reverse | .[] | [.id, .sha] | @tsv' \
              | while IFS=$'\t' read -r deployment_id deployment_sha; do
                  state=$(gh api \
                    "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=1" \
                    --jq '.[0].state // ""')
                  if [ "$state" = "success" ]; then
                    printf '%s' "$deployment_sha"
                    break
                  fi
                done)

            if [ -n "$last_deployed_sha" ]; then
              git fetch --no-tags --depth=1 origin "$last_deployed_sha"
              changed_files=$(git diff --name-only "$last_deployed_sha" "$WORKFLOW_SHA")
            else
              empty_tree=$(git hash-object -t tree /dev/null)
              changed_files=$(git diff --name-only "$empty_tree" "$WORKFLOW_SHA")
            fi

            deployable=$(printf '%s\n' "$changed_files" | python3 scripts/should-deploy-backend.py)
            echo "deployable=$deployable" >> "$GITHUB_OUTPUT"

            if [ "$deployable" != "true" ]; then
              echo "::notice::Skipping staging CD because the revision has no backend deployment input changes."
            fi
            exit 0
          fi

          echo "deployable=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: build-and-deploy-backend-staging
    needs: verify-source
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # staging Environment의 변수와 배포 이력을 사용한다. 운영 Environment는 이 워크플로에서 사용하지 않는다.
    environment: staging
    permissions:
      contents: read
      id-token: write
      deployments: write
    if: needs.verify-source.outputs.deployable == 'true'
    outputs:
      ssm_command_id: ${{ steps.ssm.outputs.command_id }}

    steps:
      - name: Validate deployment configuration
        env:
          ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
        run: |
          for value in "$AWS_REGION" "$ECR_REPOSITORY" "$EC2_INSTANCE_ID" "$ROLE_TO_ASSUME"; do
            if [ -z "$value" ]; then
              echo "::error::Required GitHub Actions variable is not configured."
              exit 1
            fi
          done

      - name: Select immutable image tag
        id: image
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_TAG: ${{ inputs.image_tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            image_tag="$WORKFLOW_SHA"
          else
            image_tag="$MANUAL_TAG"
          fi

          if ! [[ "$image_tag" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Only a full 40-character Git SHA image tag can be deployed."
            exit 1
          fi

          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted deployment control revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0

      - name: Preserve trusted notification read deployment controls
        run: |
          cp scripts/test-notification-read-deployment-gate.py \
            "$RUNNER_TEMP/notification-read-deployment-gate.py"
          cp deploy/deploy.sh "$RUNNER_TEMP/notification-read-deploy.sh"
          cp scripts/validate-staging-load-test-source-ip.js \
            "$RUNNER_TEMP/validate-staging-load-test-source-ip.js"

      # Immutable image 태그는 검증용 Git 객체로만 가져온다. 수동 재배포에서도
      # workflow를 실행한 dev의 최신 배포 파일을 사용해야 한다.
      - name: Fetch selected image revision
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: git fetch --no-tags origin "$IMAGE_TAG"

      - name: Verify notification read minimum compatible writer revision
        env:
          DEPLOY_SHA: ${{ steps.image.outputs.tag }}
        run: |
          python3 "$RUNNER_TEMP/notification-read-deployment-gate.py" verify-ancestor \
            --minimum-sha "$NOTIFICATION_READ_MINIMUM_COMPATIBLE_SHA" \
            --candidate-sha "$DEPLOY_SHA"

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          # IAM/OIDC 설정 오류는 장시간 재시도하지 않고, 일시적 AWS 오류에만 한 번 재시도한다.
          retry-max-attempts: 2

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      # SSM 단계만 실패한 실행을 재시작할 때 immutable SHA 태그를 다시 push하지 않는다.
      - name: Check immutable ECR image exists
        id: ecr-image
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          if ! image_count=$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'length(images)' \
            --output text); then
            echo "::error::ECR image lookup failed. The staging CD role requires ecr:BatchGetImage on $ECR_REPOSITORY."
            exit 1
          fi

          if [ "$image_count" = "1" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing immutable ECR image tag: $IMAGE_TAG"
          else
            if [ "$EVENT_NAME" != "workflow_run" ]; then
              echo "::error::Manual or reusable deployment requires an existing immutable ECR image tag: $IMAGE_TAG."
              exit 1
            fi

            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check immutable frontend ECR image exists
        id: frontend-image
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          frontend_tag="${IMAGE_TAG}-frontend"
          if ! image_count=$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$frontend_tag" \
            --query 'length(images)' \
            --output text); then
            echo "::error::Frontend ECR image lookup failed. The staging CD role requires ecr:BatchGetImage on $ECR_REPOSITORY."
            exit 1
          fi

          if [ "$image_count" = "1" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing immutable frontend ECR image tag: $frontend_tag"
          else
            if [ "$EVENT_NAME" != "workflow_run" ]; then
              echo "::error::Manual or reusable deployment requires an existing immutable frontend ECR image tag: $frontend_tag."
              exit 1
            fi

            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU for ARM64 builds
        if: github.event_name == 'workflow_run'
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_run'
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and push ARM64 backend image
        if: github.event_name == 'workflow_run' && steps.ecr-image.outputs.exists != 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ARM64 frontend image
        if: github.event_name == 'workflow_run' && steps.frontend-image.outputs.exists != 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }}-frontend
          build-args: |
            VITE_KAKAO_MAP_APP_KEY=${{ vars.STAGING_KAKAO_MAP_APP_KEY }}
            MIRIYUM_PORTONE_STORE_ID=${{ vars.MIRIYUM_PORTONE_STORE_ID }}
            MIRIYUM_PORTONE_CHANNEL_KEY=${{ vars.MIRIYUM_PORTONE_CHANNEL_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record backend deployment marker
        id: backend-deployment
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          deployment_response=$(jq -n \
            --arg ref "$IMAGE_TAG" \
            --arg environment "$BACKEND_DEPLOYMENT_ENVIRONMENT" \
            '{ref: $ref, environment: $environment, description: ("Backend image " + $ref), auto_merge: false, required_contexts: []}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input -)

          deployment_id=$(jq -er --arg image_tag "$IMAGE_TAG" '
            if .sha != $image_tag then
              error("Deployment response SHA does not match selected image tag")
            elif (.id | type) != "number" then
              error("Deployment response did not include a numeric id")
            else
              .id
            end
          ' <<< "$deployment_response")

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
            --field state=in_progress \
            --field environment="$BACKEND_DEPLOYMENT_ENVIRONMENT" \
            --field description="Backend deployment started for image $IMAGE_TAG" \
            >/dev/null

          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Upload deployment files with SSM
        id: ssm
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          RATE_LIMIT_EXCEPTION: ${{ inputs.rate_limit_exception || 'preserve' }}
          RUNTIME_RECOVERY_MODE: ${{ inputs.runtime_recovery_mode || 'preserve' }}
          RUNTIME_CONFIG_MODE: ${{ inputs.runtime_config_mode || 'preserve' }}
          STAGING_LOAD_TEST_SOURCE_IP: ${{ inputs.rate_limit_exception == 'enable' && (inputs.load_test_source_ip || secrets.MIRIYUM_STAGING_LOAD_TEST_SOURCE_IP) || '' }}
          CANCEL_SSM_COMMAND_ID: ${{ inputs.cancel_ssm_command_id || '' }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          case "$RUNTIME_RECOVERY_MODE" in
            preserve|safe-disable)
              ;;
            *)
              echo "::error::Unsupported runtime recovery mode: $RUNTIME_RECOVERY_MODE"
              exit 1
              ;;
          esac

          case "$RUNTIME_CONFIG_MODE" in
            preserve|enable|disable)
              ;;
            *)
              echo "::error::Unsupported runtime config mode: $RUNTIME_CONFIG_MODE"
              exit 1
              ;;
          esac

          case "$RATE_LIMIT_EXCEPTION" in
            preserve|disable)
              ;;
            enable)
              if ! node "$RUNNER_TEMP/validate-staging-load-test-source-ip.js" "$STAGING_LOAD_TEST_SOURCE_IP"; then
                echo "::error::Invalid staging load-test source IP secret."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported rate-limit exception mode: $RATE_LIMIT_EXCEPTION"
              exit 1
              ;;
          esac

          if [ "$RATE_LIMIT_EXCEPTION" != "preserve" ] || [ "$RUNTIME_RECOVERY_MODE" != "preserve" ] || [ "$RUNTIME_CONFIG_MODE" != "preserve" ] || [ -n "$CANCEL_SSM_COMMAND_ID" ]; then
            case "$CALLER_WORKFLOW_REF" in
              "$GITHUB_REPOSITORY/.github/workflows/staging-load-test-control.yml@"*)
                ;;
              *)
                echo "::error::Non-preserve staging control inputs are allowed only from Staging Load-Test Control."
                exit 1
                ;;
            esac
          fi

          if [ -n "$CANCEL_SSM_COMMAND_ID" ]; then
            if ! [[ "$CANCEL_SSM_COMMAND_ID" =~ ^[0-9a-f-]{36}$ ]]; then
              echo "::error::Invalid SSM command ID supplied for cancellation."
              exit 1
            fi

            aws ssm cancel-command --command-id "$CANCEL_SSM_COMMAND_ID"
            for ((attempt = 0; attempt < 90; attempt++)); do
              cancelled_status=$(aws ssm get-command-invocation \
                --command-id "$CANCEL_SSM_COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query 'Status' \
                --output text 2>/dev/null || true)

              case "$cancelled_status" in
                Success|Failed|Cancelled|TimedOut)
                  echo "Original SSM command reached terminal state: $cancelled_status"
                  break
                  ;;
                Pending|InProgress|Delayed|Cancelling)
                  sleep 10
                  ;;
                *)
                  echo "::error::Could not determine terminal state for original SSM command."
                  exit 1
                  ;;
              esac
            done

            if [[ "${cancelled_status:-}" != "Success" && "${cancelled_status:-}" != "Failed" && "${cancelled_status:-}" != "Cancelled" && "${cancelled_status:-}" != "TimedOut" ]]; then
              echo "::error::Original SSM command did not reach a terminal state within 15 minutes."
              exit 1
            fi
          fi

          load_test_source_ip_base64=''
          if [ "$RATE_LIMIT_EXCEPTION" = "enable" ]; then
            load_test_source_ip_base64=$(printf %s "$STAGING_LOAD_TEST_SOURCE_IP" | base64 --wrap=0)
          fi
          # 실행 .env는 EC2의 제한된 권한으로만 유지하므로 의도적으로 전송 대상에서 제외한다.
          compose_base64=$(base64 --wrap=0 deploy/docker-compose.prod.yml)
          nginx_http_base64=$(base64 --wrap=0 deploy/nginx/templates/http.conf.template)
          nginx_https_base64=$(base64 --wrap=0 deploy/nginx/templates/https.conf.template)
          nginx_sse_base64=$(base64 --wrap=0 deploy/nginx/templates/snippets/sse-location.conf)
          nginx_entrypoint_base64=$(base64 --wrap=0 deploy/nginx/entrypoint/40-select-server-config.sh)
          script_base64=$(base64 --wrap=0 "$RUNNER_TEMP/notification-read-deploy.sh")
          certbot_script_base64=$(base64 --wrap=0 deploy/certbot.sh)
          cloudwatch_base64=$(base64 --wrap=0 deploy/monitoring/cloudwatch-agent-config.json)
          valkey_memory_metrics_base64=$(base64 --wrap=0 deploy/monitoring/publish-valkey-memory-metrics.sh)
          valkey_memory_service_base64=$(base64 --wrap=0 deploy/monitoring/miriyum-valkey-memory-metrics.service)
          valkey_memory_timer_base64=$(base64 --wrap=0 deploy/monitoring/miriyum-valkey-memory-metrics.timer)
          backend_container_metrics_base64=$(base64 --wrap=0 deploy/monitoring/publish-backend-container-metrics.sh)
          backend_container_metrics_service_base64=$(base64 --wrap=0 deploy/monitoring/miriyum-backend-container-metrics.service)
          backend_container_metrics_timer_base64=$(base64 --wrap=0 deploy/monitoring/miriyum-backend-container-metrics.timer)
          image_uri="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          frontend_image_uri="$ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}-frontend"

          cat > ssm-command.json <<EOF
          {
            "DocumentName": "AWS-RunShellScript",
            "InstanceIds": ["$EC2_INSTANCE_ID"],
            "TimeoutSeconds": 900,
            "Parameters": {
              "commands": [
                "set -Eeuo pipefail",
                "backup_dir=\$(mktemp -d); cp /opt/miriyum/.env \"\$backup_dir/.env\"; cp /opt/miriyum/docker-compose.prod.yml \"\$backup_dir/backup-compose.yml\"; cp -a /opt/miriyum/nginx \"\$backup_dir/nginx\"; previous_backend_id=\$(BACKEND_IMAGE='$image_uri' FRONTEND_IMAGE='$frontend_image_uri' docker compose --env-file /opt/miriyum/.env -f /opt/miriyum/docker-compose.prod.yml ps -q backend); previous_frontend_id=\$(BACKEND_IMAGE='$image_uri' FRONTEND_IMAGE='$frontend_image_uri' docker compose --env-file /opt/miriyum/.env -f /opt/miriyum/docker-compose.prod.yml ps -q frontend); previous_backend_image=''; previous_frontend_image=''; if [ -n \"\$previous_backend_id\" ]; then previous_backend_image=\$(docker inspect --format '{{.Config.Image}}' \"\$previous_backend_id\"); fi; if [ -n \"\$previous_frontend_id\" ]; then previous_frontend_image=\$(docker inspect --format '{{.Config.Image}}' \"\$previous_frontend_id\"); fi",
                "backup_env=\"\$backup_dir/.env\"; restore_env() { status=\$?; trap - EXIT HUP INT TERM; if [ \"\$status\" -ne 0 ]; then cp \"\$backup_env\" /opt/miriyum/.env; cp \"\$backup_dir/backup-compose.yml\" /opt/miriyum/docker-compose.prod.yml; rm -rf /opt/miriyum/nginx; cp -a \"\$backup_dir/nginx\" /opt/miriyum/nginx; case '$RUNTIME_RECOVERY_MODE' in safe-disable) sed -i '/^MIRIYUM_STAGING_LOAD_TEST_SOURCE_IP=/d; /^MIRIYUM_RUNTIME_CONFIG_ENABLED=/d; /^MIRIYUM_PAYMENT_ENABLED=/d; /^MIRIYUM_STORAGE_S3_ENABLED=/d; /^MIRIYUM_STORE_SEARCH_LLM_ENABLED=/d' /opt/miriyum/.env; printf '\nMIRIYUM_RUNTIME_CONFIG_ENABLED=false\nMIRIYUM_PAYMENT_ENABLED=false\nMIRIYUM_STORAGE_S3_ENABLED=false\nMIRIYUM_STORE_SEARCH_LLM_ENABLED=false\n' >> /opt/miriyum/.env ;; esac; case '$RUNTIME_CONFIG_MODE' in disable) sed -i '/^MIRIYUM_RUNTIME_CONFIG_ENABLED=/d' /opt/miriyum/.env; printf '\nMIRIYUM_RUNTIME_CONFIG_ENABLED=false\n' >> /opt/miriyum/.env ;; esac; if [ -n \"\$previous_backend_image\" ] && [ -n \"\$previous_frontend_image\" ]; then recovery_status=0; BACKEND_IMAGE=\"\$previous_backend_image\" FRONTEND_IMAGE=\"\$previous_frontend_image\" docker compose --env-file /opt/miriyum/.env -f \"\$backup_dir/backup-compose.yml\" up -d --force-recreate --remove-orphans || recovery_status=\$?; if [ \"\$recovery_status\" -eq 0 ]; then recovery_status=1; for ((recovery_attempt=0; recovery_attempt < 30; recovery_attempt++)); do if curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health >/dev/null; then recovery_status=0; break; fi; sleep 3; done; if [ \"\$recovery_status\" -ne 0 ]; then echo 'Recovered backend did not become healthy.' >&2; fi; fi; if [ \"\$recovery_status\" -ne 0 ]; then echo 'Failed to recover the previous staging runtime after deployment failure.' >&2; fi; fi; fi; rm -rf \"\$backup_dir\"; exit \"\$status\"; }; trap restore_env EXIT HUP INT TERM",
                "install -d -m 0755 /opt/miriyum/nginx/templates/snippets /opt/miriyum/nginx/entrypoint",
                "echo '$compose_base64' | base64 --decode > /opt/miriyum/docker-compose.prod.yml",
                "echo '$nginx_http_base64' | base64 --decode > /opt/miriyum/nginx/templates/http.conf.template",
                "echo '$nginx_https_base64' | base64 --decode > /opt/miriyum/nginx/templates/https.conf.template",
                "echo '$nginx_sse_base64' | base64 --decode > /opt/miriyum/nginx/templates/snippets/sse-location.conf",
                "echo '$nginx_entrypoint_base64' | base64 --decode > /opt/miriyum/nginx/entrypoint/40-select-server-config.sh",
                "echo '$script_base64' | base64 --decode > /opt/miriyum/deploy.sh",
                "echo '$certbot_script_base64' | base64 --decode > /opt/miriyum/certbot.sh",
                "install -d -m 0755 /opt/miriyum/monitoring",
                "echo '$cloudwatch_base64' | base64 --decode > /opt/miriyum/monitoring/cloudwatch-agent.json",
                "echo '$valkey_memory_metrics_base64' | base64 --decode > /opt/miriyum/monitoring/publish-valkey-memory-metrics.sh",
                "echo '$valkey_memory_service_base64' | base64 --decode > /etc/systemd/system/miriyum-valkey-memory-metrics.service",
                "echo '$valkey_memory_timer_base64' | base64 --decode > /etc/systemd/system/miriyum-valkey-memory-metrics.timer",
                "echo '$backend_container_metrics_base64' | base64 --decode > /opt/miriyum/monitoring/publish-backend-container-metrics.sh",
                "echo '$backend_container_metrics_service_base64' | base64 --decode > /etc/systemd/system/miriyum-backend-container-metrics.service",
                "echo '$backend_container_metrics_timer_base64' | base64 --decode > /etc/systemd/system/miriyum-backend-container-metrics.timer",
                "if [ -x /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl ]; then /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/miriyum/monitoring/cloudwatch-agent.json -s; fi",
                "chmod 700 /opt/miriyum/deploy.sh",
                "chmod 700 /opt/miriyum/monitoring/publish-valkey-memory-metrics.sh",
                "chmod 700 /opt/miriyum/monitoring/publish-backend-container-metrics.sh",
                "systemctl daemon-reload",
                "systemd-analyze verify /etc/systemd/system/miriyum-valkey-memory-metrics.service /etc/systemd/system/miriyum-valkey-memory-metrics.timer",
                "systemd-analyze verify /etc/systemd/system/miriyum-backend-container-metrics.service /etc/systemd/system/miriyum-backend-container-metrics.timer",
                "systemctl enable --now miriyum-valkey-memory-metrics.timer",
                "systemctl enable --now miriyum-backend-container-metrics.timer",
                 "chmod 700 /opt/miriyum/certbot.sh",
                 "chmod 755 /opt/miriyum/nginx/entrypoint/40-select-server-config.sh",
                 "case '$RUNTIME_RECOVERY_MODE' in safe-disable) sed -i '/^MIRIYUM_RUNTIME_CONFIG_ENABLED=/d; /^MIRIYUM_PAYMENT_ENABLED=/d; /^MIRIYUM_STORAGE_S3_ENABLED=/d; /^MIRIYUM_STORE_SEARCH_LLM_ENABLED=/d' /opt/miriyum/.env; printf '\\nMIRIYUM_RUNTIME_CONFIG_ENABLED=false\\nMIRIYUM_PAYMENT_ENABLED=false\\nMIRIYUM_STORAGE_S3_ENABLED=false\\nMIRIYUM_STORE_SEARCH_LLM_ENABLED=false\\n' >> /opt/miriyum/.env; echo 'Approved staging runtime flags disabled.' ;; preserve) echo 'Staging runtime flags preserved.' ;; esac",
                 "case '$RUNTIME_CONFIG_MODE' in enable) sed -i '/^MIRIYUM_RUNTIME_CONFIG_ENABLED=/d' /opt/miriyum/.env; printf '\\nMIRIYUM_RUNTIME_CONFIG_ENABLED=true\\n' >> /opt/miriyum/.env; echo 'Staging runtime config enabled.' ;; disable) sed -i '/^MIRIYUM_RUNTIME_CONFIG_ENABLED=/d' /opt/miriyum/.env; printf '\\nMIRIYUM_RUNTIME_CONFIG_ENABLED=false\\n' >> /opt/miriyum/.env; echo 'Staging runtime config disabled.' ;; preserve) : ;; esac",
                 "case '$RATE_LIMIT_EXCEPTION' in enable) source_ip=\$(printf %s '$load_test_source_ip_base64' | base64 --decode); sed -i '/^MIRIYUM_STAGING_LOAD_TEST_SOURCE_IP=/d' /opt/miriyum/.env; printf '\\nMIRIYUM_STAGING_LOAD_TEST_SOURCE_IP=%s\\n' \"\$source_ip\" >> /opt/miriyum/.env; unset source_ip; echo 'Staging load-test source IP enabled.' ;; disable) sed -i '/^MIRIYUM_STAGING_LOAD_TEST_SOURCE_IP=/d' /opt/miriyum/.env; echo 'Staging load-test source IP disabled.' ;; preserve) : ;; esac",
                 "AWS_REGION='$AWS_REGION' BACKEND_IMAGE='$image_uri' FRONTEND_IMAGE='$frontend_image_uri' /opt/miriyum/deploy.sh",
                 "trap - EXIT HUP INT TERM; rm -rf \"\$backup_dir\""
              ]
            }
          }
          EOF

          command_id=$(aws ssm send-command --cli-input-json file://ssm-command.json --query 'Command.CommandId' --output text)
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM deployment result
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          for ((attempt = 0; attempt < 90; attempt++)); do
            status=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "::error::SSM deployment did not finish within 15 minutes. Command: $COMMAND_ID"
          exit 1

      - name: Mark backend deployment successful
        if: success()
        env:
          DEPLOYMENT_ID: ${{ steps.backend-deployment.outputs.deployment_id }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            --field state=success \
            --field environment="$BACKEND_DEPLOYMENT_ENVIRONMENT" \
            --field description="Backend image $IMAGE_TAG deployed successfully" \
            >/dev/null

      - name: Mark backend deployment failed
        if: failure() && steps.backend-deployment.outputs.deployment_id != ''
        env:
          DEPLOYMENT_ID: ${{ steps.backend-deployment.outputs.deployment_id }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            --field state=failure \
            --field environment="$BACKEND_DEPLOYMENT_ENVIRONMENT" \
            --field description="Backend image $IMAGE_TAG deployment failed" \
            >/dev/null
