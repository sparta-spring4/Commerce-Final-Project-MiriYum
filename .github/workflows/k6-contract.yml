name: k6 Contract

on:
  pull_request:
    branches: [dev, mvp2, main]
    paths:
      - 'performance/k6/**'
      - '.github/workflows/k6-contract.yml'
  push:
    branches: [dev, main]
    paths:
      - 'performance/k6/**'
      - '.github/workflows/k6-contract.yml'

permissions:
  contents: read

concurrency:
  group: k6-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: k6-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run isolated k6 contracts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(performance/k6/tests/*.js)
          if (( ${#tests[@]} == 0 )); then
            echo "No k6 contract tests found" >&2
            exit 1
          fi
          for test in "${tests[@]}"; do
            echo "Running $test"
            docker run --rm --network none \
              -v "$PWD/performance/k6:/scripts:ro" \
              grafana/k6:2.1.0 \
              run "/scripts/tests/$(basename "$test")"
          done
