# main CI 자동 배포는 현재 ECS 설정을 보존하고, 승인된 수동 배포만 SSE runtime을 전환한다.
name: Backend CD (Production ECS)

on:
  workflow_run:
    workflows: ["Backend CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Deploy an existing immutable 40-character Git SHA image tag"
        required: true
        type: string
      sse_runtime_mode:
        description: "Production SSE runtime: preserve, enable, or disable"
        required: true
        default: preserve
        type: choice
        options:
          - preserve
          - enable
          - disable
      payment_runtime:
        description: "Payment runtime: preserve (default), enable, or disable"
        required: false
        default: preserve
        type: choice
        options:
          - preserve
          - enable
          - disable

permissions:
  contents: read

concurrency:
  # 운영 배포는 순서대로 끝낸다. 진행 중인 배포를 취소하면 ECS 상태를 판단하기 어려워진다.
  group: backend-cd-production-ecs
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.AWS_ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.AWS_ECS_SERVICE }}
  ECS_CONTAINER_NAME: backend
  RUNTIME_CONFIG_SECRET_NAME: miriyum/production/backend-runtime-config
  SSE_RUNTIME_SECRET_NAME: miriyum/production/backend-sse-runtime
  QR_STORAGE_GENERATION: ${{ vars.MIRIYUM_QR_STORAGE_GENERATION }}
  MIRIYUM_STORAGE_S3_ENABLED: ${{ vars.MIRIYUM_STORAGE_S3_ENABLED }}
  MIRIYUM_STORAGE_S3_RECONCILIATION_ENABLED: ${{ vars.MIRIYUM_STORAGE_S3_RECONCILIATION_ENABLED }}
  PAYMENT_RUNTIME: ${{ inputs.payment_runtime || 'preserve' }}
  MIRIYUM_PORTONE_STORE_ID: ${{ vars.MIRIYUM_PORTONE_STORE_ID }}
  NOTIFICATION_READ_MINIMUM_COMPATIBLE_SHA: 515531e122ebbce13d8eead4a3ff15a94c25e0b3

jobs:
  verify-source:
    name: verify-production-deployment-source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    outputs:
      deployable: ${{ steps.source.outputs.deployable }}
      image_tag: ${{ steps.source.outputs.image_tag }}
      sse_runtime_mode: ${{ steps.source.outputs.sse_runtime_mode }}

    steps:
      - name: Verify deployment source
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_TAG: ${{ inputs.image_tag }}
          MANUAL_SSE_RUNTIME_MODE: ${{ inputs.sse_runtime_mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sse_runtime_mode="preserve"
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            current_main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')

            if [ "$current_main_sha" != "$WORKFLOW_SHA" ]; then
              echo "deployable=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping stale CI revision $WORKFLOW_SHA; current main is $current_main_sha."
              exit 0
            fi

            image_tag="$WORKFLOW_SHA"
          else
            image_tag="$MANUAL_TAG"
            sse_runtime_mode="$MANUAL_SSE_RUNTIME_MODE"

            case "$sse_runtime_mode" in
              preserve|enable|disable)
                ;;
              *)
                echo "::error::Unsupported production SSE runtime mode: $sse_runtime_mode"
                exit 1
                ;;
            esac

            if ! [[ "$image_tag" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Only a full 40-character Git SHA image tag can be deployed."
              exit 1
            fi

            main_relationship=$(gh api "repos/$GITHUB_REPOSITORY/compare/$image_tag...main" --jq '.status')
            if [ "$main_relationship" != "ahead" ] && [ "$main_relationship" != "identical" ]; then
              echo "::error::Manual deployment SHA must be contained in the current main history."
              exit 1
            fi

            successful_main_ci_runs=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$image_tag&event=push&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "Backend CI" and .head_branch == "main" and .conclusion == "success")] | length')
            if [ "$successful_main_ci_runs" -lt 1 ]; then
              echo "::error::Manual deployment requires a successful Backend CI run for this main SHA."
              exit 1
            fi
          fi

          if ! [[ "$image_tag" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Only a full 40-character Git SHA image tag can be deployed."
            exit 1
          fi

          echo "deployable=true" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "sse_runtime_mode=$sse_runtime_mode" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted production control revision
        if: steps.source.outputs.deployable == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}

      - name: Preserve trusted notification read deployment control
        if: steps.source.outputs.deployable == 'true'
        run: |
          cp scripts/test-notification-read-deployment-gate.py \
            "$RUNNER_TEMP/notification-read-deployment-gate.py"

      - name: Checkout selected production revision
        if: steps.source.outputs.deployable == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.image_tag }}
          fetch-depth: 0

      - name: Verify notification read minimum compatible writer revision
        if: steps.source.outputs.deployable == 'true'
        env:
          DEPLOY_SHA: ${{ steps.source.outputs.image_tag }}
        run: |
          python3 "$RUNNER_TEMP/notification-read-deployment-gate.py" verify-ancestor \
            --minimum-sha "$NOTIFICATION_READ_MINIMUM_COMPATIBLE_SHA" \
            --candidate-sha "$DEPLOY_SHA"

  deploy:
    name: build-and-deploy-backend-production-ecs
    needs: verify-source
    environment: production
    runs-on: ubuntu-24.04
    # ARM64 이미지 빌드, 20분 ECS 안정화와 실패 시 20분 비활성 복구를 모두 수용한다.
    timeout-minutes: 70
    permissions:
      actions: read
      contents: read
      id-token: write
    # Environment 보호 규칙을 실제로 설정한 뒤에만 자동·수동 운영 배포를 연다.
    if: >-
      needs.verify-source.outputs.deployable == 'true' &&
      vars.PRODUCTION_ECS_DEPLOYMENT_ENABLED == 'true'

    steps:
      - name: Checkout trusted production control revision after approval
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}

      - name: Preserve trusted notification read deployment control after approval
        run: |
          cp scripts/test-notification-read-deployment-gate.py \
            "$RUNNER_TEMP/notification-read-deployment-gate.py"

      - name: Checkout selected revision after production approval
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-source.outputs.image_tag }}
          fetch-depth: 0

      - name: Verify selected main revision after production approval
        env:
          DEPLOY_SHA: ${{ needs.verify-source.outputs.image_tag }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')

          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$current_main_sha" != "$DEPLOY_SHA" ]; then
            echo "::notice::Skipping stale CI revision $DEPLOY_SHA after production approval; current main is $current_main_sha."
            exit 1
          fi

          main_relationship=$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEPLOY_SHA...main" --jq '.status')
          if [ "$main_relationship" != "ahead" ] && [ "$main_relationship" != "identical" ]; then
            echo "::error::Selected deployment SHA is no longer contained in the current main history after production approval."
            exit 1
          fi

          successful_main_ci_runs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$DEPLOY_SHA&event=push&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "Backend CI" and .head_branch == "main" and .conclusion == "success")] | length')
          if [ "$successful_main_ci_runs" -lt 1 ]; then
            echo "::error::Selected deployment SHA no longer has a successful Backend CI run for main after production approval."
            exit 1
          fi

      - name: Reverify notification read minimum compatible writer revision
        env:
          DEPLOY_SHA: ${{ needs.verify-source.outputs.image_tag }}
        run: |
          python3 "$RUNNER_TEMP/notification-read-deployment-gate.py" verify-ancestor \
            --minimum-sha "$NOTIFICATION_READ_MINIMUM_COMPATIBLE_SHA" \
            --candidate-sha "$DEPLOY_SHA"

      - name: Validate deployment configuration
        env:
          ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
        run: |
          for value in "$AWS_REGION" "$ECR_REPOSITORY" "$ECS_CLUSTER" "$ECS_SERVICE" "$ROLE_TO_ASSUME"; do
            if [ -z "$value" ]; then
              echo "::error::Required production GitHub Actions variable is not configured."
              exit 1
            fi
          done

          if ! [[ "$QR_STORAGE_GENERATION" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "::error::MIRIYUM_QR_STORAGE_GENERATION must be a non-empty generation identifier."
            exit 1
          fi

          for value in "$MIRIYUM_STORAGE_S3_ENABLED" "$MIRIYUM_STORAGE_S3_RECONCILIATION_ENABLED"; do
            if [ "$value" != "true" ] && [ "$value" != "false" ]; then
              echo "::error::MIRIYUM_STORAGE_S3_ENABLED and MIRIYUM_STORAGE_S3_RECONCILIATION_ENABLED must be true or false."
              exit 1
            fi
          done

          if [ "$MIRIYUM_STORAGE_S3_ENABLED" != "$MIRIYUM_STORAGE_S3_RECONCILIATION_ENABLED" ]; then
            echo "::error::MIRIYUM_STORAGE_S3_ENABLED and MIRIYUM_STORAGE_S3_RECONCILIATION_ENABLED must match."
            exit 1
          fi

          if [ "$PAYMENT_RUNTIME" != "preserve" ] && [ "$PAYMENT_RUNTIME" != "enable" ] && [ "$PAYMENT_RUNTIME" != "disable" ]; then
            echo "::error::payment_runtime must be preserve, enable, or disable."
            exit 1
          fi

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 2

      - name: Require immutable ECR image tags
        run: |
          image_tag_mutability=$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --query 'repositories[0].imageTagMutability' \
            --output text)

          if [ "$image_tag_mutability" != "IMMUTABLE" ]; then
            echo "::error::Production deployment requires an IMMUTABLE ECR repository."
            exit 1
          fi

      - name: Verify S3 activation prerequisites
        if: env.MIRIYUM_STORAGE_S3_ENABLED == 'true'
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          expected_parameter_arn="arn:aws:ssm:${AWS_REGION}:${account_id}:parameter/miriyum/production/storage-s3-bucket"
          parameter_arn=$(aws ssm get-parameter \
            --name /miriyum/production/storage-s3-bucket \
            --query 'Parameter.ARN' \
            --output text)
          if [ "$parameter_arn" != "$expected_parameter_arn" ]; then
            echo "::error::Production S3 bucket Parameter is missing or does not match the expected ARN."
            exit 1
          fi

          current_task_definition=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          task_role_arn=$(aws ecs describe-task-definition \
            --task-definition "$current_task_definition" \
            --query 'taskDefinition.taskRoleArn' \
            --output text)
          execution_role_arn=$(aws ecs describe-task-definition \
            --task-definition "$current_task_definition" \
            --query 'taskDefinition.executionRoleArn' \
            --output text)
          if [ "$task_role_arn" != "arn:aws:iam::${account_id}:role/miriyum-prod-ecs-task-role" ] \
            || [ "$execution_role_arn" != "arn:aws:iam::${account_id}:role/miriyum-prod-ecs-task-execution-role" ]; then
            echo "::error::Production ECS task/execution role does not match the approved S3 policy target."
            exit 1
          fi

          preflight_directory=$(mktemp -d)
          trap 'rm -rf "$preflight_directory"' EXIT
          aws ssm get-parameter \
            --name /miriyum/production/storage-s3-bucket \
            --query 'Parameter' \
            --output json > "$preflight_directory/parameter.json"
          bucket_name=$(jq -r '.Value // empty' "$preflight_directory/parameter.json")
          if [ -z "$bucket_name" ]; then
            echo "::error::Production S3 bucket Parameter is empty."
            exit 1
          fi
          aws s3api get-bucket-location \
            --bucket "$bucket_name" \
            --output json > "$preflight_directory/location.json"
          aws s3api get-bucket-versioning \
            --bucket "$bucket_name" \
            --output json > "$preflight_directory/versioning.json"
          aws s3api get-bucket-encryption \
            --bucket "$bucket_name" \
            --output json > "$preflight_directory/encryption.json"
          aws s3api get-public-access-block \
            --bucket "$bucket_name" \
            --output json > "$preflight_directory/public-access.json"
          aws s3api get-bucket-policy \
            --bucket "$bucket_name" \
            --output json > "$preflight_directory/bucket-policy.json"
          aws iam get-role-policy \
            --role-name miriyum-prod-ecs-task-role \
            --policy-name MiriyumProductionS3FileAccess \
            --query 'PolicyDocument' \
            --output json > "$preflight_directory/task-policy.json"
          aws iam get-role-policy \
            --role-name miriyum-prod-ecs-task-execution-role \
            --policy-name MiriyumProductionStorageParameterRead \
            --query 'PolicyDocument' \
            --output json > "$preflight_directory/execution-policy.json"
          python3 scripts/verify-production-storage-s3-preflight.py \
            --account-id "$account_id" --region "$AWS_REGION" \
            --parameter-json "$preflight_directory/parameter.json" \
            --location-json "$preflight_directory/location.json" \
            --versioning-json "$preflight_directory/versioning.json" \
            --encryption-json "$preflight_directory/encryption.json" \
            --public-access-json "$preflight_directory/public-access.json" \
            --bucket-policy-json "$preflight_directory/bucket-policy.json" \
            --task-policy-json "$preflight_directory/task-policy.json" \
            --execution-policy-json "$preflight_directory/execution-policy.json"

      - name: Verify live waiting history cursor secret mapping
        run: |
          current_task_definition=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          live_task_definition=$(aws ecs describe-task-definition \
            --task-definition "$current_task_definition" \
            --query taskDefinition \
            --output json)

          application_secret_mappings=$(jq -c --arg container "$ECS_CONTAINER_NAME" '
              [.containerDefinitions[]
                | select(.name == $container)
                | .secrets[]?
                | select(.name == "MIRIYUM_DB_URL")]
            ' <<< "$live_task_definition")
          application_secret_mapping_count=$(jq 'length' <<< "$application_secret_mappings")
          if [ "$application_secret_mapping_count" != "1" ]; then
            echo "::error::Production live task must map exactly one MIRIYUM_DB_URL application secret reference."
            exit 1
          fi

          application_secret_value_from=$(jq -r '.[0].valueFrom // ""' <<< "$application_secret_mappings")
          if [[ "$application_secret_value_from" =~ ^(arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+):MIRIYUM_DB_URL::$ ]]; then
            application_secret_arn="${BASH_REMATCH[1]}"
          else
            echo "::error::Production live task MIRIYUM_DB_URL must select its matching Secrets Manager JSON key."
            exit 1
          fi

          waiting_cursor_mappings=$(jq -c --arg container "$ECS_CONTAINER_NAME" '
                [.containerDefinitions[]
                  | select(.name == $container)
                  | .secrets[]?
                  | select(.name == "MIRIYUM_WAITING_HISTORY_CURSOR_SECRET")]
              ' <<< "$live_task_definition")
          waiting_cursor_mapping_count=$(jq 'length' <<< "$waiting_cursor_mappings")
          if [ "$waiting_cursor_mapping_count" != "1" ]; then
            echo "::error::Production live task must map exactly one waiting history cursor secret. Complete #543 before image rollout."
            exit 1
          fi

          waiting_cursor_value_from=$(jq -r '.[0].valueFrom // ""' <<< "$waiting_cursor_mappings")
          expected_waiting_cursor_value_from="${application_secret_arn}:MIRIYUM_WAITING_HISTORY_CURSOR_SECRET::"
          if [ "$waiting_cursor_value_from" != "$expected_waiting_cursor_value_from" ]; then
            echo "::error::Waiting history cursor secret must use the production application secret ARN and its matching JSON key."
            exit 1
          fi

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Check immutable ECR image exists
        id: ecr-image
        env:
          IMAGE_TAG: ${{ needs.verify-source.outputs.image_tag }}
        run: |
          image_count=$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'length(images)' \
            --output text)

          if [ "$image_count" = "1" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU for ARM64 builds
        if: github.event_name == 'workflow_run' && steps.ecr-image.outputs.exists != 'true'
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_run' && steps.ecr-image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and push ARM64 backend image
        if: github.event_name == 'workflow_run' && steps.ecr-image.outputs.exists != 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.verify-source.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Require an existing image for manual deployment
        if: github.event_name == 'workflow_dispatch' && steps.ecr-image.outputs.exists != 'true'
        run: |
          echo "::error::Manual deployment requires an existing immutable ECR image tag."
          exit 1

      - name: Register task definition with the new image
        id: task-definition
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.verify-source.outputs.image_tag }}
          SSE_RUNTIME_MODE: ${{ needs.verify-source.outputs.sse_runtime_mode }}
        run: |
          current_task_definition=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          aws ecs describe-task-definition \
            --task-definition "$current_task_definition" \
            --query taskDefinition \
            --output json > current-task-definition.json

          target_container_count=$(jq --arg container "$ECS_CONTAINER_NAME" \
            '[.containerDefinitions[] | select(.name == $container)] | length' \
            current-task-definition.json)
          if [ "$target_container_count" != "1" ]; then
            echo "::error::Expected exactly one $ECS_CONTAINER_NAME container in the current task definition."
            exit 1
          fi

          llm_enabled=$(jq -r --arg container "$ECS_CONTAINER_NAME" '
            [.containerDefinitions[] | select(.name == $container) | .environment[]?
              | select(.name == "MIRIYUM_STORE_SEARCH_LLM_ENABLED") | .value][0] // "false"
          ' current-task-definition.json)
          if [ "$llm_enabled" != "true" ] && [ "$llm_enabled" != "false" ]; then
            echo "::error::Current task definition has an invalid MIRIYUM_STORE_SEARCH_LLM_ENABLED value."
            exit 1
          fi

          runtime_config_enabled=$(jq -r --arg container "$ECS_CONTAINER_NAME" '
            [.containerDefinitions[] | select(.name == $container) | .environment[]?
              | select(.name == "MIRIYUM_RUNTIME_CONFIG_ENABLED") | .value][0] // "false"
          ' current-task-definition.json)
          if [ "$runtime_config_enabled" != "true" ] && [ "$runtime_config_enabled" != "false" ]; then
            echo "::error::Current task definition has an invalid MIRIYUM_RUNTIME_CONFIG_ENABLED value."
            exit 1
          fi

          sse_enabled=$(jq -r --arg container "$ECS_CONTAINER_NAME" '
            [.containerDefinitions[] | select(.name == $container) | .environment[]?
              | select(.name == "MIRIYUM_SSE_ENABLED") | .value][0] // "false"
          ' current-task-definition.json)

          if [ "$sse_enabled" != "true" ] && [ "$sse_enabled" != "false" ]; then
            echo "::error::Current task definition has an invalid MIRIYUM_SSE_ENABLED value."
            exit 1
          fi

          if [ "$SSE_RUNTIME_MODE" = "enable" ] && [ "$sse_enabled" != "false" ]; then
            echo "::error::Production SSE enable requires the current flag to be false."
            exit 1
          fi

          case "$SSE_RUNTIME_MODE" in
            preserve)
              ;;
            enable)
              sse_enabled="true"
              ;;
            disable)
              sse_enabled="false"
              ;;
            *)
              echo "::error::Unsupported production SSE runtime mode: $SSE_RUNTIME_MODE"
              exit 1
              ;;
          esac
          storage_s3_enabled="$MIRIYUM_STORAGE_S3_ENABLED"
          storage_s3_reconciliation_enabled="$MIRIYUM_STORAGE_S3_RECONCILIATION_ENABLED"
          payment_runtime="$PAYMENT_RUNTIME"

          if [ "$payment_runtime" = "enable" ] && [ -z "$MIRIYUM_PORTONE_STORE_ID" ]; then
            echo "::error::MIRIYUM_PORTONE_STORE_ID must be configured when payment is enabled."
            exit 1
          fi

          payment_cursor_secret_arn=""
          portone_api_secret_arn=""
          if [ "$payment_runtime" = "enable" ]; then
            application_secret_value_from=$(jq -r --arg container "$ECS_CONTAINER_NAME" '
              [.containerDefinitions[] | select(.name == $container) | .secrets[]?
                | select(.name == "MIRIYUM_DB_URL") | .valueFrom][0] // ""
            ' current-task-definition.json)
            if [[ "$application_secret_value_from" =~ ^(arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+):MIRIYUM_DB_URL::$ ]]; then
              application_secret_arn="${BASH_REMATCH[1]}"
            else
              echo "::error::Current task definition MIRIYUM_DB_URL must select its matching Secrets Manager JSON key."
              exit 1
            fi

            payment_cursor_secret_arn="${application_secret_arn}:MIRIYUM_PAYMENT_CURSOR_SECRET::"
            portone_api_secret_arn="${application_secret_arn}:MIRIYUM_PORTONE_API_SECRET::"
          fi

          runtime_config_secret_arn=""
          if [ "$runtime_config_enabled" = "true" ]; then
            runtime_config_secret_arn=$(aws secretsmanager describe-secret \
              --secret-id "$RUNTIME_CONFIG_SECRET_NAME" \
              --query 'ARN' \
              --output text)
            if [ -z "$runtime_config_secret_arn" ] || [ "$runtime_config_secret_arn" = "None" ]; then
              echo "::error::Production runtime config secret was not found."
              exit 1
            fi
          fi

          sse_secret_arn=""
          if [ "$sse_enabled" = "true" ]; then
            sse_secret_arn=$(aws secretsmanager describe-secret \
              --secret-id "$SSE_RUNTIME_SECRET_NAME" \
              --query 'ARN' \
              --output text)
            if [ -z "$sse_secret_arn" ] || [ "$sse_secret_arn" = "None" ]; then
              echo "::error::Production SSE runtime secret was not found."
              exit 1
            fi
          fi

          account_id=$(aws sts get-caller-identity --query Account --output text)
          openai_parameter_arn="arn:aws:ssm:${AWS_REGION}:${account_id}:parameter/miriyum/shared/openai-api-key"
          storage_s3_bucket_parameter_arn="arn:aws:ssm:${AWS_REGION}:${account_id}:parameter/miriyum/production/storage-s3-bucket"

          jq --arg image "$IMAGE_URI" --arg container "$ECS_CONTAINER_NAME" \
            --arg runtime_config_secret_arn "$runtime_config_secret_arn" \
            --arg sse_secret_arn "$sse_secret_arn" \
            --arg sse_runtime "$SSE_RUNTIME_MODE" --arg sse_enabled "$sse_enabled" \
            --arg openai_parameter_arn "$openai_parameter_arn" --arg llm_enabled "$llm_enabled" \
            --arg qr_storage_generation "$QR_STORAGE_GENERATION" \
            --arg runtime_config_enabled "$runtime_config_enabled" \
            --arg storage_s3_enabled "$storage_s3_enabled" \
            --arg storage_s3_reconciliation_enabled "$storage_s3_reconciliation_enabled" \
            --arg storage_s3_bucket_parameter_arn "$storage_s3_bucket_parameter_arn" \
            --arg payment_runtime "$payment_runtime" \
            --arg portone_store_id "$MIRIYUM_PORTONE_STORE_ID" \
            --arg payment_cursor_secret_arn "$payment_cursor_secret_arn" \
            --arg portone_api_secret_arn "$portone_api_secret_arn" \
            --arg aws_region "$AWS_REGION" '
            .containerDefinitions |= map(
              if .name == $container then
                .image = $image
                | .environment = ((.environment // [] | map(select(
                    .name != "MIRIYUM_STORE_SEARCH_LLM_ENABLED"
                    and .name != "MIRIYUM_STORE_SEARCH_LLM_RESPONSE_TIMEOUT_MS"
                    and .name != "MIRIYUM_QR_STORAGE_GENERATION"
                    and .name != "MIRIYUM_RUNTIME_CONFIG_ENABLED"
                    and .name != "MIRIYUM_STORE_SEARCH_LLM_MODEL"
                    and .name != "MIRIYUM_CLOUDWATCH_METRICS_ENABLED"
                    and .name != "MIRIYUM_CLOUDWATCH_METRICS_NAMESPACE"
                    and .name != "MIRIYUM_STORAGE_S3_ENABLED"
                    and .name != "MIRIYUM_STORAGE_S3_RECONCILIATION_ENABLED"
                    and .name != "MIRIYUM_STORAGE_S3_REGION"
                    and .name != "MIRIYUM_PORTONE_WEBHOOK_ENABLED"
                    and (if $sse_runtime == "preserve" then true
                         else .name != "MIRIYUM_SSE_ENABLED"
                           and .name != "MIRIYUM_SSE_CURSOR_SECRET"
                           and .name != "MIRIYUM_SSE_TIMEOUT"
                           and .name != "MIRIYUM_SSE_HEARTBEAT_INTERVAL"
                           and .name != "MIRIYUM_SSE_CORRECTION_INTERVAL"
                           and .name != "MIRIYUM_SSE_CORRECTION_BATCH_SIZE"
                           and .name != "MIRIYUM_SSE_MAX_CONNECTIONS_TOTAL"
                           and .name != "MIRIYUM_SSE_MAX_CONNECTIONS_PER_ACCOUNT"
                         end)
                    and (if $payment_runtime == "preserve" then true
                         else .name != "MIRIYUM_PAYMENT_ENABLED"
                           and .name != "MIRIYUM_PORTONE_STORE_ID"
                         end)
                  ))) + [
                    {name: "MIRIYUM_STORE_SEARCH_LLM_ENABLED", value: $llm_enabled},
                    {name: "MIRIYUM_STORE_SEARCH_LLM_RESPONSE_TIMEOUT_MS", value: "5000"},
                    {name: "MIRIYUM_QR_STORAGE_GENERATION", value: $qr_storage_generation},
                    {name: "MIRIYUM_RUNTIME_CONFIG_ENABLED", value: $runtime_config_enabled},
                    {name: "MIRIYUM_STORE_SEARCH_LLM_MODEL", value: "gpt-4o-mini"},
                    {name: "MIRIYUM_CLOUDWATCH_METRICS_ENABLED", value: "true"},
                    {name: "MIRIYUM_CLOUDWATCH_METRICS_NAMESPACE", value: "MiriYum/Production"},
                    {name: "MIRIYUM_STORAGE_S3_ENABLED", value: $storage_s3_enabled},
                    {name: "MIRIYUM_STORAGE_S3_RECONCILIATION_ENABLED", value: $storage_s3_reconciliation_enabled},
                    {name: "MIRIYUM_STORAGE_S3_REGION", value: $aws_region},
                    {name: "MIRIYUM_PORTONE_WEBHOOK_ENABLED", value: "false"}
                  ] + (if $sse_runtime == "preserve" then [] else
                    [{name: "MIRIYUM_SSE_ENABLED", value: $sse_enabled}]
                  end) + (if $payment_runtime == "enable" then
                    [
                      {name: "MIRIYUM_PAYMENT_ENABLED", value: "true"},
                      {name: "MIRIYUM_PORTONE_STORE_ID", value: $portone_store_id}
                    ]
                  elif $payment_runtime == "disable" then
                    [{name: "MIRIYUM_PAYMENT_ENABLED", value: "false"}]
                  else [] end))
                | .secrets = ((.secrets // [] | map(select(
                    .name != "SPRING_APPLICATION_JSON"
                    and .name != "OPENAI_API_KEY"
                    and .name != "MIRIYUM_STORAGE_S3_BUCKET"
                    and .name != "MIRIYUM_PORTONE_WEBHOOK_SECRET"
                    and (if $sse_runtime == "preserve" then true
                         else .name != "MIRIYUM_SSE_CURSOR_SECRET"
                           and .name != "MIRIYUM_SSE_TIMEOUT"
                           and .name != "MIRIYUM_SSE_HEARTBEAT_INTERVAL"
                           and .name != "MIRIYUM_SSE_CORRECTION_INTERVAL"
                           and .name != "MIRIYUM_SSE_CORRECTION_BATCH_SIZE"
                           and .name != "MIRIYUM_SSE_MAX_CONNECTIONS_TOTAL"
                           and .name != "MIRIYUM_SSE_MAX_CONNECTIONS_PER_ACCOUNT"
                         end)
                    and (if $payment_runtime == "preserve" then true
                         else .name != "MIRIYUM_PAYMENT_CURSOR_SECRET"
                           and .name != "MIRIYUM_PORTONE_API_SECRET"
                         end)
                  ))) + (if $runtime_config_enabled == "true" then
                    [{name: "SPRING_APPLICATION_JSON", valueFrom: $runtime_config_secret_arn}]
                  else [] end) + (if $sse_runtime == "enable" then
                    [
                      {name: "MIRIYUM_SSE_CURSOR_SECRET", valueFrom: ($sse_secret_arn + ":MIRIYUM_SSE_CURSOR_SECRET::")},
                      {name: "MIRIYUM_SSE_TIMEOUT", valueFrom: ($sse_secret_arn + ":MIRIYUM_SSE_TIMEOUT::")},
                      {name: "MIRIYUM_SSE_HEARTBEAT_INTERVAL", valueFrom: ($sse_secret_arn + ":MIRIYUM_SSE_HEARTBEAT_INTERVAL::")},
                      {name: "MIRIYUM_SSE_CORRECTION_INTERVAL", valueFrom: ($sse_secret_arn + ":MIRIYUM_SSE_CORRECTION_INTERVAL::")},
                      {name: "MIRIYUM_SSE_CORRECTION_BATCH_SIZE", valueFrom: ($sse_secret_arn + ":MIRIYUM_SSE_CORRECTION_BATCH_SIZE::")},
                      {name: "MIRIYUM_SSE_MAX_CONNECTIONS_TOTAL", valueFrom: ($sse_secret_arn + ":MIRIYUM_SSE_MAX_CONNECTIONS_TOTAL::")},
                      {name: "MIRIYUM_SSE_MAX_CONNECTIONS_PER_ACCOUNT", valueFrom: ($sse_secret_arn + ":MIRIYUM_SSE_MAX_CONNECTIONS_PER_ACCOUNT::")}
                    ]
                  else [] end) + (if $storage_s3_enabled == "true" then
                    [{name: "MIRIYUM_STORAGE_S3_BUCKET", valueFrom: $storage_s3_bucket_parameter_arn}]
                  else [] end) + (if $llm_enabled == "true" then
                    [{name: "OPENAI_API_KEY", valueFrom: $openai_parameter_arn}]
                  else [] end) + (if $payment_runtime == "enable" then
                    [
                      {name: "MIRIYUM_PAYMENT_CURSOR_SECRET", valueFrom: $payment_cursor_secret_arn},
                      {name: "MIRIYUM_PORTONE_API_SECRET", valueFrom: $portone_api_secret_arn}
                    ]
                  else [] end))
              else . end
            )
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy,
                .deregisteredAt
              )
          ' current-task-definition.json > next-task-definition.json

          updated_container_count=$(jq --arg container "$ECS_CONTAINER_NAME" \
            '[.containerDefinitions[] | select(.name == $container)] | length' \
            next-task-definition.json)
          updated_image=$(jq -r --arg container "$ECS_CONTAINER_NAME" \
            '.containerDefinitions[] | select(.name == $container) | .image' \
            next-task-definition.json)
          if [ "$updated_container_count" != "1" ] || [ "$updated_image" != "$IMAGE_URI" ]; then
            echo "::error::The next task definition does not contain the selected backend image."
            exit 1
          fi

          task_definition_arn=$(aws ecs register-task-definition \
            --cli-input-json file://next-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "arn=$task_definition_arn" >> "$GITHUB_OUTPUT"

      - name: Capture previous ECS task identities
        run: |
          umask 077
          capture_directory=$(mktemp -d)
          previous_task_arns_file="$RUNNER_TEMP/notification-read-previous-task-arns.json"
          trap 'rm -rf "$capture_directory"' EXIT

          capture_previous_task_snapshot() {
            local snapshot_directory="$1"
            local service_file="$snapshot_directory/service.json"
            local running_task_arns_file="$snapshot_directory/notification-read-running-task-arns.json"
            local stopped_task_arns_file="$snapshot_directory/notification-read-stopped-task-arns.json"
            local stopped_tasks_file="$snapshot_directory/notification-read-stopped-tasks.json"
            local selected_task_arns_file="$snapshot_directory/selected-task-arns.json"
            local desired_count
            local -a stopped_task_arns
            local -a batch_task_arns

            mkdir -p "$snapshot_directory" || return 1
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'services[0]' \
              --output json > "$service_file" || return 1
            if ! jq -e '
              .taskDefinition as $service_task_definition
              | (.desiredCount | type == "number")
                and .desiredCount >= 1
                and .runningCount == .desiredCount
                and .pendingCount == 0
                and ([
                  .deployments[]?
                  | select(
                    .status == "PRIMARY"
                    and .rolloutState == "COMPLETED"
                    and .taskDefinition == $service_task_definition
                  )
                ] | length) == 1
                and ([
                  .deployments[]?
                  | select(.rolloutState != "COMPLETED")
                ] | length) == 0
            ' "$service_file" >/dev/null; then
              return 1
            fi
            desired_count=$(jq -r '.desiredCount' "$service_file") || return 1

            aws ecs list-tasks \
              --cluster "$ECS_CLUSTER" \
              --service-name "$ECS_SERVICE" \
              --desired-status RUNNING \
              --query 'taskArns' \
              --output json > "$running_task_arns_file" || return 1
            if ! jq -e --argjson desired_count "$desired_count" \
              'type == "array" and length == $desired_count' \
              "$running_task_arns_file" >/dev/null; then
              return 1
            fi

            aws ecs list-tasks \
              --cluster "$ECS_CLUSTER" \
              --service-name "$ECS_SERVICE" \
              --desired-status STOPPED \
              --query 'taskArns' \
              --output json > "$stopped_task_arns_file" || return 1
            jq -e 'type == "array"' "$stopped_task_arns_file" >/dev/null \
              || return 1

            printf '%s\n' '{"tasks":[],"failures":[]}' > "$stopped_tasks_file" \
              || return 1
            mapfile -t stopped_task_arns < <(jq -r '.[]' "$stopped_task_arns_file")
            for ((offset = 0; offset < ${#stopped_task_arns[@]}; offset += 100)); do
              batch_task_arns=("${stopped_task_arns[@]:offset:100}")
              aws ecs describe-tasks \
                --cluster "$ECS_CLUSTER" \
                --tasks "${batch_task_arns[@]}" \
                --output json > "$snapshot_directory/stopped-tasks-batch.json" \
                || return 1
              jq -s \
                '{
                  tasks: (.[0].tasks + .[1].tasks),
                  failures: (.[0].failures + .[1].failures)
                }' \
                "$stopped_tasks_file" \
                "$snapshot_directory/stopped-tasks-batch.json" \
                > "$snapshot_directory/stopped-tasks-next.json" || return 1
              mv \
                "$snapshot_directory/stopped-tasks-next.json" \
                "$stopped_tasks_file" || return 1
            done

            jq -n \
              --slurpfile running_task_arns "$running_task_arns_file" \
              --slurpfile stopped_task_arns "$stopped_task_arns_file" \
              --slurpfile stopped_tasks "$stopped_tasks_file" \
              '{
                runningTaskArns: $running_task_arns[0],
                stoppedTaskArns: $stopped_task_arns[0],
                stoppedTasks: $stopped_tasks[0]
              }' \
              > "$snapshot_directory/selection-evidence.json" || return 1

            python3 "$RUNNER_TEMP/notification-read-deployment-gate.py" \
              select-previous-ecs-tasks \
              --evidence-json "$snapshot_directory/selection-evidence.json" \
              --output-json "$selected_task_arns_file" || return 1

            jq -n \
              --slurpfile service "$service_file" \
              --slurpfile task_arns "$selected_task_arns_file" \
              '{
                serviceTaskDefinition: $service[0].taskDefinition,
                desiredCount: $service[0].desiredCount,
                taskArns: $task_arns[0]
              }' \
              > "$snapshot_directory/stable-state.json" || return 1
          }

          consecutive_stable_snapshots=0
          previous_snapshot_state=""
          for attempt in $(seq 1 12); do
            snapshot_directory="$capture_directory/snapshot-$attempt"
            if ! capture_previous_task_snapshot "$snapshot_directory"; then
              echo "::error::Stable previous ECS task identity evidence is unavailable."
              exit 1
            fi

            current_snapshot_state="$snapshot_directory/stable-state.json"
            if [ -n "$previous_snapshot_state" ] \
              && cmp -s "$previous_snapshot_state" "$current_snapshot_state"; then
              consecutive_stable_snapshots=$((consecutive_stable_snapshots + 1))
            else
              consecutive_stable_snapshots=1
            fi

            if [ "$consecutive_stable_snapshots" -ge 2 ]; then
              cp "$snapshot_directory/selected-task-arns.json" \
                "$previous_task_arns_file"
              break
            fi

            previous_snapshot_state="$current_snapshot_state"
            sleep 5
          done

          if [ ! -s "$previous_task_arns_file" ]; then
            echo "::error::Previous ECS task identities did not converge."
            exit 1
          fi

      - name: Update ECS service
        env:
          TASK_DEFINITION_ARN: ${{ steps.task-definition.outputs.arn }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION_ARN" \
            --output json >/dev/null

      - name: Wait for ECS service stability
        env:
          TASK_DEFINITION_ARN: ${{ steps.task-definition.outputs.arn }}
        run: |
          # ALB connection draining can exceed the AWS CLI waiter's 10-minute default.
          # Poll for at most 20 minutes instead of relying on the fixed 40-attempt waiter.
          for attempt in $(seq 1 80); do
            service=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'services[0]' \
              --output json)

            primary_task_definition=$(jq -r '.deployments[] | select(.status == "PRIMARY") | .taskDefinition' <<< "$service")
            primary_rollout_state=$(jq -r '.deployments[] | select(.status == "PRIMARY") | .rolloutState // "UNKNOWN"' <<< "$service")
            running_count=$(jq -r '.runningCount' <<< "$service")
            desired_count=$(jq -r '.desiredCount' <<< "$service")
            pending_count=$(jq -r '.pendingCount' <<< "$service")

            if jq -e '.deployments[] | select(.rolloutState == "FAILED")' <<< "$service" >/dev/null; then
              echo "::error::ECS deployment entered FAILED rollout state."
              exit 1
            fi

            if [ "$primary_task_definition" = "$TASK_DEFINITION_ARN" ] \
              && [ "$primary_rollout_state" = "COMPLETED" ] \
              && [ "$running_count" = "$desired_count" ] \
              && [ "$pending_count" = "0" ]; then
              echo "ECS deployment completed with the selected task definition."
              exit 0
            fi

            echo "Waiting for ECS service stability ($attempt/80)..."
            sleep 15
          done

          echo "::error::ECS service did not stabilize within the 20-minute deployment budget."
          exit 1

      - name: Verify production ECS replacement evidence
        env:
          TASK_DEFINITION_ARN: ${{ steps.task-definition.outputs.arn }}
        run: |
          evidence_directory=$(mktemp -d)
          previous_task_arns_file="$RUNNER_TEMP/notification-read-previous-task-arns.json"
          trap 'rm -rf "$evidence_directory"; rm -f "$previous_task_arns_file"' EXIT

          mapfile -t previous_task_arns < <(jq -r '.[]' "$previous_task_arns_file")
          if [ "${#previous_task_arns[@]}" -lt 1 ]; then
            echo "::error::Previous ECS task identity evidence is missing."
            exit 1
          fi

          collect_task_descriptions() {
            local task_arns_file="$1"
            local task_descriptions_file="$2"
            local batch_file="$evidence_directory/$(basename "$task_descriptions_file").batch.json"
            local next_file="$evidence_directory/$(basename "$task_descriptions_file").next.json"
            local -a described_task_arns
            local -a batch_task_arns

            printf '%s\n' '{"tasks":[],"failures":[]}' > "$task_descriptions_file"
            mapfile -t described_task_arns < <(jq -r '.[]' "$task_arns_file")
            for ((offset = 0; offset < ${#described_task_arns[@]}; offset += 100)); do
              batch_task_arns=("${described_task_arns[@]:offset:100}")
              aws ecs describe-tasks \
                --cluster "$ECS_CLUSTER" \
                --tasks "${batch_task_arns[@]}" \
                --output json > "$batch_file"
              jq -s \
                '{
                  tasks: (.[0].tasks + .[1].tasks),
                  failures: (.[0].failures + .[1].failures)
                }' \
                "$task_descriptions_file" \
                "$batch_file" \
                > "$next_file"
              mv "$next_file" "$task_descriptions_file"
            done
          }

          refresh_previous_task_evidence() {
            collect_task_descriptions \
              "$previous_task_arns_file" \
              "$evidence_directory/previous-tasks.json"

            aws ecs list-tasks \
              --cluster "$ECS_CLUSTER" \
              --service-name "$ECS_SERVICE" \
              --desired-status STOPPED \
              --query 'taskArns' \
              --output json > "$evidence_directory/final-stopped-task-arns.json"
            collect_task_descriptions \
              "$evidence_directory/final-stopped-task-arns.json" \
              "$evidence_directory/final-stopped-tasks.json"
          }

          refresh_replacement_evidence() {
            local running_task_arns
            local -a task_arns
            local -a configured_target_group_arns
            local -a primary_target_group_arns
            local -a production_listener_rule_arns
            local target_group_index=0
            local target_group_arn
            local target_health_file
            local traffic_target_group_arns_json

            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'services[0]' \
              --output json > "$evidence_directory/service.json"

            running_task_arns=$(aws ecs list-tasks \
              --cluster "$ECS_CLUSTER" \
              --service-name "$ECS_SERVICE" \
              --desired-status RUNNING \
              --query 'taskArns' \
              --output text)
            read -r -a task_arns <<< "$running_task_arns"
            if [ "${#task_arns[@]}" -lt 1 ]; then
              echo "::error::Active ECS task evidence is missing."
              exit 1
            fi
            aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "${task_arns[@]}" \
              --output json > "$evidence_directory/tasks.json"

            refresh_previous_task_evidence

            mapfile -t configured_target_group_arns < <(
              jq -r '
                .loadBalancers[]?
                | .targetGroupArn,
                  (.advancedConfiguration.alternateTargetGroupArn? // empty)
              ' "$evidence_directory/service.json" | sort -u
            )
            if [ "${#configured_target_group_arns[@]}" -lt 1 ]; then
              echo "::error::ECS target group evidence is missing."
              exit 1
            fi

            mapfile -t primary_target_group_arns < <(
              jq -r '.loadBalancers[]?.targetGroupArn // empty' \
                "$evidence_directory/service.json" | sort -u
            )
            if [ "${#primary_target_group_arns[@]}" -lt 1 ]; then
              echo "::error::ECS primary target group evidence is missing."
              exit 1
            fi
            jq -n \
              --slurpfile service "$evidence_directory/service.json" \
              --slurpfile tasks "$evidence_directory/tasks.json" \
              --slurpfile previous_task_arns "$previous_task_arns_file" \
              --slurpfile previous_tasks "$evidence_directory/previous-tasks.json" \
              --slurpfile stopped_task_arns "$evidence_directory/final-stopped-task-arns.json" \
              --slurpfile stopped_tasks "$evidence_directory/final-stopped-tasks.json" \
              '{
                service: $service[0],
                tasks: $tasks[0],
                previousTaskArns: $previous_task_arns[0],
                previousTasks: $previous_tasks[0],
                stoppedTaskArns: $stopped_task_arns[0],
                stoppedTasks: $stopped_tasks[0],
                trafficTargetGroupArns: [],
                targetHealthByArn: {}
              }' \
              > "$evidence_directory/evidence.json"

            while IFS= read -r target_group_arn; do
              [ -n "$target_group_arn" ] || continue
              target_group_index=$((target_group_index + 1))
              target_health_file="$evidence_directory/target-health-$target_group_index.json"
              aws elbv2 describe-target-health \
                --target-group-arn "$target_group_arn" \
                --output json > "$target_health_file"
              jq --arg arn "$target_group_arn" \
                --slurpfile health "$target_health_file" \
                '.targetHealthByArn[$arn] = $health[0]' \
                "$evidence_directory/evidence.json" \
                > "$evidence_directory/evidence.next.json"
              mv "$evidence_directory/evidence.next.json" "$evidence_directory/evidence.json"
            done < <(printf '%s\n' "${configured_target_group_arns[@]}")

            mapfile -t production_listener_rule_arns < <(
              jq -r '
                .loadBalancers[]?
                | .advancedConfiguration.productionListenerRule? // empty
              ' "$evidence_directory/service.json" | sort -u
            )
            if [ "${#production_listener_rule_arns[@]}" -eq 0 ]; then
              traffic_target_group_arns_json=$(printf '%s\n' "${primary_target_group_arns[@]}" | jq -R . | jq -sc '.')
            else
              aws elbv2 describe-rules \
                --rule-arns "${production_listener_rule_arns[@]}" \
                --output json > "$evidence_directory/production-listener-rules.json"
              traffic_target_group_arns_json=$(jq -c '
                [
                  .Rules[]?.Actions[]?
                  | select(.Type == "forward")
                  | if .ForwardConfig? then
                      .ForwardConfig.TargetGroups[]?
                      | select((.Weight // 1) > 0)
                      | .TargetGroupArn
                    else
                      .TargetGroupArn
                    end
                ] | unique
              ' "$evidence_directory/production-listener-rules.json")
            fi

            if ! jq -e 'length > 0' <<<"$traffic_target_group_arns_json" >/dev/null; then
              echo "::error::Production listener has no active target group."
              exit 1
            fi
            while IFS= read -r target_group_arn; do
              if ! printf '%s\n' "${configured_target_group_arns[@]}" | grep -Fxq "$target_group_arn"; then
                echo "::error::Production listener selected an unexpected target group."
                exit 1
              fi
            done < <(jq -r '.[]' <<<"$traffic_target_group_arns_json")
            jq --argjson traffic_target_group_arns "$traffic_target_group_arns_json" \
              '.trafficTargetGroupArns = $traffic_target_group_arns' \
              "$evidence_directory/evidence.json" \
              > "$evidence_directory/evidence.next.json"
            mv "$evidence_directory/evidence.next.json" "$evidence_directory/evidence.json"
          }

          refresh_replacement_evidence

          verification_output_file="$evidence_directory/verification-output.txt"
          for attempt in $(seq 1 60); do
            if python3 "$RUNNER_TEMP/notification-read-deployment-gate.py" verify-production-ecs \
              --evidence-json "$evidence_directory/evidence.json" \
              --expected-task-definition "$TASK_DEFINITION_ARN" \
              > "$verification_output_file" 2>&1; then
              cat "$verification_output_file"
              break
            fi

            if ! grep -Fq \
              "Notification read deployment gate failed: a previous ECS task has not reached STOPPED" \
              "$verification_output_file"; then
              cat "$verification_output_file"
              exit 1
            fi

            if [ "$attempt" -eq 60 ]; then
              cat "$verification_output_file"
              echo "::error::Previous ECS tasks did not reach STOPPED within the 5-minute evidence budget."
              exit 1
            fi

            echo "Waiting for previous ECS tasks to reach STOPPED ($attempt/60)..."
            sleep 5
            refresh_replacement_evidence
          done
      - name: Disable production SSE after failed enable
        if: >-
          always() &&
          needs.verify-source.outputs.sse_runtime_mode == 'enable' &&
          steps.task-definition.outcome == 'success' &&
          (failure() || cancelled())
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.verify-source.outputs.image_tag }}
        run: |
          recovery_source_task_definition=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          aws ecs describe-task-definition \
            --task-definition "$recovery_source_task_definition" \
            --query taskDefinition \
            --output json > recovery-current-task-definition.json

          recovery_container_count=$(jq --arg container "$ECS_CONTAINER_NAME" \
            '[.containerDefinitions[] | select(.name == $container)] | length' \
            recovery-current-task-definition.json)
          if [ "$recovery_container_count" != "1" ]; then
            echo "::error::SSE recovery requires exactly one $ECS_CONTAINER_NAME container."
            exit 1
          fi

          jq --arg image "$IMAGE_URI" --arg container "$ECS_CONTAINER_NAME" '
            .containerDefinitions |= map(
              if .name == $container then
                .image = $image
                | .environment = ((.environment // [] | map(select(
                    .name != "MIRIYUM_SSE_ENABLED"
                    and .name != "MIRIYUM_SSE_CURSOR_SECRET"
                    and .name != "MIRIYUM_SSE_TIMEOUT"
                    and .name != "MIRIYUM_SSE_HEARTBEAT_INTERVAL"
                    and .name != "MIRIYUM_SSE_CORRECTION_INTERVAL"
                    and .name != "MIRIYUM_SSE_CORRECTION_BATCH_SIZE"
                    and .name != "MIRIYUM_SSE_MAX_CONNECTIONS_TOTAL"
                    and .name != "MIRIYUM_SSE_MAX_CONNECTIONS_PER_ACCOUNT"
                  ))) + [
                    {name: "MIRIYUM_SSE_ENABLED", value: "false"}
                  ])
                | .secrets = (.secrets // [] | map(select(
                    .name != "MIRIYUM_SSE_CURSOR_SECRET"
                    and .name != "MIRIYUM_SSE_TIMEOUT"
                    and .name != "MIRIYUM_SSE_HEARTBEAT_INTERVAL"
                    and .name != "MIRIYUM_SSE_CORRECTION_INTERVAL"
                    and .name != "MIRIYUM_SSE_CORRECTION_BATCH_SIZE"
                    and .name != "MIRIYUM_SSE_MAX_CONNECTIONS_TOTAL"
                    and .name != "MIRIYUM_SSE_MAX_CONNECTIONS_PER_ACCOUNT"
                  )))
              else . end
            )
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy,
                .deregisteredAt
              )
          ' recovery-current-task-definition.json > recovery-next-task-definition.json

          recovery_sse_flag_count=$(jq --arg container "$ECS_CONTAINER_NAME" '
            [.containerDefinitions[] | select(.name == $container) | .environment[]?
              | select(.name == "MIRIYUM_SSE_ENABLED" and .value == "false")]
            | length
          ' recovery-next-task-definition.json)
          recovery_sse_secret_count=$(jq --arg container "$ECS_CONTAINER_NAME" '
            [.containerDefinitions[] | select(.name == $container) | .secrets[]?
              | select(.name | startswith("MIRIYUM_SSE_"))]
            | length
          ' recovery-next-task-definition.json)
          jq -S --arg container "$ECS_CONTAINER_NAME" '
            [.containerDefinitions[] | select(.name == $container) | .environment[]?
              | select(.name | startswith("MIRIYUM_SSE_") | not)] | sort_by(.name)
          ' recovery-current-task-definition.json > recovery-current-non-sse-environment.json
          jq -S --arg container "$ECS_CONTAINER_NAME" '
            [.containerDefinitions[] | select(.name == $container) | .environment[]?
              | select(.name | startswith("MIRIYUM_SSE_") | not)] | sort_by(.name)
          ' recovery-next-task-definition.json > recovery-next-non-sse-environment.json
          jq -S --arg container "$ECS_CONTAINER_NAME" '
            [.containerDefinitions[] | select(.name == $container) | .secrets[]?
              | select(.name | startswith("MIRIYUM_SSE_") | not)] | sort_by(.name)
          ' recovery-current-task-definition.json > recovery-current-non-sse-secrets.json
          jq -S --arg container "$ECS_CONTAINER_NAME" '
            [.containerDefinitions[] | select(.name == $container) | .secrets[]?
              | select(.name | startswith("MIRIYUM_SSE_") | not)] | sort_by(.name)
          ' recovery-next-task-definition.json > recovery-next-non-sse-secrets.json
          recovery_image=$(jq -r --arg container "$ECS_CONTAINER_NAME" '
            .containerDefinitions[] | select(.name == $container) | .image
          ' recovery-next-task-definition.json)
          if [ "$recovery_sse_flag_count" != "1" ] \
            || [ "$recovery_sse_secret_count" != "0" ] \
            || ! cmp -s recovery-current-non-sse-environment.json recovery-next-non-sse-environment.json \
            || ! cmp -s recovery-current-non-sse-secrets.json recovery-next-non-sse-secrets.json \
            || [ "$recovery_image" != "$IMAGE_URI" ]; then
            echo "::error::SSE recovery did not preserve the non-SSE task configuration."
            exit 1
          fi

          recovery_task_definition_arn=$(aws ecs register-task-definition \
            --cli-input-json file://recovery-next-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$recovery_task_definition_arn" \
            --output json >/dev/null

          for attempt in $(seq 1 80); do
            service=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'services[0]' \
              --output json)

            primary_task_definition=$(jq -r '.deployments[] | select(.status == "PRIMARY") | .taskDefinition' <<< "$service")
            primary_rollout_state=$(jq -r '.deployments[] | select(.status == "PRIMARY") | .rolloutState // "UNKNOWN"' <<< "$service")
            running_count=$(jq -r '.runningCount' <<< "$service")
            desired_count=$(jq -r '.desiredCount' <<< "$service")
            pending_count=$(jq -r '.pendingCount' <<< "$service")

            if jq -e '.deployments[] | select(.status == "PRIMARY" and .rolloutState == "FAILED")' \
              <<< "$service" >/dev/null; then
              echo "::error::Production SSE disable recovery entered FAILED rollout state."
              exit 1
            fi

            if [ "$primary_task_definition" = "$recovery_task_definition_arn" ] \
              && [ "$primary_rollout_state" = "COMPLETED" ] \
              && [ "$running_count" = "$desired_count" ] \
              && [ "$pending_count" = "0" ]; then
              echo "Production SSE disable recovery completed."
              exit 0
            fi

            echo "Waiting for production SSE disable recovery ($attempt/80)..."
            sleep 15
          done

          echo "::error::Production SSE disable recovery did not stabilize within 20 minutes."
          exit 1
      - name: Cleanup previous ECS task identity evidence
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notification-read-previous-task-arns.json"
