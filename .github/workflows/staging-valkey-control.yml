name: Staging Valkey Control

on:
  workflow_call:
    inputs:
      action:
        description: "Fixed staging Valkey action: interrupt or recover"
        required: true
        type: string
      image_tag:
        description: "Approved deployed staging backend full SHA"
        required: true
        type: string

permissions:
  contents: read
  deployments: read
  id-token: write

concurrency:
  group: backend-cd-staging
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EC2_INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
  BACKEND_DEPLOYMENT_ENVIRONMENT: staging-backend

jobs:
  control:
    name: apply-fixed-staging-valkey-control
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
      deployments: read
      id-token: write
    steps:
      - name: Validate fixed action and immutable deployed SHA
        env:
          ACTION: ${{ inputs.action }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          expected_caller="$GITHUB_REPOSITORY/.github/workflows/staging-load-test-control.yml@refs/heads/dev"
          if [ "$GITHUB_REF" != "refs/heads/dev" ] || [ "$CALLER_WORKFLOW_REF" != "$expected_caller" ]; then
            echo "::error::Staging Valkey control is allowed only from the reviewed dev control workflow."
            exit 1
          fi

          case "$ACTION" in
            interrupt|recover) ;;
            *) echo "::error::Unsupported staging Valkey control action."; exit 1 ;;
          esac

          if ! [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid immutable image tag. A lowercase 40-character Git SHA is required."
            exit 1
          fi

          for value in "$AWS_REGION" "$EC2_INSTANCE_ID" "$ROLE_TO_ASSUME"; do
            if [ -z "$value" ]; then
              echo "::error::Required staging GitHub Actions variable is not configured."
              exit 1
            fi
          done

          latest_successful_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/deployments?environment=$BACKEND_DEPLOYMENT_ENVIRONMENT&per_page=100" \
            --jq 'sort_by(.created_at) | reverse | .[] | [.id, .sha] | @tsv' \
            | while IFS=$'\t' read -r deployment_id deployment_sha; do
                state=$(gh api \
                  "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=1" \
                  --jq '.[0].state // ""')
                if [ "$state" = "success" ]; then
                  printf '%s' "$deployment_sha"
                  break
                fi
              done)

          if [ -z "$latest_successful_sha" ]; then
            echo "::error::No successful staging backend deployment was found."
            exit 1
          fi
          if [ "$latest_successful_sha" != "$IMAGE_TAG" ]; then
            echo "::error::The approved SHA does not match the latest successful staging backend deployment."
            exit 1
          fi

      - name: Checkout trusted Valkey control revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/dev

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 2

      - name: Run fixed Valkey control through SSM
        id: ssm
        env:
          ACTION: ${{ inputs.action }}
        run: |
          script_base64=$(base64 --wrap=0 scripts/staging-valkey-control.sh)
          remote_script="/tmp/miriyum-staging-valkey-control-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          remote_command="set -Eeuo pipefail; trap 'rm -f ${remote_script}' EXIT; printf %s '${script_base64}' | base64 --decode > '${remote_script}'; chmod 700 '${remote_script}'; VALKEY_CONTROL_ACTION='${ACTION}' bash '${remote_script}'"

          jq -n \
            --arg instance_id "$EC2_INSTANCE_ID" \
            --arg command "$remote_command" \
            '{DocumentName:"AWS-RunShellScript",InstanceIds:[$instance_id],TimeoutSeconds:180,Parameters:{commands:[$command]}}' \
            > "$RUNNER_TEMP/staging-valkey-control.json"

          command_id=$(aws ssm send-command \
            --cli-input-json "file://$RUNNER_TEMP/staging-valkey-control.json" \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for bounded Valkey control result
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          for ((attempt = 0; attempt < 40; attempt++)); do
            status=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$status" in
              Success)
                echo "Staging Valkey control completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "::error::Staging Valkey control failed with status $status. Run recover-valkey before continuing."
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "::error::Staging Valkey control did not finish within the fixed wait window. Run recover-valkey before continuing."
          exit 1
