# EC2 API 사전 배포용 스택이다. 프론트엔드 배포 시 Nginx에 정적 파일 제공을 추가한다.
name: miriyum

services:
  mysql:
    # 데이터베이스는 Docker 네트워크 안에만 두며 호스트 포트를 공개하지 않는다.
    image: mysql:8.0.40
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    # Binary logging 환경에서도 Flyway가 audit trigger를 생성할 수 있게 한다.
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci --log-bin-trust-function-creators=1
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /miriyum/staging/docker
        awslogs-stream: mysql
        awslogs-create-group: "true"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      app:
        # Nginx의 신뢰 프록시 주소 .2를 다른 서비스가 자동 할당받지 않게 고정한다.
        ipv4_address: 172.29.81.10
    restart: unless-stopped

  backend:
    # 배포 시 CD 워크플로가 변경 불가능한 ECR 이미지 태그를 주입한다.
    # deploy.sh가 BACKEND_IMAGE 누락을 먼저 검사하므로 Compose에는 단일 이미지 참조만 둔다.
    image: "${BACKEND_IMAGE}"
    environment:
      MIRIYUM_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      MIRIYUM_DB_USERNAME: ${MYSQL_USER}
      MIRIYUM_DB_PASSWORD: ${MYSQL_PASSWORD}
      MIRIYUM_JWT_SECRET: ${MIRIYUM_JWT_SECRET}
      MIRIYUM_JWT_ISSUER: ${MIRIYUM_JWT_ISSUER}
      MIRIYUM_PLATFORM_OPERATOR_REAUTH_FINGERPRINT_SECRET: "${MIRIYUM_PLATFORM_OPERATOR_REAUTH_FINGERPRINT_SECRET:?MIRIYUM_PLATFORM_OPERATOR_REAUTH_FINGERPRINT_SECRET is required}"
      MIRIYUM_ALLOWED_ORIGIN: ${MIRIYUM_ALLOWED_ORIGIN}
      MIRIYUM_IDENTITY_VERIFICATION_STUB_ENABLED: ${MIRIYUM_IDENTITY_VERIFICATION_STUB_ENABLED}
      MIRIYUM_KAKAO_ENABLED: ${MIRIYUM_KAKAO_ENABLED:-false}
      MIRIYUM_KAKAO_REST_API_KEY: ${MIRIYUM_KAKAO_REST_API_KEY:-}
      MIRIYUM_KAKAO_CLIENT_SECRET: ${MIRIYUM_KAKAO_CLIENT_SECRET:-}
      MIRIYUM_KAKAO_REDIRECT_URIS: ${MIRIYUM_KAKAO_REDIRECT_URIS:-}
      MIRIYUM_KAKAO_STATE_SECRET: ${MIRIYUM_KAKAO_STATE_SECRET:-}
      MIRIYUM_KAKAO_SIGN_UP_TICKET_SECRET: ${MIRIYUM_KAKAO_SIGN_UP_TICKET_SECRET:-}
      MIRIYUM_KAKAO_IDENTITY_FINGERPRINT_ACTIVE_KEY_VERSION: ${MIRIYUM_KAKAO_IDENTITY_FINGERPRINT_ACTIVE_KEY_VERSION:-}
      MIRIYUM_KAKAO_IDENTITY_FINGERPRINT_ACTIVE_SECRET: ${MIRIYUM_KAKAO_IDENTITY_FINGERPRINT_ACTIVE_SECRET:-}
      MIRIYUM_KAKAO_IDENTITY_FINGERPRINT_PREVIOUS_KEY_VERSION: ${MIRIYUM_KAKAO_IDENTITY_FINGERPRINT_PREVIOUS_KEY_VERSION:-}
      MIRIYUM_KAKAO_IDENTITY_FINGERPRINT_PREVIOUS_SECRET: ${MIRIYUM_KAKAO_IDENTITY_FINGERPRINT_PREVIOUS_SECRET:-}
      MIRIYUM_NOTIFICATION_HISTORY_CURSOR_SECRET: "${MIRIYUM_NOTIFICATION_HISTORY_CURSOR_SECRET:?MIRIYUM_NOTIFICATION_HISTORY_CURSOR_SECRET is required}"
      MIRIYUM_REFRESH_RISK_EVENT_DELIVERY_ENABLED: ${MIRIYUM_REFRESH_RISK_EVENT_DELIVERY_ENABLED:-true}
      MIRIYUM_RESERVATION_HOLD_EXPIRATION_ENABLED: ${MIRIYUM_RESERVATION_HOLD_EXPIRATION_ENABLED:-true}
      MIRIYUM_WAITING_CLOSURE_ENABLED: ${MIRIYUM_WAITING_CLOSURE_ENABLED:-false}
      MIRIYUM_WAITING_COMPENSATION_ENABLED: ${MIRIYUM_WAITING_COMPENSATION_ENABLED:-true}
      MIRIYUM_WAITING_COMPENSATION_FIXED_DELAY_MS: ${MIRIYUM_WAITING_COMPENSATION_FIXED_DELAY_MS:-5000}
      MIRIYUM_WAITING_COMPENSATION_INITIAL_DELAY_MS: ${MIRIYUM_WAITING_COMPENSATION_INITIAL_DELAY_MS:-5000}
      MIRIYUM_WAITING_COMPENSATION_RECONCILIATION_DELAY_MS: ${MIRIYUM_WAITING_COMPENSATION_RECONCILIATION_DELAY_MS:-60000}
      MIRIYUM_VALKEY_HOST: ${MIRIYUM_VALKEY_HOST}
      MIRIYUM_VALKEY_PORT: ${MIRIYUM_VALKEY_PORT}
      MIRIYUM_VALKEY_PASSWORD: "${MIRIYUM_VALKEY_PASSWORD:?MIRIYUM_VALKEY_PASSWORD is required}"
      MIRIYUM_QR_STORAGE_GENERATION: "${MIRIYUM_QR_STORAGE_GENERATION:?MIRIYUM_QR_STORAGE_GENERATION is required}"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      # EC2 내부 확인만 가능하도록 127.0.0.1에만 backend 포트를 연결한다.
      - "127.0.0.1:8080:8080"
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /miriyum/staging/docker
        awslogs-stream: backend
        awslogs-create-group: "true"
    networks:
      app:
        # 기존 자동 할당 주소와 겹치지 않는 고정 주소를 사용한다.
        ipv4_address: 172.29.81.11
      # Valkey는 backend만 연결된 별도 내부 네트워크로 접근한다.
      backend-valkey:
    restart: unless-stopped

  valkey:
    # #141은 Valkey 인프라만 구성하고, Refresh Token 기능은 #140에서 연결한다.
    image: valkey/valkey:8.1-alpine
    environment:
      MIRIYUM_VALKEY_PASSWORD: "${MIRIYUM_VALKEY_PASSWORD:?MIRIYUM_VALKEY_PASSWORD is required}"
    command:
      - /bin/sh
      - -ec
      - |
        exec valkey-server \
          --appendonly yes \
          --appendfsync everysec \
          --maxmemory 128mb \
          --maxmemory-policy noeviction \
          --requirepass "$$MIRIYUM_VALKEY_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping 2>&1 | grep -q NOAUTH && REDISCLI_AUTH=\"$$MIRIYUM_VALKEY_PASSWORD\" valkey-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /miriyum/staging/docker
        awslogs-stream: valkey
        awslogs-create-group: "true"
    volumes:
      - valkey-data:/data
    networks:
      # MySQL·Nginx와 분리해 backend 컨테이너만 Valkey에 접근하게 한다.
      backend-valkey:
    restart: unless-stopped

  nginx:
    # Nginx만 외부에 공개하며 /api만 프록시하고 Actuator는 노출하지 않는다.
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "80:80"
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /miriyum/staging/docker
        awslogs-stream: nginx
        awslogs-create-group: "true"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      app:
        ipv4_address: 172.29.81.2
    restart: unless-stopped

volumes:
  mysql-data:
  valkey-data:

networks:
  app:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.81.0/24
  # 호스트와 다른 Compose 서비스에서 접근할 수 없는 backend 전용 네트워크다.
  backend-valkey:
    internal: true
