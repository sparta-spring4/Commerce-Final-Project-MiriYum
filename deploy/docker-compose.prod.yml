# EC2 API 사전 배포용 스택이다. 프론트엔드 배포 시 Nginx에 정적 파일 제공을 추가한다.
name: miriyum

services:
  mysql:
    # 데이터베이스는 Docker 네트워크 안에만 두며 호스트 포트를 공개하지 않는다.
    image: mysql:8.0.40
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - app
    restart: unless-stopped

  backend:
    # 배포 시 CD 워크플로가 변경 불가능한 ECR 이미지 태그를 주입한다.
    # deploy.sh가 BACKEND_IMAGE 누락을 먼저 검사하므로 Compose에는 단일 이미지 참조만 둔다.
    image: "${BACKEND_IMAGE}"
    environment:
      MIRIYUM_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      MIRIYUM_DB_USERNAME: ${MYSQL_USER}
      MIRIYUM_DB_PASSWORD: ${MYSQL_PASSWORD}
      MIRIYUM_JWT_SECRET: ${MIRIYUM_JWT_SECRET}
      MIRIYUM_JWT_ISSUER: ${MIRIYUM_JWT_ISSUER}
      MIRIYUM_ALLOWED_ORIGIN: ${MIRIYUM_ALLOWED_ORIGIN}
      MIRIYUM_IDENTITY_VERIFICATION_STUB_ENABLED: ${MIRIYUM_IDENTITY_VERIFICATION_STUB_ENABLED}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      # EC2 내부 확인만 가능하도록 127.0.0.1에만 backend 포트를 연결한다.
      - "127.0.0.1:8080:8080"
    networks:
      - app
    restart: unless-stopped

  nginx:
    # Nginx만 외부에 공개하며 /api만 프록시하고 Actuator는 노출하지 않는다.
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      app:
        ipv4_address: 172.29.81.2
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  app:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.81.0/24
