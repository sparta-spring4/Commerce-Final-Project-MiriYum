# 로컬 개발 전용 스택이다. staging·production은 ../docker-compose.prod.yml이 소유한다.
#
# production과 다른 점:
# - ECR 이미지를 받지 않고 로컬 소스에서 backend 이미지를 빌드한다.
# - Nginx를 두지 않는다. 로컬 same-origin은 Vite dev server의 /api 프록시가 담당한다.
# - MySQL 호스트 포트를 공개하되 기본 3306을 피한다. 기여자 PC의 기존 MySQL과 충돌하지 않게 한다.
name: miriyum-local

services:
  mysql:
    image: mysql:8.0.40
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      # 호스트에 이미 MySQL이 떠 있어도 충돌하지 않도록 3306이 아닌 포트로 노출한다.
      # DB 도구로 들여다볼 때만 쓰며 backend는 Docker 네트워크 안에서 mysql:3306으로 접속한다.
      - "127.0.0.1:${MYSQL_HOST_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  backend:
    # 로컬 소스를 eclipse-temurin:21 이미지 안에서 빌드하므로 호스트 JDK 버전과 무관하다.
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment:
      MIRIYUM_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      MIRIYUM_DB_USERNAME: ${MYSQL_USER}
      MIRIYUM_DB_PASSWORD: ${MYSQL_PASSWORD}
      MIRIYUM_JWT_SECRET: ${MIRIYUM_JWT_SECRET}
      MIRIYUM_JWT_ISSUER: ${MIRIYUM_JWT_ISSUER}
      MIRIYUM_PLATFORM_OPERATOR_REAUTH_FINGERPRINT_SECRET: ${MIRIYUM_PLATFORM_OPERATOR_REAUTH_FINGERPRINT_SECRET}
      # Vite dev server 오리진과 정확히 같아야 재발급·로그아웃의 Origin 검증이 통과한다.
      MIRIYUM_ALLOWED_ORIGIN: ${MIRIYUM_ALLOWED_ORIGIN}
      # 본인확인 제공업체가 없으므로 로컬에서는 스텁을 켜야 가입이 COMMON_012로 막히지 않는다.
      MIRIYUM_IDENTITY_VERIFICATION_STUB_ENABLED: ${MIRIYUM_IDENTITY_VERIFICATION_STUB_ENABLED}
      MIRIYUM_KAKAO_ENABLED: ${MIRIYUM_KAKAO_ENABLED:-false}
      MIRIYUM_KAKAO_REST_API_KEY: ${MIRIYUM_KAKAO_REST_API_KEY:-}
      MIRIYUM_KAKAO_CLIENT_SECRET: ${MIRIYUM_KAKAO_CLIENT_SECRET:-}
      MIRIYUM_KAKAO_REDIRECT_URIS: ${MIRIYUM_KAKAO_REDIRECT_URIS:-}
      MIRIYUM_KAKAO_STATE_SECRET: ${MIRIYUM_KAKAO_STATE_SECRET:-}
      MIRIYUM_KAKAO_SIGN_UP_TICKET_SECRET: ${MIRIYUM_KAKAO_SIGN_UP_TICKET_SECRET:-}
      MIRIYUM_KAKAO_IDENTITY_FINGERPRINT_ACTIVE_KEY_VERSION: ${MIRIYUM_KAKAO_IDENTITY_FINGERPRINT_ACTIVE_KEY_VERSION:-}
      MIRIYUM_KAKAO_IDENTITY_FINGERPRINT_ACTIVE_SECRET: ${MIRIYUM_KAKAO_IDENTITY_FINGERPRINT_ACTIVE_SECRET:-}
      MIRIYUM_KAKAO_IDENTITY_FINGERPRINT_PREVIOUS_KEY_VERSION: ${MIRIYUM_KAKAO_IDENTITY_FINGERPRINT_PREVIOUS_KEY_VERSION:-}
      MIRIYUM_KAKAO_IDENTITY_FINGERPRINT_PREVIOUS_SECRET: ${MIRIYUM_KAKAO_IDENTITY_FINGERPRINT_PREVIOUS_SECRET:-}
      MIRIYUM_REFRESH_RISK_EVENT_DELIVERY_ENABLED: ${MIRIYUM_REFRESH_RISK_EVENT_DELIVERY_ENABLED:-false}
      MIRIYUM_VALKEY_HOST: valkey
      MIRIYUM_VALKEY_PORT: 6379
      MIRIYUM_VALKEY_PASSWORD: ${MIRIYUM_VALKEY_PASSWORD}
      MIRIYUM_QR_STORAGE_GENERATION: ${MIRIYUM_QR_STORAGE_GENERATION}
      MIRIYUM_STORE_SEARCH_SEMANTIC_ENABLED: ${MIRIYUM_STORE_SEARCH_SEMANTIC_ENABLED:-false}
      MIRIYUM_OPENAI_API_KEY: ${MIRIYUM_OPENAI_API_KEY:-}
      MIRIYUM_QDRANT_BASE_URL: http://qdrant:6333
      MIRIYUM_QDRANT_API_KEY: ${MIRIYUM_QDRANT_API_KEY:-}
      MIRIYUM_SEMANTIC_REBUILD_ENABLED: ${MIRIYUM_SEMANTIC_REBUILD_ENABLED:-false}
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      # 로컬 전용이므로 127.0.0.1에만 바인딩한다.
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1-alpine
    environment:
      MIRIYUM_VALKEY_PASSWORD: ${MIRIYUM_VALKEY_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - |
        exec valkey-server \
          --appendonly yes \
          --maxmemory-policy noeviction \
          --requirepass "$$MIRIYUM_VALKEY_PASSWORD"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$MIRIYUM_VALKEY_PASSWORD\" valkey-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.3
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  mysql-data:
  valkey-data:
  qdrant-data:
