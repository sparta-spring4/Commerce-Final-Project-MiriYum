server {
    listen 80;
    server_name _;

    # 사전 배포 경로는 API만 공개하며, / 경로는 후속 프론트엔드 배포 범위에서 담당한다.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 단일 외부 진입점이므로 클라이언트가 보낸 전달 체인은 보존하지 않는다.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # health 확인은 EC2 내부 전용 주소 127.0.0.1에서 실행하므로 외부에 공개하지 않는다.
    location /actuator/ {
        return 404;
    }

    location / {
        return 404;
    }
}
