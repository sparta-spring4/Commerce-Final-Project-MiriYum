spring:
  application:
    name: miriyum-backend
  datasource:
    url: ${MIRIYUM_DB_URL}
    username: ${MIRIYUM_DB_USERNAME}
    password: ${MIRIYUM_DB_PASSWORD}
  data:
    redis:
      host: ${MIRIYUM_VALKEY_HOST:localhost}
      port: ${MIRIYUM_VALKEY_PORT:6379}
      password: ${MIRIYUM_VALKEY_PASSWORD:}
      timeout: ${MIRIYUM_VALKEY_TIMEOUT:2s}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-real-ip
      protocol-header: x-forwarded-proto
      internal-proxies: '172\.29\.81\.2'

# Docker 배포 확인은 백엔드 127.0.0.1(EC2 내부 전용) 포트의 이 엔드포인트만 사용한다.
management:
  health:
    # Valkey 장애는 Refresh Token 기능만 503으로 닫고, 배포용 앱 health 전체를 DOWN으로 만들지 않는다.
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # 외부에 상태와 세부 구성 요소 정보를 함께 노출하지 않고 UP 또는 DOWN만 반환한다.
      show-details: never

miriyum:
  jwt:
    secret: ${MIRIYUM_JWT_SECRET}
    issuer: ${MIRIYUM_JWT_ISSUER:miriyum}
  security:
    allowed-origin: ${MIRIYUM_ALLOWED_ORIGIN:http://localhost:5173}
  identity-verification:
    dev-stub-enabled: ${MIRIYUM_IDENTITY_VERIFICATION_STUB_ENABLED:false}
  auth:
    # 30초 주기 전달이 10회 연속 실패하면 CloudWatch 로그 기반 운영 알람을 발생시킨다.
    refresh-risk-event-delivery-alert-threshold: ${MIRIYUM_REFRESH_RISK_EVENT_DELIVERY_ALERT_THRESHOLD:10}
  payment:
    enabled: ${MIRIYUM_PAYMENT_ENABLED:false}
    cursor-secret: ${MIRIYUM_PAYMENT_CURSOR_SECRET:}
    portone:
      api-secret: ${MIRIYUM_PORTONE_API_SECRET:}
      webhook-secret: ${MIRIYUM_PORTONE_WEBHOOK_SECRET:}
      store-id: ${MIRIYUM_PORTONE_STORE_ID:}
      base-url: ${MIRIYUM_PORTONE_BASE_URL:https://api.portone.io}
      timeout-policy-version: ${MIRIYUM_PORTONE_TIMEOUT_POLICY_VERSION:portone-v2-v1}
      connect-timeout: ${MIRIYUM_PORTONE_CONNECT_TIMEOUT:1s}
      read-timeout: ${MIRIYUM_PORTONE_READ_TIMEOUT:3s}
  store:
    schedule:
      activation-enabled: ${MIRIYUM_STORE_SCHEDULE_ACTIVATION_ENABLED:true}
      activation-delay-ms: ${MIRIYUM_STORE_SCHEDULE_ACTIVATION_DELAY_MS:1000}
    geocoding:
      base-url: ${MIRIYUM_STORE_GEOCODING_BASE_URL:https://dapi.kakao.com}
      rest-api-key: ${MIRIYUM_KAKAO_LOCAL_REST_API_KEY:}
      connect-timeout-ms: ${MIRIYUM_STORE_GEOCODING_CONNECT_TIMEOUT_MS:1000}
      response-timeout-ms: ${MIRIYUM_STORE_GEOCODING_RESPONSE_TIMEOUT_MS:2000}
  store-search:
    available-candidate-limit: ${MIRIYUM_STORE_SEARCH_AVAILABLE_CANDIDATE_LIMIT:5000}
  rate-limit:
    sign-up:
      max-requests: ${MIRIYUM_RATE_LIMIT_SIGN_UP_MAX_REQUESTS:5}
      window-seconds: ${MIRIYUM_RATE_LIMIT_SIGN_UP_WINDOW_SECONDS:600}
    login:
      max-requests: ${MIRIYUM_RATE_LIMIT_LOGIN_MAX_REQUESTS:5}
      window-seconds: ${MIRIYUM_RATE_LIMIT_LOGIN_WINDOW_SECONDS:600}
    token-refresh:
      max-requests: ${MIRIYUM_RATE_LIMIT_TOKEN_REFRESH_MAX_REQUESTS:30}
      window-seconds: ${MIRIYUM_RATE_LIMIT_TOKEN_REFRESH_WINDOW_SECONDS:60}
    csrf-preparation:
      max-requests: ${MIRIYUM_RATE_LIMIT_CSRF_PREPARATION_MAX_REQUESTS:60}
      window-seconds: ${MIRIYUM_RATE_LIMIT_CSRF_PREPARATION_WINDOW_SECONDS:60}
    public-store-read:
      max-requests: ${MIRIYUM_RATE_LIMIT_PUBLIC_STORE_READ_MAX_REQUESTS:60}
      window-seconds: ${MIRIYUM_RATE_LIMIT_PUBLIC_STORE_READ_WINDOW_SECONDS:60}
  menu:
    schedule:
      enabled: ${MIRIYUM_MENU_SCHEDULE_ENABLED:true}
      batch-size: ${MIRIYUM_MENU_SCHEDULE_BATCH_SIZE:50}
      fixed-delay-ms: ${MIRIYUM_MENU_SCHEDULE_FIXED_DELAY_MS:5000}
      initial-delay-ms: ${MIRIYUM_MENU_SCHEDULE_INITIAL_DELAY_MS:5000}
